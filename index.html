    endingText: '从西奈到摩押——四十年的旷野之路。\n你走过了会幕的荣耀、凡火的教训、\n赎罪日的鲜血、探子的恶信、\n可拉的深渊、磐石的活水——\n直到尼波山顶，望见那应许之地。\n\n但这只是影子。\n铜蛇在旷野被举起来的时候——\n你看见了那将要被举在木头上的。\n巴兰口中说出的星——\n已经在伯利恒升起来了。\n\n旷野结束在摩西的坟前。\n但永生，开始在一座空坟墓前。',
    endingVerse: '申命记 30:19 — 我今日呼天唤地向你作见证。我将生死祸福陈明在你面前，所以你要拣选生命。',
    scenes: {
s1_1: {
  ch:1, chName:'第一章 · 会幕落成', prog:0.02, effect:null,
  narrative: '出埃及后整一年。\n\n正月初一日——会幕完工了。每一根皂荚木柱、每一块染蓝的幔子、每一件精金打成的器皿，都是"照山上指示的样式"。没有任何人在这件事上擅自加添什么，也没有人偷工减料。\n\n你站在营中，看着那用海狗皮遮盖的帐幕——外面粗糙，里面全是精金。\n\n然后云彩从天降下。\n\n那不是普通的云——是白日遮蔽旷野烈日、夜间如火柱照耀全营的那朵云。它从西奈山顶缓缓下降，停在会幕之上。众民屏息。没有人说话。\n\n耶和华的荣光充满了帐幕。\n\n不是一点点光。不是象征性的光辉。是创造天地之主亲自入住的那等荣耀——浓到摩西不能进去。那个曾面对面与神说话的摩西，进不去了。\n\n这帐幕是整个宇宙的中心了——不是埃及的金字塔，不是迦南的巴别塔。是这移动的、不起眼的、用皂荚木和山羊毛搭成的会幕。',
  choices: [
    { text: '走近会幕，想看一眼里面的荣耀。', cons: '你向前迈了一步。云彩浓得化不开，当中仿佛有光——不是太阳的光，是另一种光，暖而不灼。你想起摩西在山上四十天，下来时脸上发光，百姓不敢看他。现在那光就在你面前——隔着一层海狗皮和一幅幔子。你知道不能进去。但你已经离得够近了——近到能感受到那温暖。会幕的奥秘不是人可以研究透的：神住在人中间，却不损毁人的卑微。正如那荆棘——火烧着，荆棘却没有烧毁。', verse: '出埃及记 40:34 — 当时，云彩遮盖会幕，耶和华的荣光就充满了帐幕。', next: 's1_2' },
    { text: '跪下，俯伏在地敬拜。', cons: '你双膝落地。不需要人告诉你该做什么。当云彩降下来的时候，膝盖自己就知道了。你想起西奈山的雷轰和角声——但现在不同。那时是恐惧，现在是同在。不是审判的威严，是家的荣耀。造天地的主，竟然愿意住在会幕里。不是高高在上，不是在至高的天上——就在这里，在以色列营的正中间。两百万人的营盘围着这一顶帐幕。全地的中心，不在埃及，不在巴比伦——在旷野。在会幕。', verse: '出埃及记 40:35 — 摩西不能进会幕，因为云彩停在其上，耶和华的荣光充满了帐幕。', next: 's1_2' }
  ]
},
s1_2: {
  ch:1, chName:'第一章 · 会幕落成', prog:0.06, effect:null,
  narrative: '亚伦——第一任大祭司——从会幕前转过身来。\n\n他穿着那件以弗得：金色、蓝色、紫色、朱红色线织成，肩上两块红玛瑙刻着以色列十二支派的名字。胸牌上十二块宝石，每一块刻着一个儿子的名。他走进会幕，又走出来——将手举起，面向全会众。\n\n他举手为百姓祝福。\n\n那个曾造金牛犊的亚伦。那个曾屈服于群众的亚伦。如今站在耶和华面前，为百姓祝福——因为他的罪已经被祭坛上的血遮盖了。\n\n然后火从耶和华面前出来。不是降在人身上——是降在坛上，烧尽了燔祭和脂油。百姓看见，就都欢呼，俯伏在地。有人说这是出埃及之后最伟大的时刻。荣耀充满会幕，祭物被悦纳，大祭司在祝福。一切看起来完美——正如神最初所设计的那样。\n\n但你知道这只是开始。明天要起行——旷野还很长。',
  choices: [
    { text: '和百姓一同欢呼，俯伏在地。', cons: '欢呼声从你的喉咙里爆发出来——不是因为命令，是因为你再也忍不住了。四百年的奴役，一年的建造。从埃及的泥砖坑到西奈山下的会幕——你亲身经历了这一切。埃及人鞭打你的时候你没哭。红海分开的时候你惊呆了没哭。但现在——在大祭司的祝福声中，在祭坛的火焰里——眼泪突然涌了出来。不是因为悲伤。是因为你知道：神真的住在你们中间。不是概念，不是理论，不是将来的应许——是现在。就在这里。', verse: '利未记 9:23-24 — 摩西、亚伦进入会幕，又出来为百姓祝福，耶和华的荣光就向众民显现。有火从耶和华面前出来，在坛上烧尽燔祭和脂油。众民一见，就都欢呼，俯伏在地。', next: 's1_3' },
    { text: '安静地看着这一切，把画面刻在心里。', cons: '你没有欢呼。你只是静静地站着，看着。有些时刻太重大，喧嚣反而是亵渎。你看着百姓脸上的表情——埃及的灰尘还残留在他们的皱纹里，但此刻那些皱纹被荣耀照亮了。亚伦的手臂举在半空——你忽然意识到：大祭司举起手祝福时，他的手刚好在施恩座与百姓之间。他站在那里，就像一个活的连接点。他后来会跌倒、会失败——但此刻，他是"圣洁"二字最完美的预表。', verse: '利未记 9:22 — 亚伦向百姓举手，为他们祝福。他献了赎罪祭、燔祭、平安祭，就下来了。', next: 's1_3' }
  ]
},
s1_3: {
  ch:1, chName:'第一章 · 会幕落成', prog:0.10, effect:'embers',
  narrative: '夜了。\n\n营中的篝火一处处亮起来。会幕上的云彩在黑暗中发光——不是反射月光，是从里面透出来的光。好像整个帐幕在呼吸。\n\n明天要起行。银号将吹响——那两根锤出来的银号，一根声长是拔营，两根齐吹是招聚会众。你今晚躺在帐棚里，却睡不着。西奈山下的一年结束了。\n\n你回想这一年：会幕的建造、金牛犊的背叛、摩西在山上四十昼夜、立约的血洒在百姓身上。西奈山冒烟、遍地大震动——那声音还在你骨头里回荡。\n\n但明天，你们要离开这座山。不是回到埃及，不是停留原地——是往旷野去。下一站在哪里？没有人知道。只有云柱知道。它在前面走，你们就在后面跟。它停，你们就安营；它收上去，你们就起行。\n\n从今天起，你们生活的全部节律就是：祂动，你动。没有什么比这更简单，也没有什么比这更难。',
  choices: [
    { text: '预备起行——收拾帐棚，等候银号吹响。', cons: '你卷起帐棚——这动作已经重复了无数次。但这次不同。上次你起行是逃离埃及，背后是法老的追兵。这次你起行是跟随云柱，前面是应许之地。你已经学会了一件事：在旷野，不要问明天。吗哪是一天一天降的，云柱是一天一引导的。这四十年你要学的就是一个字——"跟"。不是跑在云柱前面，不是落在后面。是跟。跟得紧，就是信。', verse: '出埃及记 40:36-37 — 每逢云彩从帐幕收上去，以色列人就起程前往；云彩若不收上去，他们就不起程，直等到云彩收上去。', next: 'conn_1_2' },
    { text: '再望一眼会幕——这可能是最后一次看见它。', cons: '你站在营边，回头。会幕在晨光中安静地立着。海狗皮的罩子把它裹得严严实实——外人看不出它与别的帐棚有什么不同。但你知道里面有什么：至圣所、施恩座、法版、金灯台、陈设饼的桌子。全宇宙最神圣的地方——被海狗皮遮着。这大概就是神的做事风格：最荣耀的，裹在最平凡的里面。正如有一天，最荣耀的那一位——将会裹在马槽的布中。', verse: '民数记 9:17 — 云彩在哪里停住，以色列人就在那里安营。', next: 'conn_1_2' }
  ]
},
s2_1: {
  ch:2, chName:'第二章 · 凡火', prog:0.13, effect:null,
  narrative: '拿答和亚比户——亚伦的儿子，刚刚在七十长老中上过西奈山，看见过以色列的神。他们脚下仿佛有平铺的蓝宝石，如同天色明净。他们观看神——又吃又喝。\n\n但现在，他们各拿自己的香炉，盛上火，加上香，在耶和华面前献上"凡火"。\n\n"凡火"——希伯来原文是"陌生的火、异样的火"。不是神指定的那从祭坛上取来的火。是哪里的火？可能是自己生的火，也可能是别处的火。经文没有说。但有一个字很重要——"自己的"香炉。\n\n他们不是不信神。他们是祭司。他们刚刚被膏立。他们穿着圣衣。但他们做的事，是耶和华"没有吩咐他们的"。\n\n你在营中看着他们走向会幕，香炉握在手中，步伐自信。没有人拦住他们——亚伦没有，摩西没有。或许没有人觉得有什么不对。毕竟——献香不就是献香吗？火有什么分别？\n\n圣洁的第一个功课：不是"多做"——是"照祂说的做"。',
  choices: [
    { text: '观看——他们是大祭司的儿子，应该不会有问题吧？', cons: '你和其他人一样，看着他们走进会幕的院子。他们的圣衣在阳光下闪光——蓝色、紫色、朱红色线织成。谁能怀疑他们？他们比任何人都更接近神。但正是亲近的人——最亲近的人——犯了最致命的错误。越是靠近圣洁的，越不能模糊圣与俗的界限。他们不是不懂。他们是知道的——但他们觉得"没什么大不了"。从什么时候开始，我们对"没什么大不了"的事不再恐惧了？', verse: '利未记 10:1 — 亚伦的儿子拿答、亚比户各拿自己的香炉，盛上火，加上香，在耶和华面前献上凡火，是耶和华没有吩咐他们的。', next: 's2_2' },
    { text: '感到不安——这火不对，不是从祭坛上取的。', cons: '你的直觉在拉响警报。你想起摩西在会幕的每一项上都反复强调"照耶和华所吩咐摩西的"。不多——献香不能用别的火。不少——不能省略坛上的火。这不是"差不多就行"。在圣洁的事上，差不多就是差很多。香炉里的火，只能从一个地方来——祭坛。那坛上的火是神亲自点燃的，从未熄灭。人的火再热，也不能代替神的火。但你还没来得及说什么——一切都已经发生了。', verse: '利未记 10:1 — 在耶和华面前献上凡火，是耶和华没有吩咐他们的。', next: 's2_2' }
  ]
},
s2_2: {
  ch:2, chName:'第二章 · 凡火', prog:0.17, effect:'embers',
  narrative: '火从耶和华面前出来。\n\n不是降在坛上——不是悦纳的记号。是降在他们身上。拿答和亚比户——亚伦的长子和次子——就死在耶和华面前。\n\n在会幕门口。穿着圣衣。手里还握着香炉。\n\n你听见亚伦的呼吸停了一拍。那不是一个父亲正常的反应——那是一个人被雷击中后、还没有感觉到疼痛的空白。他站在那里，两个儿子倒在面前，什么都不能做。\n\n摩西开口了。他说的不是安慰的话——\n\n"这就是耶和华所说：「我在亲近我的人中要显为圣；在众民面前，我要得荣耀。」"\n\n这不是解释。这是引述。是神早就说过的话。摩西的意思是：这不是意外，不是"神发怒失控"——这是圣洁的必然逻辑。离神越近，越不能拿神的圣洁开玩笑。同一位火——降在坛上悦纳祭物，降在人身上击杀僭越者。同一团火，两面。爱和圣洁从不分离。',
  choices: [
    { text: '看亚伦——他失去了两个儿子，却不能说一句话。', cons: '亚伦的脸上没有表情。不是镇定，是空。你无法想象一个父亲此刻应该有什么反应。他的两个儿子死了——在他眼前，在会幕门口。但利未记10:6说：不可蓬头散发，不可撕裂衣裳。大祭司不能像普通人那样举哀。为什么？因为他是受膏的——膏油在他头上。他的悲伤必须让位给神的圣洁。这不是残忍。这是在说一件残酷但真实的道理：圣洁的代价可能非常私人，非常疼痛。亚伦默默不言。有时候最响亮的顺服，就是沉默。', verse: '利未记 10:3 — 摩西对亚伦说："这就是耶和华所说：我在亲近我的人中要显为圣；在众民面前，我要得荣耀。"亚伦就默默不言。', next: 's2_3' },
    { text: '看摩西——他在说什么？这个时候引用律法？', cons: '摩西没有掉眼泪。他转述了耶和华的话。这看起来很冷硬——但摩西不是没有感情的人。他曾为百姓代求"倘或你肯赦免他们的罪……不然，求你从你所写的册上涂抹我的名"。他知道死亡意味着什么。但此刻他站在会幕前——如果他软化了，百姓就会以为拿答和亚比户只是一场事故。不是事故。是圣洁的界线被踩到时发出的响声。摩西在用最坚硬的方式告诉全营：神不是可以随便接近的。亲近祂，必须按祂的方式。', verse: '利未记 10:3 — "我在亲近我的人中要显为圣。"', next: 's2_3' }
  ]
},
/* ── Chapter 2: 凡火 · 圣与俗 (continued) ── */
s2_3: {
  ch:2, chName:'第二章 · 凡火', prog:0.21, effect:null,
  narrative: '亚伦默默不言。\n\n"默默不言"——希伯来文是一个很重的词，不单是沉默，是"呆住、不动、无法出声"。他经历了出埃及、过红海、看见金牛犊下的狂欢、看见摩西摔碎法版——但这是第一次，他完全不出声。\n\n两个儿子死在会幕门口。大祭司不能举哀。利未记10:6说不可蓬头散发、不可撕裂衣裳——不是因为他不痛，是因为膏油在他头上。圣别的记号盖过了人类的悲恸。\n\n你忽然意识到一件事：圣洁不是温情。不是你想的那样——神应该"网开一面"、应该"看在他们是新手的分上"、应该"考虑亚伦的感受"。圣洁不做交易。\n\n但你不知道亚伦心里在想什么。他是觉得神太过分了？还是明白他的儿子们做了一件不可做的事？经文没有告诉我们。只有沉默。\n\n很多时候，圣洁的功课是在沉默中学到的——不是解答了所有疑问之后，是带着疑问跪在神面前的时候。',
  choices: [
    { text: '继续观看——想知道亚伦最终会怎样。', cons: '你继续站在人群中。没有人离开。没有人敢离开。两个祭司死了，但会幕还在那里。云彩还在那里。圣洁没有因为人的失败而打折扣——这才是最可怕的。你以为神会降低标准来迁就人的软弱——但祂没有。祂的圣洁不变。这很难接受，但这正是你能信靠祂的原因：祂不会今天说一套、明天说另一套。凡火就是凡火。永远都是。亚伦的沉默，或许是他一生中最伟大的一次顺服。', verse: '利未记 10:6-7 — 摩西对亚伦和他儿子以利亚撒、以他玛说："不可蓬头散发，也不可撕裂衣裳……你们也不可出会幕的门，恐怕你们死亡，因为耶和华的膏油在你们身上。"他们就照摩西的话行了。', next: 'conn_2_3' },
    { text: '转身离去——这太沉重了，你看不下去了。', cons: '你转身挤出人群。胸口闷得慌。这不是那个在红海边跳舞的神——或者，这恰恰是同一位神？同一个神把埃及的长子杀了，把红海合了，现在又把两个祭司杀了——你忽然发现你对神的认识太浅了。你以为圣洁是祂的属性之一，可以和其他属性（慈爱、恩典、怜悯）分开——但不是。祂的每一件作为都同时是慈爱的、是公义的、是圣洁的。拿答和亚比户的死，不是一个愤怒的神失控——是一个圣洁的神在说"我是谁"。你走回自己的帐棚，很久没有说话。但你知道你开始真正认识祂了。', verse: '利未记 10:3 — 亚伦就默默不言。', next: 'conn_2_3' }
  ]
},
s3_1: {
  ch:3, chName:'第三章 · 赎罪日', prog:0.24, effect:null,
  narrative: '七月初十日。一年只有这一天。\n\n你看见大祭司脱下那件华美的金蓝色圣衣——以弗得、胸牌、外袍、内袍——一件一件脱下。然后穿上纯白的细麻布袍子。不再是荣耀。是卑微。\n\n先为自己和本家献上赎罪祭。公牛的血带入幔内——弹在东面的施恩座上，又弹在施恩座前七次。大祭司自己也需要赎罪——他不是无罪的。他必须先处理好自己的罪，才能处理百姓的罪。这是利未记祭司制度与耶稣祭司职分最根本的区别：地上的大祭司要为自己献祭，天上的大祭司无需为自己献祭。\n\n然后他走向那两只公山羊。两隻都站在会幕门口。一模一样。但命运截然不同。\n\n你屏住呼吸等着。拈阄。不是人决定哪隻死、哪隻活——是耶和华决定。',
  choices: [
    { text: '看第一只羊——那"归于耶和华"的。', cons: '你的目光落在那只被选中的羊身上。它不知道自己的命运——但你知道。它的血将要被带入幔内，弹在施恩座上。不是弹在人身上——你注意到这个细节了吗？血是弹在神面前。赎罪首先是面向神的。不是让人感觉好些——是让神的愤怒得以平息。这只羊代替了百姓。它死，他们活。你看着祭坛上的血，忽然意识到：这血还不够。一年后还要再来。永远不够。', verse: '利未记 16:15 — 随后他要宰那为百姓作赎罪祭的公山羊，把羊的血带入幔子内，弹在施恩座的上面和前面。', next: 's3_2' },
    { text: '看第二只羊——那"归于阿撒泻勒"的。', cons: '这只羊还活着。它站在会幕门口，被绳索牵着，不知道等会儿要被送到哪里去。"阿撒泻勒"——这个词在圣经中只出现在赎罪日的条例里。有说是指"完全除去"，有说是指"悬崖峭壁"——那只羊最终被带到无人之地。不管字义如何，有一点很清楚：这只羊不流血，但它背负着全民族的罪，被送到无人之境。罪不是被"包容"了，是被"带走"了。永远不再回来。你心里忽然有一个问题：那只羊会自己跑回来吗？不会。罪认了，就不要再捡回来。', verse: '利未记 16:10 — 但那拈阄归于阿撒泻勒的羊要活着安置在耶和华面前，用以赎罪，打发人送到旷野去，归于阿撒泻勒。', next: 's3_2' }
  ]
},
s3_2: {
  ch:3, chName:'第三章 · 赎罪日', prog:0.28, effect:null,
  narrative: '拈阄。\n\n两块石头——或者两块木片——在祭司手中摇动、跳出。一块刻着"归于耶和华"。一块刻着"归于阿撒泻勒"。\n\n归于耶和华的——杀了。血盛在盆中。大祭司独自一人带着血进入至圣所。你站在外面，看不见里面。只有焚烧香的烟从幔子缝隙中透出来——香气浓厚，充满整个会幕。没有香，大祭司不能进入至圣所。\n\n血弹在施恩座上。一下。又一下。共七次——这是圣约的完整数字。血落在纯金的施恩座盖上，遮盖了约柜里的法版。法版定人的罪——施恩座上的血遮盖了人的罪，叫神能向人施恩而不至不义。\n\n你忽然明白了：这血不是弹在人身上。是弹在神面前。赎罪的次序是先对神、后对人。人需要的不是"自我感觉良好"，是"在神面前罪得遮盖"。\n\n施恩座上两个基路伯面对面——翅膀彼此连接，眼睛向下看着施恩座。他们在看什么？在看血。在看那替代的生命。',
  choices: [
    { text: '望向至圣所——虽然看不见里面。', cons: '你盯着那幅幔子。蓝色、紫色、朱红色线织成，上面绣着基路伯。你想起会幕的布局：从铜祭坛开始，经过洗濯盆，进入圣所——金灯台的光、陈设饼的粮、金香坛的烟——然后，至圣所。但你不能进去。那幅幔子拦住了你。只有大祭司一年一次带血进去。幔子在说一件事：路还没有完全打开。罪的问题还没有彻底解决。你需要的不只是一年一次的血——你需要一个能把幔子从上面裂开的大祭司。你望着幔子，不知道那一天还有多远。', verse: '利未记 16:14 — 也要取些公牛的血，用指头弹在施恩座的东面，又在施恩座的前面弹血七次。', next: 's3_3' },
    { text: '看另一只羊——它还在门口等着。', cons: '归于"阿撒泻勒"的公山羊还站在那里。它一直活着——在整个宰杀、弹血的过程中，它都在。但它不是被遗忘了。它有它自己的角色。一隻是死亡——代替的死亡。一隻是放逐——罪的放逐。两只合在一起才是完整的赎罪。没有血——罪不能被遮盖。没有放逐——罪没有被除去。你需要二者。将来那一天，会有人同时担任这两只羊的角色——祂既流血，也把罪带到了无人之地。', verse: '利未记 16:8 — 亚伦要为那两只公山羊拈阄：一阄归于耶和华，一阄归于阿撒泻勒。', next: 's3_3' }
  ]
},
s3_3: {
  ch:3, chName:'第三章 · 赎罪日', prog:0.32, effect:'embers',
  narrative: '归于"阿撒泻勒"的羊还活着。\n\n亚伦从至圣所出来——衣服上或许溅了血。他双手按在活羊的头上。那双手——刚刚在幔内弹过血的手——现在按在羊毛上，沉甸甸的。\n\n他开口承认以色列人诸般的罪孽、过犯——就是他们一切的罪愆。\n\n你听见了那些罪的名字。拜偶像的罪。不信的罪。发怨言的罪。贪恋的罪。背叛的罪。有些你犯过，有些你旁观——但此刻都从大祭司的口中被指名认出来。不是笼统的"赦免我们一切的罪"，不是一句带过。是逐件、逐项。\n\n然后——所派之人把羊送往旷野。\n\n无人之地。\n\n羊越走越远，变成旷野中一个小小的白点。然后消失。你目送它消失在地平线上——罪的重量，被带走了。不是被容忍，不是被搁置——是被带走了。到一个永远找不回来的地方。\n\n"东离西有多远，祂叫我们的过犯也离我们有多远。"\n\n将来那一位——施洗约翰指着祂说："看哪，神的羔羊，除去世人罪孽的。"',
  choices: [
    { text: '目送羊离去——直到看不见。', cons: '你站在营边，看着那人和羊消失在旷野的远方。地平线吃掉了最后一个白点。你心里有一种奇异的轻松——好像真的有什么东西被拿走了。不是因为你的虔诚，不是因为你的眼泪——是因为那两只羊。一只替你死了，一只把你的罪背到了无人之地。你什么也没做。只是站着，看着。这就是赎罪的奥秘——你不需要加上什么。替代者已经做完了。你唯一需要做的，就是接受替代。', verse: '利未记 16:21-22 — 两手按在羊头上，承认以色列人诸般的罪孽过犯，就是他们一切的罪愆，把这罪都归在羊的头上，藉着所派之人的手，送到旷野去。要把这羊放在旷野，这羊要担当他们一切的罪孽，带到无人之地。', next: 's3_4' },
    { text: '跪下——罪被带走了，你只能俯伏。', cons: '你的膝盖弯下来。旷野的风吹过，带着尘土的味道。你知道一年后还要再回来——这血还不够，还不完全。但这不妨碍你此刻俯伏。不完全的赎罪，仍然是赎罪。影子也是从光来的。你跪在沙地上，心里有一个声音——不是听见的，是感觉到的："将来有一天，不用再一年一次。将来有一天，来一次，永远完成。"你跪了很久。起来的时候膝盖上全是沙，但心里干净了。', verse: '利未记 16:30 — 因在这日要为你们赎罪，使你们洁净。你们要在耶和华面前得以洁净，脱尽一切的罪愆。', next: 's3_4' }
  ]
},
s3_4: {
  ch:3, chName:'第三章 · 赎罪日', prog:0.35, effect:null,
  narrative: '赎罪日结束了。\n\n幔子还在。至圣所的路一年只开一次。你隐约感到——这血还不够。公牛和山羊的血，断不能除罪。它们不过是将来美事的影儿，不是本物的真像。\n\n你站在会幕外，想着那两只羊——一死、一放。它们做了它们能做的：暂时遮盖了罪，暂时把罪带走了。但它们不能永远解决罪。明年赎罪日，大祭司还要再来——脱去华美的圣衣，穿上细麻布的袍子，带着公牛和山羊的血，再次进入至圣所。\n\n但你隐约感到——将来有一天，会有一位大祭司，不是带着山羊的血，不是带着公牛的血，而是带着自己的血。不是进入地上的圣所，而是进入天上的真帐幕。一次进入——不是一年一次，是一次。永远完成。\n\n那时，幔子将从上到下裂为两半。路开了。\n\n但现在——你知道还要等待。还要在旷野中行走。带着应许，也带着不完全。',
  choices: [
    { text: '等待那一天——虽然不知道要等多久。', cons: '等待。这是你最不擅长的事。四百三十年等出埃及——你觉得够久了。但现在你意识到，从羊的血到人的血，还要等更久。你不明白为什么神不能现在就完成——为什么要用影儿、预表、不完全的祭物来让人等。但你学会了不追问。有些答案不是用来理解的，是用来在等待中被改变的。等待让你学会了一件事：你不是神。祂的时间，长过你的想象——但也准过你的想象。', verse: '希伯来书 10:4 — 因为公牛和山羊的血，断不能除罪。', next: 'conn_3_4' },
    { text: '回到营中——生活还要继续，旷野还要走。', cons: '你转身走回营地。赎罪日是神圣的，但明天你要继续捡吗哪。神圣与日常从来不分家——正是这每天的行走，构成了四十年的朝圣。在祭坛前跪下来容易——在沙土中走四十年，每天捡吗哪、每天打包帐棚、每天跟着云柱起行，却从不怀疑神忘记了祂的应许——这才是信。你走进帐棚，躺下来。天黑了。云彩还在会幕上。明天还要起行。', verse: '希伯来书 9:11-12 — 但现在基督已经来到，作了将来美事的大祭司……并且不用山羊和牛犊的血，乃用自己的血，只一次进入圣所，成了永远赎罪的事。', next: 'conn_3_4' }
  ]
},
s4_1: {
  ch:4, chName:'第四章 · 贪欲与毁谤', prog:0.38, effect:null,
  narrative: '站13·基博罗哈他瓦——"贪欲之人的坟墓"。\n\n离开西奈第三天。你听见营中哭号声——不是小孩哭，是大人。各家在各家的帐棚门口哭号。\n\n"谁给我们肉吃呢？"\n\n"我们记得在埃及的时候——不花钱就吃鱼。还有黄瓜、西瓜、韭菜、葱、蒜。"\n\n"现在我们的心血枯竭了——除这吗哪以外，在我们眼前并没有别的东西。"\n\n吗哪——那清晨降下、滋味像蜜糖薄饼、从天而来的粮食——被嫌弃了。不是因为不好吃。是因为天天吃。他们厌烦的不是吗哪，是每天都要依靠神才能活着。埃及不用依靠神——埃及有尼罗河、有收成、有肉锅。虽然他们当时是奴隶。\n\n你弯腰从地上捡起一片吗哪。白色、细小、圆圆的一小片。放进嘴里——甜的。这是神从天上降下来的粮食。天使的食物。但他们说：淡薄了。',
  choices: [
    { text: '捡起吗哪——它还是甜的，从未改变。', cons: '你将吗哪托在掌心。早晨的阳光透过它薄薄的边缘。你放进嘴里——还是甜的，像掺了蜜的薄饼。它从未变过。改变的不是吗哪，是人。人吃腻了恩典，就开始怀念埃及的韭菜和蒜。这是人心最荒唐的逻辑：宁可做有韭菜吃的奴隶，不愿做只吃吗哪的自由人。你忽然意识到——你对神的供应厌烦过多少次？不是因为祂供应得不好，是因为你想要的不是供应，是放纵。吗哪的甜味还在嘴里。你决定不再参与那场哭号。', verse: '民数记 11:5-6 — 我们记得在埃及的时候，不花钱就吃鱼，也记得有黄瓜、西瓜、韭菜、葱、蒜。现在我们的心血枯竭了，除这吗哪以外，在我们眼前并没有别的东西。', next: 's4_2' },
    { text: '去找摩西——这样下去要出事的。', cons: '你穿过营中哭号的人群。他们坐在各自的帐棚门口，像一群在丧礼上哭丧的人。摩西在会幕门口。他的脸看起来累极了——那种被一群永远长不大的人耗尽了的疲惫。他向耶和华说："这百姓岂是我怀的胎？岂是我生下来的？你竟对我说：把他们抱在怀里……管理这百姓的重任太大了，我独自担当不起。"一个带领者也有被掏空的时候。你忽然意识到，在旷野里——需要扶持的，不只是百姓。也是那个替你代求的人。', verse: '民数记 11:11-14 — 摩西对耶和华说："你为何苦待仆人……管理这百姓的责任太重了，我独自担当不起。"', next: 's4_2' }
  ]
},
s4_2: {
  ch:4, chName:'第四章 · 贪欲与毁谤', prog:0.41, effect:null,
  narrative: '耶和华对摩西说："要叫百姓自洁——明天你们必有肉吃。你们不止吃一天、两天、五天、十天、二十天——要吃一个整月，甚至肉从你们鼻孔里喷出来，使你们厌恶了。因为你们厌弃住在你们中间的耶和华。"\n\n有风从耶和华那里刮起——鹌鹑从海面飞来。遮满全营。离地约二肘——大概到你腰部那么高。遍地都是鹌鹑。百姓起来，终日终夜，并次日一整天，捕取鹌鹑。最少的人也取了十贺梅珥——十贺梅珥！那是两千多升。贪欲张开了口。\n\n但肉在他们牙齿之间尚未嚼烂——\n\n耶和华的怒气发作。用最重的灾殃击杀了他们。\n\n那些起贪欲之心的人，倒在那里。\n\n那地方从此叫"基博罗哈他瓦"——贪欲之人的坟墓。因为他们把那些起贪欲之心的人葬在那里。\n\n吗哪还在。每日清晨照常降下。神没有因为人的背叛收回祂的供应——但人要为贪欲负责。',
  choices: [
    { text: '掩面——不敢看那些倒下的人。', cons: '你闭上眼睛，但声音关不住。倒下的闷响，亲人的尖叫，营中的混乱。鹌鹑还在地上——刚刚是他们哭着要的肉，现在沾着沙土躺在地上，没有人碰。贪欲的终极讽刺：你想要的，得到了——然后成了你的坟墓。不是神不给。是祂给了，人在贪婪中吃掉了自己。基博罗哈他瓦。这座坟没有墓碑——贪欲本身就是碑。你心里默默记下：永远不要因为恩典太日常，就觉得它不是恩典。', verse: '民数记 11:33-34 — 肉在他们牙齿之间，尚未嚼烂。耶和华的怒气就向他们发作，用最重的灾殃击杀了他们。那地方便叫作基博罗哈他瓦，因为他们在那里葬埋那起贪欲之心的人。', next:'s10_1' },
    { text: '数点倒下的人——到底多少人？', cons: '你不敢数。也不需要数。贪欲之人的坟墓足够大了。圣经没有写具体数字——不是所有数字都需要被记录。但你知道，那些倒下的，正是刚刚哭号得最大声的人。他们以为自己只是在表达正常的渴望——"不就是吃顿肉吗？"但神看见了渴望底下的东西：厌弃。不是厌弃吗哪——是厌弃那赐吗哪的。凡以祂为不可信的，迟早也以祂为不可爱的。基博罗哈他瓦。记住这个名字。', verse: '民数记 11:34 — 那地方便叫作基博罗哈他瓦。', next:'s10_1' }
  ]
},
s5_1: {
  ch:5, chName:'第五章 · 探子', prog:0.45, effect:null,
  narrative: '多年以后。站33·加低斯——"圣所"。\n\n十二探子窥探迦南四十天回来了。他们从南地上去，到了希伯仑——亚伯拉罕、以撒、雅各葬在那里。他们砍了一根葡萄枝，上头有一挂葡萄，两个人用杠抬着。又带了些石榴和无花果。\n\n全营沸腾了。\n\n"那地果然是流奶与蜜之地！"\n\n探子们站在全会众面前。十二个人。十二个支派。十二份报告。你站在人群中，等着他们继续往下说。那挂葡萄在你眼前晃动——两个人抬着！那地的果子有多大？\n\n但迦勒举手叫百姓安静。他的眼神告诉你——不是所有人都准备说好消息。空气突然紧绷。',
  choices: [
    { text: '听他们继续说——那地到底怎样？', cons: '你竖起耳朵。探子们继续说——"然而住那地的民强壮，城邑也坚固宽大。并且我们在那里看见了亚衲族人——就是巨人。亚玛力人住在南地；赫人、耶布斯人、亚摩利人住在山地；迦南人住在海边并约旦河旁。"空气变了。刚才还在沸腾的人群安静下来。那挂葡萄忽然看起来不太重要了。巨人。坚固的城。许多的族。你听见周围开始有低低的声音——不是欢呼，是嘀咕。', verse: '民数记 13:27-29 — 又告诉摩西说："我们到了你所打发我们去的那地，果然是流奶与蜜之地。这就是那地的果子。然而住那地的民强壮，城邑也坚固宽大。"', next: 's5_2' },
    { text: '欢呼——流奶与蜜之地是真的！', cons: '你呼喊出声，和其他人一样兴奋。四十年了——从埃及出来四十年？不是，比那还早。从亚伯拉罕在摩利亚山上说"神必自己预备"——到如今，已经等了太久。现在，葡萄就在你眼前。奶与蜜不是神话。是真实的。你几乎能闻到迦南地的土壤。但你没有注意到——旁边有人的脸色已经变了。迦勒的表情告诉你：欢呼太快了。故事还没讲完。', verse: '民数记 13:23 — 他们到了以实各谷，从那里砍了葡萄树的一枝，上头有一挂葡萄，两个人用杠抬着。', next: 's5_2' }
  ]

/* ── 米利暗的毁谤 ── */

s5_2: {
  ch:5, chName:'第五章 · 探子', prog:0.35, effect:null,
  narrative: '十个探子开口了。\n\n"我们不能上去攻击那民——因为他们比我们强壮。"\n\n"我们所窥探、经过之地是吞吃居民之地——我们在那里所看见的人民都身量高大。我们在那里看见亚衲族人，就是伟人；他们是伟人的后裔。据我们看，自己就如蚱蜢一样；据他们看，我们也是如此。"\n\n蚱蜢。他们说自己像蚱蜢。\n\n十二个人看见同一片地。两个人看见神。十个人看见巨人。\n\n全会众爆发了——喧嚷变成哭号："巴不得我们死在埃及地！巴不得我们死在这旷野！耶和华为什么把我们领到那地，使我们倒在刀下呢？我们的妻子和孩子必被掳掠。我们回埃及去岂不好吗？"\n\n"我们立一个首领，回埃及去吧！"\n\n回埃及。那鞭子、泥砖、督工——他们不记得了。贪欲的坟墓还在路上——他们已经想回去了。人心翻脸的速度，永远是神迹。',
  choices: [
    { text: '听迦勒说——他在人群前面大喊。', cons: '迦勒撕裂衣服。\n\n"我们立刻上去得那地吧！我们足能得胜！"\n\n他的声音穿过哭号声——像一把刀划过黑布。"不要怕那地的民——他们是我们的食物！荫庇他们的已经离开他们。有耶和华与我们同在，不要怕他们！"\n\n"他们是我们的食物"——这是什么话？你要吃巨人吗？不。迦勒的意思是：这些看起来能吞灭你们的困难，实际上是你们属灵的食物——吃了，长信心，长肌肉。你站在迦勒旁边，看见他脸上不是盲目的乐观——是信心的愤怒。', verse: '民数记 14:7-9 — 迦勒在摩西面前安抚百姓，说："我们所窥探经过之地是极美之地。耶和华若喜悦我们，就必将我们领进那地……但你们不可背叛耶和华，也不要怕那地的居民，因为他们是我们的食物。"', next: 's5_3' },
    { text: '沉默——站在人群中，不知道该怎么想。', cons: '你张了张嘴，没有声音。你看见巨人了吗？没有。但十个探子看见了——十个来自各支派的首领。他们说有巨人，说城邑坚固，说那地吞吃居民。他们的恐惧不是假的。你心里有两股力量在拉扯：一边是迦勒的"我们立刻上去"，一边是十个人的"不能上去"。你忽然发现：信心不是没有看到困难——是看到了困难，但仍然选择相信神的话。而你此刻——正在摇摆。', verse: '民数记 13:31-33 — 但那些和他同去的人说："我们不能上去攻击那民，因为他们比我们强壮……我们在那里看见亚衲族人，就是伟人……据我们看，自己就如蚱蜢一样。"', next: 's5_3' }
  ]
},
s5_3: {
  ch:5, chName:'第五章 · 探子', prog:0.38, effect:'embers',
  narrative: '迦勒撕裂衣服。约书亚站在他旁边。\n\n"我们立刻上去！足能得胜！不要怕那地的民——他们是我们的食物！荫庇他们的已经离开他们。有耶和华与我们同在，不要怕他们！"\n\n全会众说——\n\n"拿石头打死他们。"\n\n拿石头打死这两个唯一信靠耶和华的人。这是人类最古老的反面逻辑：杀死传好消息的，好让自己继续活在坏消息里。说谎话的人让大家心安——说"不能上去"的十个探子没有人要打他们。说"能上去"的两个人，就要被石头打死。\n\n但就在那一刻——\n\n耶和华的荣光在会幕向以色列众人显现。\n\n光撕裂了愤怒的人群。石头落在地上。全营安静下来。',
  choices: [
    { text: '站在迦勒一边——哪怕全会众都反对。', cons: '你走到迦勒和约书亚身后。不多。也许只有你一个人。但你知道这是对的。不是因为你的信心大——是因为你看见了那挂葡萄。两个人抬着的葡萄。如果神的应许之地能长出那样的果子——那应许之地的神就能打败任何巨人。站在多数人这边很容易——但多数人常常是错的。十个探子说得有理有据：巨人、城墙、危险。他们的逻辑天衣无缝——只是少了一样东西：神。', verse: '民数记 14:10 — 但全会众说："拿石头打死他们二人。"忽然，耶和华的荣光在会幕中向以色列众人显现。', next: 's5_4' },
    { text: '后退——石头不长眼，你也害怕。', cons: '你向后退了几步。不是不同意迦勒——是怕石头。你知道自己是懦弱的，但你控制不住。当全会众的愤怒转向那两个人的时候，你不想成为第三个。后来你为这一刻后悔了很久。在旷野里你学会一件事：信心不只是勇敢——信心是在所有人都往后退的时候，往前走出一步。哪怕只是一步。你没有走出那一步。但迦勒帮你走了。他替你挨了那些没扔出来的石头。', verse: '民数记 14:9 — 但你们不可背叛耶和华，也不要怕那地的居民。', next: 's5_4' }
  ]
},
s5_4: {
  ch:5, chName:'第五章 · 探子', prog:0.42, effect:null,
  narrative: '耶和华的荣光在会幕显现。\n\n全营安静了。刚才还在喊着"拿石头打死他们"的人，现在连呼吸都不敢大声。\n\n耶和华对摩西说——\n\n"这百姓藐视我要到几时呢？我在他们中间行了这一切神迹，他们还不信我要到几时呢？"\n\n你听到神声音里的痛。不是怒——是痛。祂说"这百姓"——不是"那百姓"，不是"我的百姓"——是"这百姓"，好像连名字都不想提了。\n\n"明天你们要转回。从红海的路往旷野去。"\n\n不是往前走。是转回。不是逼近迦南。是退回旷野。四十年——一年顶一天，十二探子窥探四十天，一代人在旷野漂流四十年。\n\n那十个报恶信的探子——当场遭瘟疫，死在耶和华面前。\n\n第一代人被判在旷野漂流四十年，直到全部倒毙。二十岁以上向神发怨言的，一个不能进迦南。\n\n你听见老人的哭声。不是孩子的哭——是那些头发花白的人，那些出埃及时就已经成年的人。他们知道自己等不到了。他们将在旷野里渐渐老去，倒下，埋在沙土中。',
  choices: [
    { text: '望向旷野——那是你们接下来四十年的家。', cons: '旷野在夕阳下变成一片暗金色。你望向那个方向——不是迦南的方向，是旷野的方向。你们刚刚转回了。不是往应许之地走，是往回头路走。但这不是冤枉——你心里知道。不信的代价，从来不是神小气。是人不信，就无法进入安息。旷野在等着——四十年。吗哪还会天天降。云柱还会天天引。鞋不会破，脚不会肿——但那一代人的脚，永远不会踏进约旦河了。', verse: '民数记 14:33-34 — 你们的儿女必在旷野飘流四十年，担当你们淫行的罪，直到你们的尸首在旷野消灭。按你们窥探那地的四十日，一年顶一日，你们要担当罪孽四十年。', next: 'conn_5_6' },
    { text: '记下今日——这一天改变了一切。', cons: '你把这天的日期刻在心里。加低斯。这个地名的意思是"圣所"——但今天在这里发生的事与圣洁相反。十二个探子——十个不信，两个有信心。全会众选择了不信。然后被判在旷野漂流四十年。你想起基博罗哈他瓦的坟——贪欲的坟墓。现在加低斯又多了一层意义：不信的转折点。从这天起，旷野从一条路变成了一个审判。但你也记住了迦勒和约书亚。记住了他们撕裂的衣服、没有扔出的石头、和他们说"他们是我们的食物"时眼里的光。', verse: '民数记 14:29-30 — 你们的尸首必倒在这旷野……必不得进我起誓应许叫你们住的那地；惟有耶孚尼的儿子迦勒和嫩的儿子约书亚才能进去。', next: 'conn_5_6' }
  ]
},

conn_5_6: {
  isConnection:true, fromCh:5, toCh:6,
  quote: '地就开了口，把他们和他们的家眷，并一切属可拉的人丁、财物，都吞下去。', quoteRef:'民数记 16:32',
  narrator:'第一代人还在旷野行走。不信并没有随着探子的死而消失。',
  thread: '又过了许多年。旷野绕了一圈又一圈——第一代人渐渐老去、倒下，葬在沙土中。吗哪每日清晨照常降下——神没有收回祂的供应，但那一代人永远看不见约旦河了。然后，可拉——利未人、哥辖的子孙、摩西和亚伦的亲族——联合大坍、亚比兰和二百五十个有名望的领袖，聚集攻击摩西和亚伦。不是从外面攻击——是从内部。他们说："你们擅自专权！全会众个个都是圣洁的——你们为什么自高？"这话听起来极为属灵。几乎是对的。只是少了一样：神的拣选。',

/* ── Chapter 6: 可拉的叛乱 · 地开了口 ── */
s6_1: {
  ch:6, chName:'第六章 · 可拉的叛乱', prog:0.50, effect:null,
  narrative: '利未人可拉——摩西和亚伦的堂兄弟——联合大坍、亚比兰，聚集了二百五十个首领。\n\n不是无名小卒。是会众中有名望、选入会中的人。\n\n他们聚集攻击摩西和亚伦，说——\n\n"你们擅自专权！全会众个个都是圣洁的，耶和华也在他们中间。你们为什么自高，超过耶和华的会众呢？"\n\n这话听起来极为属灵。几乎无懈可击。"全会众个个都是圣洁的"——是的，以色列是祭司的国度。"耶和华也在他们中间"——是的，云彩就在会幕上。\n\n但仔细听——他们反对的是人（摩西、亚伦），理论依据是真理（全会众是圣洁的），而隐藏的动机是嫉妒（为什么你们可以，我们不行？）。\n\n最危险的叛乱，往往披着真理的外衣。撒但在旷野试探耶稣时，也引用圣经。',
  choices: [
    { text: '迟疑——这话听起来也有道理？', cons: '你心里泛起一阵波动。可拉说的不全是错的。全会众确实是圣洁的——神亲自说的。每个以色列人都是被拣选的——这也没错。所以为什么只有亚伦家可以作祭司？为什么摩西说了算？你开始觉得可拉提出的问题很合理。但等一下——你意识到你忽略了一个东西：拣选。不是因为你圣洁所以你做祭司。是因为神拣选了亚伦家做祭司。次序不能反过来。恩典和职分都是神定规的——不是人争取的。', verse: '民数记 16:3 — 聚集攻击摩西、亚伦，说："你们擅自专权！全会众个个既是圣洁，耶和华也在他们中间，你们为什么自高，超过耶和华的会众呢？"', next: 's6_2' },
    { text: '相信摩西——他已经证明了自己是神所立的。', cons: '你想起摩西跪在耶和华面前代求的那一幕——"倘或你肯赦免他们的罪……不然，求你从你所写的册上涂抹我的名。"一个擅自专权的人不会这样祷告。可拉说的听起来有道理——但摩西的生命更有分量。话语可以被修饰，生命不能。四十年牧羊、八十年顺服——摩西的权柄不是他自己抢来的，是神给的。那些最迫不及待要夺权的人，往往是最不能胜任的人。', verse: '民数记 16:4 — 摩西听见这话就俯伏在地。', next: 's6_2' }
  ]
},
s6_2: {
  ch:6, chName:'第六章 · 可拉的叛乱', prog:0.55, effect:'embers',
  narrative: '摩西俯伏在地。\n\n这不是第一次——每次以色列人发怨言、准备用石头打他的时候，他都俯伏在地。但这次不一样。这次攻击来自内部——来自亲族，来自利未人，来自服事会幕的人。\n\n"到了早晨，耶和华必指示谁是属祂的，谁是圣洁的——就叫谁亲近祂。"\n\n次日。\n\n摩西叫可拉一党的人——连同大坍、亚比兰——各拿自己的香炉，盛上火，加上香，站在会幕门口。和亚伦一起。二百五十个香炉。\n\n然后摩西说——\n\n"我行的这一切事本不是凭我自己心意行的——乃是耶和华打发我行的。倘若耶和华创作一件新事——使地开口，把这一切属可拉的人丁和他们的财物都吞下去——你们就明白这些人是藐视耶和华了。"\n\n话音刚落——\n\n地开了口。\n\n不是比喻。不是异象。是你脚下的地面裂开了。',
  choices: [
    { text: '后退——地面在你脚下裂开了！', cons: '你向后跳开。地面发出沉重的轰隆声——像是大地深处有什么东西在翻动。裂缝越来越大。可拉、大坍、亚比兰——连同他们的帐棚、妻子、儿女、一切所有的——活活地、有知觉地、被吞下地去。不是埋葬——是吞没。地合上。他们从活人之地被剪除。全营的人听见他们的呼号就都逃跑——说"恐怕地也把我们吞下去"。这不是天灾。这是神迹。不是自然的力量——是创造主的审判。', verse: '民数记 16:31-33 — 摩西刚说完了这一切话，他们脚下的地就开了口，把他们和他们的家眷，并一切属可拉的人丁、财物，都吞下去。这样，他们和一切属他们的，都活活地坠落阴间。地口在他们上头照旧合闭，他们就从会中灭亡。', next: 's6_3' },
    { text: '看见裂口——不敢相信这是真的。', cons: '你瞪着那张开的大口——它在可拉帐棚的位置上，像大地的巨嘴，然后缓缓合上。刚刚那里还有帐棚、孩子、牲畜、财物。现在什么都没有了。一片平地。好像什么都没有发生过。你听见周围有人呕吐。但更可怕的是：二百五十个首领还站在那里，手里拿着香炉。他们目睹了一切——但他们还没死。审判分两个阶段：首先，地的审判临到可拉一党。然后，火的审判临到那二百五十人。', verse: '民数记 16:32 — 地就开了口，把他们和他们的家眷，并一切属可拉的人丁、财物，都吞下去。', next: 's6_3' }
  ]
},
s6_3: {
  ch:6, chName:'第六章 · 可拉的叛乱', prog:0.60, effect:'embers',
  narrative: '二百五十个首领——刚目睹地开了口——还站在那里。\n\n然后有火从耶和华那里出来。烧灭了那献香的二百五十个人。\n\n但这不是结束。不是。\n\n第二天——以色列全会众向摩西、亚伦发怨言："你们杀了耶和华的百姓了！"\n\n你震惊。他们刚刚看见了地开口——几十个人活活被吞下阴间。然后火从天降下烧灭二百五十个首领。才隔了一天——他们说"你们杀了耶和华的百姓。"\n\n不是"耶和华杀了"——是"你们杀了"。他们把神的审判归咎于人。\n\n人心刚硬的速度比你想象的快。基博罗哈他瓦——贪欲的坟墓。加低斯——不信的转折点。现在又是这一幕——刚看见审判，转身就发怨言。\n\n你忽然理解神为什么说"这百姓藐视我要到几时呢"——不是夸张。不是修辞。是真的。',
  choices: [
    { text: '不信——他们怎么可能这么快就忘了？', cons: '你不信地看着周围——那些和你一起走过红海、吃过吗哪、看见地开口的人。他们的记忆只有二十四小时。不——连二十四小时都不到。昨天太阳落山前可拉一党才被吞下去，今天清晨他们已经说是摩西和亚伦杀的了。你心里冰凉。你不是第一次对人失望。但这一次——你意识到问题不只是他们。你自己里面也有同一颗心。忘记恩典、忘记审判、忘记神——人的心就是一个漏洞。', verse: '民数记 16:41 — 第二天，以色列全会众都向摩西、亚伦发怨言说："你们杀了耶和华的百姓了。"', next: 's6_4' },
    { text: '惊骇——人怎么可能这么刚硬？', cons: '你张着嘴合不上。不是因为他们发怨言——他们在旷野发怨言也不是第一次了。是因为他们刚刚看见地开口。不是听说的——是亲眼看见。裂缝就在那里，刚刚才合上。但人心有一个可怕的能力：把超自然的事，解释成自然的事。他们或许开始想"也许本来就有一个坑在那"、"也许是个地震"。一旦你决心不信，没有什么证据是足够的。审判可能会吓住你一晚——但如果不触及你的心，明天你就又会发怨言。', verse: '民数记 16:42 — 会众聚集攻击摩西、亚伦的时候，向会幕观看。不料，有云彩遮盖了，耶和华的荣光显现。', next: 's6_4' }
  ]
},
s6_4: {
  ch:6, chName:'第六章 · 可拉的叛乱', prog:0.65, effect:'embers',
  narrative: '云彩遮盖会幕。耶和华的荣光显现。\n\n怒气已经发作——瘟疫在营中爆发。\n\n摩西对亚伦说——\n\n"拿你的香炉，把坛上的火盛在其中，又加上香。快快——跑到会众那里，为他们赎罪。因为有忿怒从耶和华那里出来，瘟疫已经发作了。"\n\n亚伦——那个刚刚失去两个儿子在会幕门口的人——那个前天被可拉一党攻击说他"擅自专权"的人——拿起香炉，跑进瘟疫。\n\n不是走。是跑。\n\n七十多岁的老人，穿着大祭司的圣衣，跑进正在死人的瘟疫中。站在活人与死人之间。香炉的烟升起来。\n\n瘟疫止住了。\n\n死了——一万四千七百人。\n\n亚伦站在死人中间，香炉还在手里。他没有说"我早就告诉你们了"。他只是站在那里——为那些攻击他的人赎罪。',
  choices: [
    { text: '看亚伦——他在活人和死人之间。', cons: '你看着亚伦的背影。他站在瘟疫最浓的地方——香炉升起烟来，好像一堵烟墙，隔开了活人和死人。这个老人失去了两个儿子——在会幕门口，神亲自击杀的。他没有抱怨过一句。现在他跑进瘟疫里，为昨天还在攻击他的人赎罪。你忽然理解了什么是祭司——不是权柄、不是地位、不是荣耀的圣衣。是站在人与神之间，在死亡涌来的时候不逃跑。亚伦不完美。他造过金牛犊。但他此刻站在活人死人之间——这就是他的职分。', verse: '民数记 16:47-48 — 亚伦照着摩西所说的拿来，跑到会中。不料，瘟疫在百姓中已经发作了。他就加上香，为百姓赎罪。他站在活人死人中间，瘟疫就止住了。', next: 's6_5' },
    { text: '看那烟——赎罪的香在死亡中升起。', cons: '香烟在死人和活人之间拉出一道看不见的界线。这边是倒下的——一万四千七百人。那边是站着的——因为香，因为赎罪，因为亚伦站在中间。你闻到香的香气——那是以色列最神圣的配方，不可仿制，不可私用。此刻它混在死亡的气息中，但盖不过去。香是代求的预表。亚伦没有时间祷告——他的行动就是祷告。跑，就是代求。瘟疫止住不是因为亚伦有什么超能力——是因为那香的烟升到了施恩座前。', verse: '民数记 16:48 — 他站在活人死人中间，瘟疫就止住了。', next: 's6_5' }
  ]
},
s4_3: {
  ch:4, chName:'第四章 · 贪欲与毁谤', prog:0.16, effect:null,
  narrative: '基博罗哈他瓦的坟还在营外——那些起贪欲之心的人葬在那里，沙土还是新的。\n\n但人的舌头比沙土更容易翻动。\n\n摩西的姐姐米利暗——那个曾在尼罗河边守着蒲草箱的女孩、那个在红海边带领妇女击鼓跳舞的女先知——和亚伦，大祭司亚伦，开口说话了。\n\n"难道耶和华单与摩西说话，不也与我们说话吗？"\n\n矛头指向摩西娶了古实女子为妻。但经文暴露了真正的动机：不是关心摩西的婚姻，是嫉妒摩西的权柄。"不也与我们说话吗"——不是否认神与摩西说话，是不甘心摩西是唯一的出口。米利暗和亚伦——姐姐和哥哥、女先知和大祭司——一左一右，把摩西夹在中间。\n\n摩西没有说话。\n\n经文在这里插入了一句极重的话："摩西为人极其谦和，胜过世上的众人。"不是摩西自己说的——是神透过摩西的笔写下的。他没有为自己辩护。那个在埃及打死过一个埃及人的摩西，那个将要击打磐石的摩西——此刻，安静得像一块石头。\n\n因为他知道：神听见了。',
  choices: [
    { text: '看着米利暗——她怎么敢挑战她的弟弟？', cons: '你看着米利暗。不是陌生人——是他的姐姐。当年她把蒲草箱放在尼罗河边的芦荻中，远远站着，要看摩西究竟怎样。没有她，摩西可能活不到法老女儿的宫中。但现在——她站在亚伦旁边，挑战摩西。权力是最毒的毒药——连先知和女先知都不能免疫。米利暗忘了：她的先知职分，也是同一位神给的。', verse: '民数记 12:1-2 — 摩西娶了古实女子为妻。米利暗和亚伦因他所娶的古实女子就毁谤他，说："难道耶和华单与摩西说话，不也与我们说话吗？"这话耶和华听见了。', next: 's4_4' },
    { text: '为摩西捏一把汗——哥哥姐姐联合攻击他。', cons: '你的心揪紧了。不是从外面来的敌人——法老、亚玛力人、巴勒——是从帐棚里面来的。哥哥和姐姐。大祭司和女先知。如果连他们都反对摩西，摩西还能依靠谁？但你注意到一件事：摩西没有说话。不是无力反驳——是选择沉默。"极其谦和"——不是懦弱，是把审判的主权交给神。摩西学会了不在自己的事上为自己辩护——因为替他辩护的那一位，比他更有说服力。', verse: '民数记 12:3 — 摩西为人极其谦和，胜过世上的众人。', next: 's4_4' }
  ]
},
s4_4: {
  ch:4, chName:'第四章 · 贪欲与毁谤', prog:0.18, effect:'embers',
  narrative: '耶和华忽然对摩西、亚伦、米利暗说——\n\n"你们三个人都出来，到会幕这里。"\n\n云柱降下来，停在会幕门口。耶和华在云柱中降临——召亚伦和米利暗二人出来。\n\n"你们且听我的话。你们中间若有先知，我耶和华必在异象中向他显现，在梦中与他说话。我的仆人摩西不是这样——他是在我全家尽忠的。我要与他面对面说话，乃是明说，不用谜语，并且他必见我的形像。\n\n你们毁谤我的仆人摩西——为何不惧怕呢？"\n\n耶和华发怒而去。\n\n云彩从会幕上收去。\n\n米利暗长了大麻风——像雪那样白。\n\n刚才还在毁谤的人，现在全身雪白。那带领妇女跳舞的手——雪白如尸。亚伦一看，魂都飞了——立刻转向摩西。不是"我弟弟"，是"我主啊"。\n\n"我主啊，求你不要因我们愚昧犯罪，便将这罪加在我们身上。求你不要使她像那出母腹、肉已半烂的死胎。"\n\n摩西没有说"我早告诉你们"。他向耶和华哀求——\n\n"神啊，求你医治她！"',
  choices: [
    { text: '看米利暗——那带领妇女跳舞的手，现在雪白如尸。', cons: '米利暗低头看着自己的手——雪白的。不是冬天的雪那种白，是死人的白。麻风在旧约不止是一种病——是活的死亡。肉渐渐腐烂、神经失去知觉、人从社群中被剪除。这不是巧合——这是耶和华亲自的手。米利暗刚才用自己的舌头挑战摩西的权柄——现在她的全身宣告了神对那权柄的认证。毁谤神所膏立的——不是意见分歧，是攻击神的主权。你看着米利暗，心里发寒：舌头可以把自己送进麻风里。', verse: '民数记 12:9-10 — 耶和华向他们发怒而去。云彩从会幕上挪开了。米利暗长了大麻风，有雪那样白。亚伦一看米利暗长了大麻风。', next: 's4_5' },
    { text: '看摩西——他在为攻击他的人代求。', cons: '摩西的脸——你看得很清楚。他没有解恨的表情。没有"活该"的微词。他用最短的话向耶和华呼求："神啊——求你医治她。"五个希伯来字。没有修辞。没有解释为什么应该医治。就是一个被攻击的人，为攻击他的人，向攻击者的审判者呼叫。这就是摩西。他在山上说"倘或你肯赦免他们的罪……不然，求你从你所写的册上涂抹我的名"——对全以色列。现在——对他自己的姐姐——同一个心。', verse: '民数记 12:13 — 于是摩西哀求耶和华说："神啊，求你医治她！"', next: 's4_5' }
  ]
},
s4_5: {
  ch:4, chName:'第四章 · 贪欲与毁谤', prog:0.20, effect:null,
  narrative: '耶和华对摩西说——\n\n"她父亲若吐唾沫在她脸上，她岂不蒙羞七天吗？现在要把她在营外关锁七天——然后才可以领她回来。"\n\n米利暗被关在营外七天。全营守候——百姓没有起行，直等到把她领回来。\n\n七天。风沙吹着那被隔离的帐棚——米利暗独自在那里，旷野的风是唯一的伴。她曾站在尼罗河边，救了摩西的命。她曾在红海边击鼓——"你们要歌颂耶和华，因祂大大战胜"。但现在——她的舌头把她关在了营外。\n\n麻风——罪的外在形像。不是所有的病都是罪的直接审判——但这一次，是。白色不是清洁——是死亡蔓延的颜色。\n\n摩西等候了七天。没有起行。他让两百万人等着——为他的姐姐，那个刚刚毁谤了他的姐姐。\n\n七天后，米利暗被领回营中。她的皮肤恢复了。但有些东西——骄傲、嫉妒、不安于位的野心——希望也像麻风一样脱落了。\n\n百姓从哈洗录起行，往巴兰的旷野去。前方——是加低斯。',
  choices: [
    { text: '等候七天——陪伴的方式是在营中安静。', cons: '你坐在营中。没有人抱怨为什么不起行——刚刚见过基博罗哈他瓦的坟和米利暗的麻风，全营都学会了闭口。有时候最有力的陪伴，是不说话地等。你坐在帐棚门口，望着营外那个隔离的帐棚。米利暗在里面。神在外面。风在中间穿来穿去。你忽然想到：七天的等待不只是惩罚——也是医治。麻风的皮肤七天痊愈——骄傲的心需要更久。但七天是一个开始。像创造的头七天——神用七天造了天地，也用七天重造了米利暗。', verse: '民数记 12:14-15 — 耶和华对摩西说："她父亲若吐唾沫在她脸上，她岂不蒙羞七天呢？现在要把她在营外关锁七天，然后才可以领她回来。"于是米利暗关锁在营外七天。百姓没有行路，直等到把米利暗领回来。', next: 'conn_4_5' },
    { text: '默想——为什么米利暗受罚而亚伦没有？', cons: '这个问题刺进你心里。米利暗和亚伦说了同样的话——"难道耶和华单与摩西说话，不也与我们说话吗？"但只有米利暗长了大麻风。经文没有直接解释，但你注意到：在希伯来文中米利暗的名字排在亚伦前面，动词"她说"是阴性单数——她可能是发起者。亚伦是大祭司——如果他也长大麻风，赎罪日的制度就崩溃了。不是偏袒——是职分的重担已经够多了。但亚伦的死期也会来。在何珥山上。每个罪都有它的价码。', verse: '民数记 12:11 — 亚伦对摩西说："我主啊，求你不要因我们愚昧犯罪，便将这罪加在我们身上。"', next: 'conn_4_5' }
  ]
},

s6_5: {
  ch:6, chName:'第六章 · 可拉的叛乱', prog:0.72, effect:null,
  narrative: '瘟疫止住了。营中弥漫着死寂和香灰的味道。\n\n耶和华吩咐摩西：从十二个支派首领中各取一根杖，写上各人的名字。亚伦的名字写在利未支派的杖上。把这些杖放在会幕的法柜前——就是祂与人相会的地方。\n\n"我所拣选的那人——他的杖必发芽。"\n\n十二根杖。都是枯木。放在约柜前。过了一夜。\n\n第二天——摩西进法柜的会幕去。\n\n利未支派的杖发了芽，开了花，结了杏。\n\n枯木。一夜之间。发芽——开花——结实。不是春天的自然规律——三件事同时发生。枯木活了。不是沾了水，不是施了肥——是放在约柜前，一夜之间。\n\n你拿着那根杖。杏——春天最早开花的树。杏的希伯来文"shaked"与"警醒"同音。耶和华在说：我警醒——我看守我所说的话，必要成就。\n\n枯木开花。你忽然想到——这个神迹不是在讲亚伦的资格。是在讲复活。死可以变成生。',
  choices: [
    { text: '触摸杏花——枯木怎么可能一夜开花结实？', cons: '你伸出手，不敢碰——但碰到了。花瓣是真实的，柔软而有生命。这根杖昨天还是枯的，今天却结了杏子。你闻了闻——是活的植物的味道，不是魔术的幻象。亚伦的杖。神亲自为祂所拣选的祭司辩护。不需要人的投票、不需要罢免可拉之后重新选举——一根发过芽的杖，就够了。你忽然想到：有一天，另有一根"木头"——不是杖，是十字架——也将在死亡中复活。不是在会幕里，是在坟墓里。不是发芽，是复活。', verse: '民数记 17:8 — 第二天，摩西进法柜的帐幕去。谁知，利未族亚伦的杖已经发了芽，生了花苞，开了花，结了熟杏。', next: 'conn_6_7' },
    { text: '默想——这件事的意义不止于确定亚伦的权柄。', cons: '你坐下来，看着那根杖。发芽、开花、结实——这是生命从死亡中出来的三重记号。神不是在说"亚伦对、可拉错"——那件事已经由地开口处理了。神在做另一件事：给以色列人一个持续的证据。这根杖后来被放在约柜里——与法版、吗哪罐一起。永生神的杖在约柜里。枯木复活——这是整本圣经的故事。从亚伯拉罕的"身体如同已死，撒拉的生育已经断绝"——到以撒出生。从"骸骨能复活吗"——到"气息进入骸骨，骸骨便活了"。你所信的，是一位叫枯木开花的神。', verse: '民数记 17:10 — 耶和华吩咐摩西说："把亚伦的杖还放在法柜前，给这些背叛之子留作记号。"', next: 'conn_6_7' }
  ]
},

  thread: '三十八年——一代人正在旷野中渐渐消失。加低斯——那个探子报恶信、可拉叛乱的地方——他们又回来了。仿佛旷野是一个巨大的圆圈。正月。没有水。全会众聚集攻击摩西和亚伦。同一种怨言——"巴不得我们死在这里！为什么把耶和华的会众领到这旷野？"但这一次，摩西的回应——将改变一切。他太累了。四十年的疲惫，在两下杖击中爆发。',

s7_1: {
  ch:7, chName:'第七章 · 磐石', prog:0.73, effect:null,
  narrative: '正月。寻的旷野。没有水。\n\n会众聚集攻击摩西、亚伦——"我们的弟兄曾死在耶和华面前，我们恨不得与他们同死。你们为什么把耶和华的会众领到这旷野，使我们和牲畜都死在这里呢？你们为什么逼着我们出埃及——领我们到这坏地方？"\n\n同样的怨言。同样的人群。已经快四十年了——他们还在说"为什么领我们出埃及"。一代人在旷野中老去、死去——嘴里的话和四十年前一模一样。\n\n摩西和亚伦离开会众，到会幕门口俯伏在地。你看见摩西的脸——那是一种被磨了四十年的疲惫。不是肉体上的累。是灵魂的累。是两百万永远长不大的人，每天重复着同样的怨言，从来学不会信心。\n\n耶和华的荣光显现。祂说话了。这次不是审判——是供应。\n\n"你拿着杖去……在他们眼前吩咐磐石发出水来。"\n\n注意：不是击打。是吩咐。',
  choices: [
    { text: '去会幕——俯伏在耶和华面前。', cons: '你和摩西、亚伦一起，俯伏在会幕门口。尘土的气味充满鼻腔。你想到三十八年前——在同一个地方，十二个探子报恶信，全会众哭号，可拉叛乱，地开了口。三十八年过去了，加低斯还是加低斯。但摩西老了。你也老了。然而旷野还没有走完。俯伏在地的时候你想起申命记里那句："这四十年，耶和华你的神常与你同在，故此你一无所缺。"你缺过水——但神每次都供应了。只是你忘了。总是忘了。', verse: '民数记 20:6 — 摩西、亚伦离开会众，到会幕门口，俯伏在地。耶和华的荣光向他们显现。', next: 's7_2' },
    { text: '去磐石前——等摩西来，看水从哪里出。', cons: '你走到那磐石前。它立在那里——沉默、干燥、毫无水迹。和四十年前何烈的那块磐石很像——那一次摩西击打了它，水流出来了。但这次不同。四十年了。神说的是"吩咐"，不是"击打"。你不知道摩西听清楚没有。他太累了。你也太累了。你的嘴唇干裂，喉咙像砂纸。你看着那块磐石，心想：从这块石头里能出水吗？从不可能的地方——这是神一贯的做法。', verse: '民数记 20:8 — "你拿着杖去，和你的哥哥亚伦招聚会众，在他们眼前吩咐磐石发出水来——水就从磐石流出，给会众和他们的牲畜喝。"', next: 's7_2' }
  ]
},
s7_2: {
  ch:7, chName:'第七章 · 磐石', prog:0.78, effect:'embers',
  narrative: '摩西和亚伦招聚会众到磐石前。\n\n摩西手里拿着杖——那根曾经变过蛇、曾经伸向红海、曾经击打过何烈山磐石的杖。\n\n但神说的是"吩咐"。不是"击打"。\n\n摩西举手——用杖击打磐石。\n\n两下。\n\n他说："你们这些背叛的人听我说——我为你们使水从这磐石中流出来吗？"\n\n"我们"——不是"耶和华"。是"我们"。\n\n水涌出了。大水——足够两百万人和所有牲畜喝。百姓欢呼，俯身捧水喝。\n\n但耶和华对摩西和亚伦说——\n\n"因为你们不信我——不在以色列人眼前尊我为圣——所以你们必不得领这会众进我所赐给他们的地去。"\n\n你愣住了。就这一下？就一句话——"我们"——然后是一生的遗憾？不是因为他击打磐石——是因为他没有尊耶和华为圣。\n\n磐石已经被击打过一次。基督一次受死。第二次不需要再击打——只需吩咐。摩西混淆了。',
  choices: [
    { text: '看摩西——他刚刚丢掉了进入迦南的资格。', cons: '你看着摩西的脸。水还在从磐石涌出——但那水声忽然变得苦涩。四十年的旷野。法老的追杀、百姓的背叛、可拉的叛乱——他扛过来了。但从埃及出来时那个说"我是什么人，竟能去见法老"的年轻人——现在老了。疲惫了。那两下杖击——不是不信的开始，是疲惫的爆发。他在怒火中说"我们"。不是神的荣耀——是他自己的义愤。近在眼前的迦南——他看不见了。你忽然流泪。不是为水——是为摩西。', verse: '民数记 20:11-12 — 摩西举手，用杖击打磐石两下，就有许多水流出来，会众和他们的牲畜都喝了。耶和华对摩西、亚伦说："因为你们不信我，不在以色列人眼前尊我为圣，所以你们必不得领这会众进我所赐给他们的地去。"', next: 's7_3' },
    { text: '看水流——水很大，但你心里不是滋味。', cons: '水从磐石涌出——清澈、冰凉，在沙漠中形成一条小溪。你俯身喝了一口——甘甜的。但你的心里不是滋味。你知道了——"吩咐"和"击打"的区别。磐石已经被击打过一次了——那是在何烈山，第一次。那一次代表审判落在磐石上，恩典流出来。但第二次——只需吩咐。正如基督一次被献上担当了多人的罪——不需要再次被击打。只需要信靠、呼求。摩西混淆了这两件事——在怒火中重演了审判。但审判已经被承受过了。不需要再来一次。', verse: '民数记 20:12 — "因为你们不信我，不在以色列人眼前尊我为圣，所以你们必不得领这会众进我所赐给他们的地去。"', next: 's7_3' }
  ]
},
s7_3: {
  ch:7, chName:'第七章 · 磐石', prog:0.82, effect:null,
  narrative: '站34·何珥山。出埃及后第四十年五月初一。\n\n摩西带亚伦和亚伦的儿子以利亚撒登山。全营的以色列人都在山下望着。\n\n摩西把亚伦的圣衣脱下来。\n\n那件以弗得。那副胸牌。那件蓝色外袍。那顶写着"归耶和华为圣"的冠冕。\n\n一件一件脱下。\n\n不是自己脱——是摩西替他脱。亚伦站在何珥山顶，风吹着他的白发。四十年。从埃及的砖窑到西奈山下的金牛犊，从凡火击杀到他自己的两个儿子死在会幕门口，从可拉的叛乱到他拿着香炉跑进瘟疫——亚伦穿过这一切，大祭司的圣衣从未脱下。\n\n现在脱下来了。\n\n摩西把圣衣穿在以利亚撒身上。在全会众的注视下。亚伦不再是祭司了。\n\n他知道接下来是什么。',
  choices: [
    { text: '看亚伦——这是他的最后一天。', cons: '你望着山顶——太高了，看不清细节。但你看见三个身影：摩西、亚伦、以利亚撒。亚伦站着一动不动。他在想什么？两个儿子——拿答和亚比户。金牛犊——他向百姓屈服的那天。瘟疫——他跑进去的那天。枯木开花——他的杖放进约柜的那天。一百二十三岁。四十年大祭司。现在圣衣脱下了。他不再是祭司了——但他从来没有不是人。他不完美。但他站在活人死人之间。那天瘟疫止住了。', verse: '民数记 20:28 — 摩西把亚伦的圣衣脱下来，给他的儿子以利亚撒穿上，亚伦就死在山顶那里。', next: 's7_4' },
    { text: '看不下去——圣衣被脱下，这意味着什么。', cons: '你低下头。圣衣——那件照着山上的样式做的圣衣——被脱下来了。穿了四十年。现在穿在另一个人身上。你不忍心看。不是不忍心看亚伦——是不忍心看那个无法逃避的事实：死亡。即使是大祭司，也会死。这恰恰是利未记祭司制度最大的遗憾——祭司会死，需要不断更换。而希伯来书说："那些成为祭司的，数目本来多，是因为有死阻隔，不能长久。这位既是永远常存的，他祭司的职任就长久不更换。"亚伦死了。等着一位永不死的大祭司。', verse: '民数记 20:26 — 把亚伦的圣衣脱下来，给他的儿子以利亚撒穿上。亚伦必死在那里，归他列祖。', next: 's7_4' }
  ]
},
s7_4: {
  ch:7, chName:'第七章 · 磐石', prog:0.85, effect:'embers',
  narrative: '只有摩西和以利亚撒从山上下来。\n\n亚伦死了。死在山顶——圣衣被脱下之后，归入他的列祖。\n\n全会众见亚伦死了——便为他哀哭了三十天。各家各户。\n\n三十天。整整一个月。哀歌日夜不停。你听见了以色列人的哭泣——不是礼仪性的，是发自脏腑的。他们抱怨了他一辈子。他们攻击过他。金牛犊的事他们从来没忘——但他们也没忘在瘟疫中他站在活人死人之间。\n\n现在他们哭了。\n\n又一代人消失了。亚伦是那出埃及的第一代人。和他同代的——二十岁以上的——都在旷野里渐渐倒下。米利暗已经不在了。亚伦现在也走了。不久之后，摩西也要走。\n\n旷野在收走一代人。一个一个。',
  choices: [
    { text: '加入哀哭——为亚伦，也为那正在消逝的一代。', cons: '你哭出声来。不只是为亚伦——是为所有在旷野中倒下的。那些在加低斯选择了不信的人。那些在基博罗哈他瓦死于贪欲的人。可拉一党被地吞没的人。瘟疫中倒下的一万四千七百人。还有那些默默老去、默默死去、没有人记录名字的人。四十年。他们从埃及出来的时候年轻力壮——现在白了头，倒在沙土中。但这是审判——也是恩典。因为神的应许不会落空。第一代人进不去——但第二代人会进去。约书亚在以利亚撒身旁。新的世代正在山下等着。', verse: '民数记 20:29 — 全会众，就是以色列全家，见亚伦已经死了，便都为亚伦哀哭了三十天。', next: 'conn_7_8' },
    { text: '坐在营外——不想说话，只想一个人坐着。', cons: '你走出营地。空旷的旷野，只有风声。何珥山在身后——亚伦就死在那里。你想：为什么是山上？为什么不是迦南？他离应许之地只差一步——和摩西一样。神让他上山，脱下圣衣，然后死了。他看不见约旦河那边的地——但他在山上。也许从山上能隐约望见一点。你不确定。但你不觉得这是残忍。你觉得神在说：你是祭司——你的职分是预表那将要来的。你的死，也是预表的一部分。因为将来的那位大祭司，不会死在何珥山——祂会死在各各他。然后复活。', verse: '申命记 10:6 — 亚伦死在那里，就葬在那里。他儿子以利亚撒接续他供祭司的职分。', next: 'conn_7_8' }
  ]
},
/* ── 连接 7→8 ── */
conn_7_8: {
  isConnection:true, fromCh:7, toCh:8,
  quote: '耶和华对摩西说："你制造一条火蛇，挂在杆子上。凡被咬的，一望这蛇，就必得活。"', quoteRef:'民数记 21:8',
  narrator:'绕过以东地。路难行。',
  thread: '以东王不许他们经过——以色列人只能绕道而行。漫长的绕路。百姓心里烦躁。他们又开始抱怨了——"没有粮、没有水，我们的心厌恶这淡薄的食物。"四十年了，他们还在嫌弃吗哪。然后——火蛇来了。被咬到的人皮肤变成青紫色，在沙土中抽搐，死亡来得极快。营中到处都是被咬之人的哀号。但这一次——神的救法将用一个出人意料的方式临到。',
  choices:[{next:'s8_1'}], btnText:'望向铜蛇 →'
},
s8_1: {
  ch:8, chName:'第八章 · 铜蛇', prog:0.86, effect:null,
  narrative: '绕过以东地。百姓因这路难行，心中甚是烦躁。\n\n然后你听见了那熟悉的声音——\n\n"为什么把我们从埃及领出来，使我们死在旷野呢？这里没有粮、没有水——我们的心厌恶这淡薄的食物。"\n\n"这淡薄的食物"——他们说的是吗哪。那每天早晨从天上降下、天使所吃的粮食。他们叫它"淡薄的食物"。四十年了——他们还在说同一句话。\n\n然后火蛇来了。\n\n不是一条两条——是蛇群。火蛇——希伯来文是"燃烧的蛇"，可能指被咬后的伤口如火烧。你听见尖叫此起彼伏——一转身就看见人倒下。被咬的人在沙土中抽搐，皮肤变成青紫色，嘴唇发黑。死亡来得很快。\n\n这是审判。但这也是恩典——因为审判临到时，人还有机会呼求。',
  choices: [
    { text: '跑去摩西——只有他能代求。', cons: '你拔腿就向摩西的帐棚跑。路上到处都是倒下的人——有人在泥土中翻滚，有人已经不动了。火蛇还在营中游走。摩西在会幕门口。百姓围着他。"我们怨渎耶和华和你，有罪了。求你祷告耶和华，叫这些蛇离开我们。"他们终于认罪了。但这次不是在发怨言之前认罪——是在遭到审判之后。摩西没有责备他们。他为百姓祷告。', verse: '民数记 21:5-7 — 百姓怨渎神和摩西说："你们为什么把我们从埃及领出来，使我们死在旷野呢？这里没有粮，没有水，我们的心厌恶这淡薄的食物。"于是耶和华使火蛇进入百姓中间，蛇就咬他们。以色列人中死了许多。', next: 's8_2' },
    { text: '看那蛇——火蛇在营中肆虐。', cons: '你看见一条火蛇游过你脚边。它的鳞片在阳光下反射出铜色的光泽——红铜色，像燃烧的金属。然后你听见有人扑倒——又一个。你不敢动了。死亡就在身边——不是远处的威胁，是脚边的蛇。你忽然意识到：蛇——正是那在伊甸园里引诱夏娃的。罪从蛇开始——现在审判也以蛇的形状临到。这是诗意的公义。你所玩的罪，终将成为咬你的蛇。不是神残忍——是罪本身就有毒。', verse: '民数记 21:6 — 于是耶和华使火蛇进入百姓中间，蛇就咬他们。以色列人中死了许多。', next: 's8_2' }
  ]
},
s8_2: {
  ch:8, chName:'第八章 · 铜蛇', prog:0.89, effect:null,
  narrative: '百姓到摩西那里说："我们怨渎耶和华和你，有罪了。求你祷告耶和华，叫这些蛇离开我们。"\n\n摩西为百姓祷告。\n\n耶和华对摩西说——\n\n"你制造一条火蛇，挂在杆子上。凡被咬的，一望这蛇，就必得活。"\n\n不是"你祷告，蛇就离开"——是"制造一条火蛇，挂在杆子上。望，就得活。"\n\n这是什么逻辑？咬死人的就是蛇——现在救人的也是蛇的形状？\n\n摩西熔了铜——可能是百姓带来的铜镜、铜器——铸成一条火蛇，挂在杆子上。放在营中高处。\n\n"凡被咬的，一望这蛇，就必得活。"\n\n你站在那里，看着那条挂在木杆上的铜蛇。它在阳光下反射着暗金色的光。一条蛇——一条被举起来的蛇。荒谬。但在神的逻辑里——从来是人看为愚拙的，成了救法。',
  choices: [
    { text: '望那铜蛇——虽然不明白，但照做。', cons: '你抬起头。铜蛇在杆子上——阳光穿过它，投下一道铜色的影子。你望着它——什么都不用做，不需要伸手摸、不需要念什么话、不需要献祭。只是望。就活了。这就是信心最纯粹的形态：不是做了什么——是望向那被举起的。你忽然想到摩西在加低斯的那个失误——他击打磐石两下，而不是吩咐。而这里——你什么都不需要做。不需要击打。不需要吩咐。只需要望。救恩从来不是你的行为——是你的目光。', verse: '民数记 21:8 — 耶和华对摩西说："你制造一条火蛇，挂在杆子上。凡被咬的，一望这蛇，就必得活。"', next: 's8_3' },
    { text: '不信——一条铜蛇怎么可能救被真蛇咬死的人？', cons: '你退后一步。这不合逻辑。被蛇咬了需要的是血清——或者至少是某种药。一条铜蛇挂在杆子上，望一眼就能活？如果这是神在试验我们，这试验未免太荒谬了。但你看见旁边的人——刚才脸色发青、嘴唇发黑的那个人——他抬起头望了。然后他的脸色恢复了。他站起来了。他活了。不是慢慢好转——是立即。你还在犹豫——但证据就在眼前。信心不需要理解"为什么"——只需要看"是不是"。你吸了口气，抬起头。', verse: '民数记 21:9 — 摩西便制造一条铜蛇，挂在杆子上。凡被蛇咬的，一望这铜蛇，就活了。', next: 's8_3' }
  ]
},
s8_3: {
  ch:8, chName:'第八章 · 铜蛇', prog:0.92, effect:null,
  narrative: '你望向铜蛇。青铜在阳光下发光。\n\n一千五百年后——在一个深夜，一个法利赛人来找一个拿撒勒人。那拿撒勒人说：\n\n"摩西在旷野怎样举蛇，人子也必照样被举起来——叫一切信祂的都得永生。"\n\n你忽然明白了：不是蛇的形状——是罪的形状。那挂在木头上的，成了罪身的形状。祂不知罪——却替你成为罪。好叫你在祂里面成为神的义。\n\n正如被蛇咬的人望铜蛇就活——被罪咬的人，望被举起来的人子，就必得活。\n\n但铜蛇后来被以色列人保留了几百年。他们开始向它烧香——直到希西家王把它打碎了，叫它"铜块"。救法变成了偶像。连铜蛇都可以变成偶像——不是蛇的错，是人心的习性：把恩典的管道当成恩典的源头。\n\n救法永远不是那根杆子、那条蛇——是那位叫人望而得活的神。',
  choices: [
    { text: '记住——救法也可以变成偶像。', cons: '你把这画面刻在心里：铜蛇在杆子上，青铜的光在夕阳下闪烁。旁边是活过来的人——刚才快死了，现在站了起来。这是神迹。但你也记住了希西家打碎铜蛇的那一幕——虽然那还在几百年后。人心就是如此：最容易拜的，不是假神，是神曾经使用过的东西。铜蛇是恩典的管道——不是恩典的源头。有一天，人会把十字架也变成偶像——把挂在颈上的十字架代替了背在身上的十字架。永远不要把管道当作源头。永远。', verse: '约翰福音 3:14-15 — 摩西在旷野怎样举蛇，人子也必照样被举起来，叫一切信祂的都得永生。', next: 'conn_8_9' },
    { text: '回到营中——你是活着的，记住这一天。', cons: '你回到自己的帐棚。火蛇还在营中——但它们不再可怕了。因为你知道，只要望一眼那铜蛇，就能活。不是蛇消失了——是救法被举起来了。旷野里的蛇没有离开——但有一条举起来的铜蛇，就足够了。你躺在帐棚里，想着那个深夜来找耶稣的法利赛人。他在一千五百年后——但在神的眼中，他和你在看同一件东西：被举起的人子。你闭上眼。今晚可以安心睡了——不是因为蛇走了，是因为有被举起来的。', verse: '民数记 21:9 — 凡被蛇咬的，一望这铜蛇，就活了。', next: 'conn_8_9' }
  ]
},

conn_8_9: {
  isConnection:true, fromCh:8, toCh:9,
  quote: '这是独居的民，不列在万民中。', quoteRef:'民数记 23:9',
  narrator:'以色列人继续前行——到了摩押平原。',
  thread: '摩押王巴勒看见以色列人漫山遍野——"现在这众人要把我们四围所有的都舔尽，就如牛舔尽田间的草一般。"他雇了大河那边的先知巴兰来咒诅以色列。巴兰骑驴上路——但那驴看见了巴兰没看见的东西。耶和华的使者拔刀站在窄路上。驴三次躲避、三次被打。然后——耶和华开了驴的口。一个贪财的先知，即将说出弥赛亚的预言。',
  choices:[{next:'s9_1'}], btnText:'走向摩押平原 →'
},
s9_1: {
  ch:9, chName:'第九章 · 巴兰', prog:0.94, effect:null,
  narrative: '摩押王巴勒看见你们——漫山遍野如蝗虫，遮满地面。他慌了。\n\n"现在这众人要把我们四围所有的都舔尽——就如牛舔尽田间的草一般。"\n\n摩押人极其惧怕。巴勒打发使者往大河那边——毗夺——去找先知巴兰。带着卦金。带着咒诅的订单。\n\n"请你来为我咒诅这民——因为他们比我强盛。或者我能击败他们，把他们赶出此地。"\n\n巴兰——这个外邦先知、这个在民数记中最矛盾的角色——骑上驴，带着仆人，上路了。他的口知道耶和华的名，他的心却爱巴勒的卦金。\n\n但驴看见了——巴兰没看见的。\n\n耶和华的使者，拔刀，站在窄路上。',
  choices: [
    { text: '看驴——它看见了人看不见的东西。', cons: '驴突然转离正路，走进田间。巴兰打它——把它打回路上。驴又走——这次是在葡萄园的窄路上，两边有墙。它紧贴着墙过去，把巴兰的脚挤伤了。巴兰又打。第三次——路更窄了，无处可转，驴就卧倒在巴兰身下。巴兰发怒，用杖打了驴三次。你忽然想起：这头驴看见了耶和华的使者——但号称先知、自称认识耶和华的巴兰——没看见。一个人如果不比一头驴更属灵，那他的属灵状态值得深思。', verse: '民数记 22:22-25 — 神因他去就发了怒。耶和华的使者站在路上敌挡他……驴看见耶和华的使者站在路上，手里有拔出来的刀，就从路上跨进田间……', next: 's9_2' },
    { text: '看巴兰——这个先知的眼睛是瞎的。', cons: '你看着巴兰骑在驴上——手里拿着杖，嘴里可能还在盘算卦金怎么花。这是整个圣经中最讽刺的画面之一：一个外邦先知，口里认识耶和华，心里却只有金钱。他的"属灵"是职业性的。他会说"我必按耶和华所吩咐的而行"——但骨子里他想的是巴勒的银子。新约三次提到巴兰——彼后2章说他是贪爱不义之工价的先知，犹大书说他为利往错谬里直奔，启示录说他教导巴勒将绊脚石放在以色列人面前。他的眼睛是瞎的。', verse: '民数记 22:18 — 巴兰回答巴勒的臣仆说："巴勒就是将他满屋的金银给我，我行大事小事也不得越过耶和华我神的命。"', next: 's9_2' }
  ]
},
s9_2: {
  ch:9, chName:'第九章 · 巴兰', prog:0.95, effect:null,
  narrative: '耶和华开了驴的口。\n\n驴对巴兰说——\n\n"我不是你从小骑到老的驴吗？我素常向你这样行过吗？"\n\n巴兰说："没有。"\n\n然后——耶和华使巴兰的眼睛明亮。他看见了。拔刀的使者站在窄路上。\n\n巴兰俯伏在地。\n\n你看到这幅画面：驴开口说话——驴！全本圣经中唯一一次动物开口说话，以神的方式——说话的竟然是一头驴。而那个"先知"才刚刚看见使者。\n\n一个人如果不比一头驴更先看见神的使者——他的属灵感觉已经迟钝到了什么地步？\n\n不是神不说话。是我们的眼睛被金钱、名声、自己的野心蒙住了。巴兰看得见卦金的光芒——看不见天使的刀锋。',
  choices: [
    { text: '笑——这个画面确实有荒诞的一面。', cons: '你忍不住笑了。不是因为这件事好笑——是因为太讽刺了。一个骑着驴去咒诅神百姓的人，结果被自己的驴教训了。驴说："我素常向你这样行过吗？"这大概是圣经中最犀利的反问之一。如果一头驴平常都很听话——今天突然反常——难道不应该思考一下是不是有什么看不见的事情在发生吗？但巴兰没有。他打了三次。有时候神允许环境反常——不是巧合，是祂在拦阻你走在错误的路上。一头驴都看见了——你看见了吗？', verse: '民数记 22:28 — 耶和华叫驴开口，对巴兰说："我向你行了什么，你竟打我这三次呢？"', next: 's9_3' },
    { text: '沉思——这远不止是一头会说话的驴。', cons: '你沉默了。这件事远不止是一头会说话的驴。你觉得神在用这件事说一件更深的道理：祂可以使用任何东西——甚至一头驴——来传递祂的信息。如果祂可以用驴，就不要太看重你的头衔。"先知"——巴兰是先知。但今天，驴比先知更敏锐。属灵不是职位——是与神之间的敏锐。巴兰的职分是真先知——但他对神的心迟钝了。职位不能保证敏锐。只有保持俯伏的姿势——就像他在天使面前终于俯伏那样——才能看见。', verse: '民数记 22:31 — 当时，耶和华使巴兰的眼目明亮，他就看见耶和华的使者站在路上，手里有拔出来的刀。巴兰便低头俯伏在地。', next: 's9_3' }
  ]
},
s9_3: {
  ch:9, chName:'第九章 · 巴兰', prog:0.96, effect:null,
  narrative: '巴兰到了摩押地。巴勒领他到高处——巴力的高处。可以看到以色列营的边界。\n\n筑七座坛。献七只公牛、七只公羊。\n\n巴勒站在坛旁，等着——等一句咒诅。卦金已经付了，坛已经筑了，祭物已经献了——现在，说。\n\n巴兰开口。\n\n出来的不是咒诅——是祝福。\n\n"这是独居的民——不列在万民中。"\n\n"谁能数点雅各的尘土？谁能计算以色列的四分之一？"\n\n"我愿如义人之死而死——我愿如义人之终而终。"\n\n巴勒大怒。"你向我作的是什么事呢？我领你来咒诅我的仇敌，不料——你竟为他们祝福！"\n\n巴兰说："耶和华传给我的话——我能不谨慎传说吗？"\n\n不能咒诅。因为神没有咒诅。',
  choices: [
    { text: '惊讶——从雇来咒诅的人口中，居然流出祝福。', cons: '你站在以色列营的边界——你在"雅各的尘土"之中。巴兰从山上望下来，看见营盘按支派排列——十二个支派，会幕在正中央，云彩在上面。他可能不知道他看见的是十字架的布局。但他知道一件事：这些人不能被咒诅。不是因为他们的好——是因为神与他们同在。巴勒付了钱——但神的祝福不是金钱能买、咒诅能废的。巴兰的口在那一刻不受他自己控制——神将咒诅扭转为祝福。', verse: '民数记 23:8 — 神没有咒诅的，我焉能咒诅？耶和华没有怒骂的，我焉能怒骂？', next: 's9_4' },
    { text: '安静听——看巴兰还能说出什么。', cons: '巴勒不放弃。他又带巴兰到另一个高处——毗斯迦山顶。又筑七座坛，又献七牛七羊。巴兰开口："神非人，必不致说谎；也非人子，必不致后悔。祂说话岂不照着行呢？祂发言岂不要成就呢？我奉命祝福——神也曾赐福——此事我不能翻转。祂未见雅各中有罪孽，也未见以色列中有奸恶。"你听着——这不像是从一个雇来咒诅的人口中说出来的话。这是从圣灵来的。巴兰的口在说真理，但他的心还是那个算卦金的。恩赐不等同于生命。', verse: '民数记 23:19-20 — 神非人，必不致说谎；也非人子，必不致后悔。祂说话岂不照着行呢？祂发言岂不要成就呢？我奉命祝福，神也曾赐福，此事我不能翻转。', next: 's9_4' }
  ]
},
s9_4: {
  ch:9, chName:'第九章 · 巴兰', prog:0.97, effect:'embers',
  narrative: '第四次。巴兰举目——看见以色列人按支派居住。\n\n这次——不需要巴勒请他开口。神的灵降在他身上。\n\n"我看他却不在现时——我望他却不在近日。\n\n有星要出于雅各——有杖要兴于以色列。\n\n必有一位出于雅各的，掌大权。"\n\n你听见了吗——从巴兰口中——从一个雇来咒诅的人口中——说出了弥赛亚的预言。\n\n巴勒暴怒。巴兰没有拿到卦金——但他分文无法改变他口中出来的话。\n\n这不是巴兰在说话。这是神在借用一张不情愿的嘴，宣告最荣耀的应许。一个贪婪的先知，说出了关于万王之王的预言。神的幽默感，大概没有比这更浓的了。\n\n"有星要出于雅各"——这颗星后来出现在伯利恒。博士们从东方来——也许就是巴兰的故乡——说："我们在东方看见祂的星。"巴兰说出了第一颗圣诞之星。',
  choices: [
    { text: '记住这话——星要出于雅各。', cons: '你把这句话刻在心里。"我看他却不在现时，我望他却不在近日。"不是现在。不是明天。不是今年。要等。等一颗星——升起在雅各的后裔中。你数着巴兰的四次预言——从"独居的民"到"星出于雅各"，一次比一次高，像梯子一级一级升上去。巴兰来咒诅——却只得祝福。人的恶意在神的手中只能变成赞美。这是造物主的特权：把黑暗的东西编进光明的图案。你记下了那颗星——将来你要告诉你的孩子，在摩押平原上，有人指着你们的营盘预言了弥赛亚。', verse: '民数记 24:17 — 我看他却不在现时，我望他却不在近日。有星要出于雅各，有杖要兴于以色列。', next: 's9_5' },
    { text: '跪下——弥赛亚的预言从仇敌的口中说出。', cons: '你跪在尘土中。不是因为巴兰——是因为神。神能使用任何一张嘴。一个不爱祂的人、一个贪钱的人——祂都能用。这不是巴兰的圣洁——这是神的主权。你忽然想到：如果神可以用巴兰，祂当然也可以用你。不在于你多干净——在于祂多有能力。但你也想到另一面：巴兰虽然说了预言，他自己却没有得救。恩赐不等于生命——从始至终都是如此。他说"我愿如义人之死而死"——但他没有像义人那样活。他的结局不是在摩押——是在以色列人的刀下。', verse: '民数记 24:17 — 有星要出于雅各，有杖要兴于以色列。必有一位出于雅各的，掌大权。', next: 's9_5' }
  ]
},
s9_5: {
  ch:9, chName:'第九章 · 巴兰', prog:0.98, effect:'embers',
  narrative: '但故事没有结束。\n\n巴兰暗中教巴勒一个更阴险的方法——"叫以色列人在毗珥的事上得罪耶和华。"\n\n巴兰知道——咒诅不能从外面临到以色列。但如果他们自己犯罪——如果罪从里面发动——瘟疫就会来。\n\n什亭。百姓与摩押女子行淫。那些女子请他们来——一同给她们的神献祭。百姓就吃了，跪拜她们的神——巴力毗珥。\n\n耶和华的怒气发作。瘟疫爆发。\n\n摩西和全会众在会幕门口哭泣。\n\n然后——非尼哈——亚伦的孙子、以利亚撒的儿子——看见一个以色列人当着全会众的面，带着一个米甸女人走进自己的帐棚。\n\n非尼哈拿枪——从会幕前起身——跟进去——将两人一同刺透。\n\n瘟疫止住了。\n\n死了——二万四千人。\n\n没有一个外在的咒诅能碰神的百姓。巴兰的咒诅变成祝福。巴勒的银子白白花费。但内在的罪——他们自己选择的罪——可以。',
  choices: [
    { text: '看非尼哈——他以忌邪的心止住了瘟疫。', cons: '非尼哈从会幕前站起来的身影，你一辈子忘不了。他手里拿着枪——但不是愤怒失控。他父亲是祭司，他是亚伦的孙子。他知道什么叫圣洁。他没有开会讨论，没有召开长老会——他看见了罪，他看见了瘟疫，他看见了二者之间的因果关系。于是他做了该做的事。神对摩西说："非尼哈使我向以色列人所发的怒消了——因他在他们中间以我的忌邪为心。"忌邪——不是人的嫉妒，是神的圣洁被触犯时的义愤。', verse: '民数记 25:7-8 — 祭司亚伦的孙子、以利亚撒的儿子非尼哈看见了，就从会中起来，手里拿着枪，跟随那以色列人进亭子里去，便将以色列人和那女人由腹中刺透。这样，在以色列人中瘟疫就止息了。', next: 'conn_9_10' },
    { text: '想到自己——里面的罪比外面的咒诅更危险。', cons: '你低下头。巴兰花了那么多功夫筑坛、献祭、想用法术咒诅以色列——都失败了。但他找到了一个入口：人里面的私欲。不需要法术。只需要摩押的女人。以色列人自己走上去的。没有人强迫他们。你忽然意识到——你最大的敌人从来不是巴勒、不是巴兰、不是埃及人。是你自己里面那颗对罪点头的心。外面的攻击无法碰触神所保护的——但里面的妥协可以。那天你做了一个决定：不再问"罪会伤害我吗"——你知道了。你问："我里面有什么对罪开着的门？"', verse: '民数记 25:9 — 那时遭瘟疫死的，有二万四千人。', next: 'conn_9_10' }
  ]
},
s10_1: {
  ch:10, chName:'第十章 · 摩西的告别', prog:0.92, effect:null,
  narrative: '一百二十岁的摩西站在摩押平原。眼不花、力不衰。但他不能过约旦河——米利巴的那次击打。\n\n"以色列啊，你要听。耶和华我们神是独一的主。你要尽心、尽性、尽力爱耶和华你的神。"\n\n这句话后来成为以色列人每天早晨和晚上都要背诵的信仰宣言——"示玛"。\n\n他在对他们说话。不是用律法条文的方式——是用父亲对儿女的方式。老人声音里有迫切——因为他知道自己马上要走了，因为他知道人有多容易忘记。四十年旷野——他亲眼看见他们怎样忘记。\n\n"尽心"——全部的热爱。"尽性"——全部的生命。"尽力"——全部的力量。不是分出一部分给神。是全部。因为祂是先把自己全部给了以色列的神。',
  choices: [
    { text: '听——这是所有律法的总纲。', cons: '你站在人群中——也许靠得很近。摩西的声音经过旷野的风，传到你的耳朵里。他说的不是神的十诫——他说的是神的"一"。"耶和华我们神是独一的主"——独一意味着没有竞争者。迦南遍地都是巴力——但你的神只有一个。尽心、尽性、尽力爱祂——不是因为祂需要你的爱，是因为你活着就是为此。耶稣后来引用这段话回答"最大的诫命是什么"——摩西在三千多年前说的话，至今还是标准答案。不是旧约的残余——是一切律法的根基。', verse: '申命记 6:4-5 — 以色列啊，你要听。耶和华我们神是独一的主。你要尽心、尽性、尽力爱耶和华你的神。', next: 's10_2' },
    { text: '看约旦河那边的迦南——你很快就要过去了。', cons: '摩西还在说话——但你的目光越过他瘦削的肩膀，投向约旦河对面。那里是迦南——应许之地。你能看见对岸的树、隐约的山脊。但摩西不能过去。他站在这里——离迦南只差几公里——但他永远不能踏进去。米利巴的那次。"不在以色列人眼前尊我为圣"——他失去了进入应许之地的资格。但此刻他没有为自己哀叹——他在教导你怎样进去。这就是摩西——到最后一刻，还在想着神百姓的未来。', verse: '申命记 3:27 — 你且上毗斯迦山顶去，向东、西、南、北举目观望——因为你必不能过这约旦河。', next: 's10_2' }
  ]
},
s10_2: {
  ch:10, chName:'第十章 · 摩西的告别', prog:0.93, effect:null,
  narrative: '"耶和华专爱你们，拣选你们——并非因你们的人数多于别民。原来你们的人数在万民中是最少的。只因耶和华爱你们……"\n\n"只因耶和华爱你们。"\n\n没有理由。不是因为你们人多——事实上你们是最少的。不是因为你们好——金牛犊的事还没忘，加低斯的事还没忘。不是因为你们的义——"你本是硬着颈项的百姓。"\n\n只是因为祂爱。\n\n你站在人群中——是最少的之一。不是最大的支派，不是最有名的家族。被拣选——不是因为人多。被爱——不是因为你可爱。\n\n这就是拣选的奥秘：不是因为看见了价值才爱——是因为爱了，就创造了价值。祂不是因为你是特别的所以拣选你——是因为祂拣选了你，你才成为特别的。',
  choices: [
    { text: '记住——被爱，不是因为你人多。', cons: '你把这句话重复了一遍："只因耶和华爱你们。"不是"因为你们值得"——是"因为祂爱"。这两种次序差之毫厘，却是两个世界。如果是"因为你值得"——那你随时可能不再值得，被爱就随时可以收回。但如果是"因为祂爱"——那被爱的基础就不在你身上，在祂身上。而祂不变。祂爱你，不是因为你——是因为祂自己是爱。这大概是最安全的事情了：爱你的那一位，不会改变主意。', verse: '申命记 7:7-8 — 耶和华专爱你们，拣选你们，并非因你们的人数多于别民，原来你们的人数在万民中是最少的。只因耶和华爱你们。', next: 's10_3' },
    { text: '数点自己——你在万民中最少的之中。', cons: '你看了看周围——以色列十二支派加起来，在整个古代近东确实是最少的。埃及、亚述、巴比伦、赫人——都比你们人多。神选择了一个小民族——最小的——来做祂的见证人。不是要通过人数来证明什么。祂的方式是反过来的：用最小来彰显最大。用最弱的来打败最强的。如同用一头驴来教训一个先知。如同用一条铜蛇来救被咬的人。如同用十字架来征服全世界。你越卑微——祂越能使用。这不是鸡汤——这是祂一直以来的作风。', verse: '申命记 7:7 — 原来你们的人数在万民中是最少的。', next: 's10_3' }
  ]
},
s10_3: {
  ch:10, chName:'第十章 · 摩西的告别', prog:0.95, effect:null,
  narrative: '"耶和华你的神要给你的心行割礼——除掉你心里的污秽——好叫你尽心尽性爱耶和华你的神，使你可以存活。"\n\n你听过肉身的割礼——第八天，在男婴身上，亚伯拉罕之约的记号。但"心的割礼"——这是一个新词。\n\n不是你在割——是祂在割。\n\n不是手的割礼——是心的。不是表面的记号——是里面的改变。不是你能做到的——律法写在外面刻在石头上，你做不到。但有一天——"我要将我的律法放在他们里面，写在他们心上。"\n\n摩西在摩押平原说出这句话，几百年后耶利米重复它，又几百年后保罗解释它。这是新约藏在旧约里的种子。\n\n你忽然明白了：神不是要你努力爱祂。是要祂自己来改变你的心——然后你自然会爱祂。恩典从头到尾。',
  choices: [
    { text: '触碰胸口——这里需要被割。', cons: '你把手放在胸口。心跳在掌下。你想到自己里面那些不愿面对的东西——贪心、妒忌、悖逆、不信。不是行为改了就能解决的。是心。心需要一把刀——不是你的刀，是祂的。割礼是痛苦的——切掉一些东西。但那是为了让你可以爱。不是"你要爱所以你们必须爱"——是"我来割，然后你就能爱了"。律法是要求，恩典是供应。律法说"你要爱"，恩典说"我来让你能爱"。', verse: '申命记 30:6 — 耶和华你的神必将你心里和你后裔心里的污秽除掉，好叫你尽心尽性爱耶和华你的神，使你可以存活。', next: 's10_4' },
    { text: '默想——律法写在石头上，比不上写在心上。', cons: '你静默思考。摩西下了山，带下来两块石版。他现在说"心的割礼"——意味着他知道石版不够。石版只能指出罪——不能改变心。你可以每天看十诫，却仍然违背十诫。但有一天——神要亲自从里面做。不是废除律法——是成就律法。写在石头上的字，变成心跳的节律。你想到那个预言："我要将我的灵放在你们里面——使你们顺从我的律例，谨守遵行我的典章。"那就是心的割礼。不是新的律法——是新的能力。', verse: '耶利米书 31:33 — 我要将我的律法放在他们里面，写在他们心上。我要作他们的神，他们要作我的子民。', next: 's10_4' }
  ]
},
s10_4: {
  ch:10, chName:'第十章 · 摩西的告别', prog:0.97, effect:'embers',
  narrative: '"我今日呼天唤地向你作见证。我将生死、祸福陈明在你面前。所以你要拣选生命——使你和你的后裔都得存活。"\n\n不是定罪。是恳求。\n\n天和地都在听着。摩西的声音里有颤抖——不是衰老，是一个知道结局的人在哀求。他把生死摆在你们面前，像摆着两条路：一条亮，一条暗。然后他说："拣选生命。"\n\n不是"你必须"。是"你要拣选"。\n\n他不能替你选。神自己也不会替你选。拣选是给你的——你必须伸出手，拿起来。\n\n"拣选生命"——这听起来像废话。谁会不拣选生命呢？但你看看旷野里倒下的——那些在基博罗哈他瓦的人，那些在加低斯的人。他们用自己的选择，拣选了死亡。不是不知道——是不肯。\n\n摩西的声音颤抖。因为他知道——你已经知道答案。但他还在求。',
  choices: [
    { text: '拣选生命——伸出手，拿起来。', cons: '你在心里说：我拣选生命。不是别的假神，不是埃及的韭菜和蒜，不是巴力毗珥。是这位——领你出埃及、在旷野赐吗哪、从磐石流水的耶和华。你知道你还会失败。但今天——在摩押平原——你做了一个决定。摩西说的不是"拣选一次成功"——是"拣选"。每一天都需要重新拣选。吗哪是一天一天降的，信心是一天一天拣选的。但方向已经定了。你向着迦南——不是向着埃及。你今天选择了生命。', verse: '申命记 30:19 — 我今日呼天唤地向你作见证。我将生死祸福陈明在你面前，所以你要拣选生命，使你和你的后裔都得存活。', next: 's10_5' },
    { text: '犹豫——拣选生命容易，持守生命难。', cons: '你的手停在半空。你相信摩西说的——但你太了解自己了。你知道你会失败。金牛犊的事——如果换做你，你可能也会去跳舞。可拉的叛乱——如果没人拦着，你可能也会站在"全会众都是圣洁的"那边。你怕今天拣选了——明天又丢了。但你注意到摩西的话——"使你和你的后裔都得存活"。不是只关乎你。你的选择会影响你的孩子。即便为了他们——你也应该选。你终究伸出了手。不是完美的信心——是诚实的选择。', verse: '申命记 30:19-20 — 所以你要拣选生命，使你和你的后裔都得存活。且爱耶和华你的神，听从祂的话，专靠祂。因为祂是你的生命，你的日子长久也在乎祂。', next: 's10_5' }
  ]
},
s10_5: {
  ch:10, chName:'第十章 · 摩西的告别', prog:0.98, effect:'embers',
  narrative: '摩西唱起歌来。\n\n一百二十年了——从他站在尼罗河畔的蒲草箱旁边，到如今站在摩押平原。他经历过法老的宫殿、米甸的旷野、西奈的雷轰、金牛犊下的心碎。现在他开口——唱歌。\n\n"诸天哪，侧耳，我要说话——愿地也听我口中的言语。"\n\n"你轻忽生你的磐石——忘记产你的神。"\n\n"你们外邦人——当与主的百姓一同欢呼。"\n\n这首歌不是赞美诗——是见证。天和地是证人。磐石——那个词他用了太多次。何烈山的磐石，被击打后水涌出来。米利巴的磐石，他击打了两下——然后就失去了迦南。磐石是他一生服事的主题。\n\n现在他唱——"他们的磐石不如我们的磐石。"\n\n他老了。但他的歌没有老。这首歌——摩西之歌——将来会在玻璃海上，被那些胜了兽的人再次歌唱。',
  choices: [
    { text: '听——一百二十年的重量在这歌声里。', cons: '你静静地听着。摩西的声音不是专业的歌喉——是一百二十年旷野风沙磨出来的嗓子。但你从来没有听过比这更真诚的歌。每一个字都是从他骨头的深处挖出来的。"你轻忽生你的磐石"——他唱这句话时，会不会想到何烈山？会不会想到米利巴？会不会想到他失去的迦南？你不知道。但你听到的不是自怜。是敬拜。一个不被允许进入应许之地的人，在应许之地的边缘，唱关于磐石的歌。', verse: '申命记 32:4 — 祂是磐石，祂的作为完全；祂所行的无不公平，是诚实无伪的神，又公义，又正直。', next: 's10_6' },
    { text: '跟着唱——哪怕你还不会歌词。', cons: '你的嘴唇动了。你不知道每一句歌词——但你知道这首歌在讲你的故事。你是那个"愚昧无知的民"，也是那个被耶和华"环绕、看顾、保护如同眼中的瞳人"的。摩西在唱——"耶和华独自引导他，并无外邦神与他同在。"你在旷野四十年了——你知道这不是夸张。没有吗哪从天降给任何别的民族。没有云柱火柱引导任何别的军队。你们是独居的民。这首歌——在唱你。', verse: '申命记 32:10-12 — 耶和华遇见他在旷野荒凉野兽吼叫之地，就环绕他，看顾他，保护他，如同保护眼中的瞳人……这样，耶和华独自引导他，并无外邦神与他同在。', next: 's10_6' }
  ]
},
s10_6: {
  ch:10, chName:'第十章 · 摩西的告别', prog:0.99, effect:null,
  narrative: '摩西从摩押平原登上尼波山——毗斯迦山顶。\n\n一百二十岁。没有拐杖。没有人扶。他自己走上去的。\n\n耶和华将全地指给他看。基列直到但——北面。拿弗他利——加利利的山。以法莲和玛拿西——中部的山地。犹大直到西海——南面直到地中海。约旦河谷——绿色的平原，像一条翡翠带子，从北向南铺开。\n\n"这就是我向亚伯拉罕、以撒、雅各起誓应许之地。我使你眼睛看见了——你却不得过到那里去。"\n\n你看见老人的背影。他在山顶站了很久。\n\n没有辩解。没有哀求。耶和华说的——他接受了。不是因为他不痛——是因为他相信神的话。近在眼前的迦南——他看见了。然后——他将死在这山上。如同亚伦死在何珥山。\n\n但他看见你将要进去的——他为第二代人感谢神。',
  choices: [
    { text: '仰望——和摩西一起看那应许之地。', cons: '你站在山下——看不见摩西在山上看见的景象。但你知道他看见了什么。应许之地。从亚伯拉罕在摩利亚山上被试验，到如今——六百多年了。摩西看见了，但不能进去。你觉得这不公平——但摩西没有抗议。他接受了。你忽然理解：有些人的职分是看见——不是进入。摩西是律法的代表。律法可以把你带到迦南的边界——但不能带你进去。带你进去的是约书亚——希伯来文"耶和华拯救"。正如耶稣——同一个名字——带我们进入律法永远进不去的安息。', verse: '申命记 34:1-4 — 摩西从摩押平原登尼波山，上了那与耶利哥相对的毗斯迦山顶。耶和华把基列全地直到但……都指给他看。耶和华对他说："这就是我向亚伯拉罕、以撒、雅各起誓应许之地。我使你眼睛看见了，你却不得过到那里去。"', next: 's10_7' },
    { text: '低头——不忍心看一个老人站在山顶。', cons: '你低下头。不是不尊重——是太尊重了。这个人在法老面前毫无惧色。他把杖伸向红海，海就分开。他在西奈山上四十昼夜，领受两块法版。但现在他站在尼波山顶——一个不被允许进入应许之地的老人，望着他带领了四十年的百姓将要进去的地。你不忍心看——但你强迫自己看。你需要记住这一刻。因为将来的有一天，你也会站在某个边界上——看见应许，却不能进去。不是因为神不爱你——是因为你有一个摩西一样的职分：为下一代开路。', verse: '申命记 34:4 — "我使你眼睛看见了，你却不得过到那里去。"', next: 's10_7' }
  ]
},
s10_7: {
  ch:10, chName:'第十章 · 摩西的告别', prog:1.0, effect:'embers',
  narrative: '摩西——耶和华的仆人——死在摩押地。正如耶和华所说的。\n\n耶和华亲手埋葬他。在伯毗珥对面的山谷——摩押地。没有人知道他的坟墓在哪里——到今日没有人知道。\n\n不是被百姓埋葬。是神亲自埋葬的。祂接走了祂的仆人。\n\n以色列人在摩押平原为摩西哀哭了三十天——和亚伦一样。三十天。为这个带领他们四十年的人。为这个替他们代求、容忍了他们的悖逆、把迦南指给他们看却自己不能进去的人。\n\n"以后以色列中再没有兴起先知像摩西的——他是耶和华面对面所认识的。"\n\n但你记得摩西自己说过的话——在申命记18:15："耶和华你的神要从你们弟兄中间兴起一位先知像我——你们要听从祂。"\n\n约书亚被智慧的灵充满。明天——要过约旦河。',

function renderChapterSelect() {

  h += '<button class="restart-btn" onclick="render(currentBook.chapters[0].start)">\u4ece\u5934\u5f00\u59cb</button>';
  h += '<div class="chapter-grid">';
  book.chapters.forEach(function(ch, i) {
    var chId = ch.id || (i+1);
    var done = isChapterCompleted(book.id, chId);
    h += '<div class="ch-card'+(done?' done':'')+'" onclick="gameState.bookId=currentBook.id;render(\''+ch.start+'\')">';
    h += '<div class="ch-num">\u7b2c'+numCN(i+1)+'\u7ae0</div>';
    h += '<div class="ch-title">'+(ch.title||'')+'</div>';
    if (done) h += '<div class="ch-check">\u2713</div>';
    h += '</div>';
  });
  h += '</div></div>';
  c.innerHTML = h;
}

function getBookProgress(bookId) {
  var count = 0;
  var book = BOOKS[bookId];
  if (!book) return 0;
  book.chapters.forEach(function(ch, i) {
    if (isChapterCompleted(bookId, ch.id||i+1)) count++;
  });
  return count;
}

function isChapterCompleted(bookId, chId) {
  var data = JSON.parse(localStorage.getItem('covenant_achievements')||'{}');
  return data['ch_'+bookId+'_'+chId] === true;
}

function unlockAchievement(id) {
  try {
    const raw = localStorage.getItem('covenant_achievements');
    const data = raw ? JSON.parse(raw) : {};
    if (data[id]) return false;
    data[id] = Date.now();
    localStorage.setItem('covenant_achievements', JSON.stringify(data));
    return true;
  } catch(e) { return false; }
}
function hasAchievement(id) {
  try {
    const raw = localStorage.getItem('covenant_achievements');
    if (!raw) return false;
    return !!JSON.parse(raw)[id];
  } catch(e) { return false; }
}
function getAllAchievements() {
  try {
    const raw = localStorage.getItem('covenant_achievements');
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

/* ═══ Verse Catalog — All possible verses from all books ═══ */
function buildVerseCatalog() {
  const catalog = {};
  for (const [bookId, book] of Object.entries(BOOKS)) {
    catalog[bookId] = [];
    const seen = new Set();
    for (const [sceneId, scene] of Object.entries(book.scenes)) {
      if (!scene.choices) continue;
      scene.choices.forEach(choice => {
        if (!choice.verse) return;
        const ref = (choice.verse.split(' — ')[0] || '').trim();
        const text = (choice.verse.split(' — ')[1] || choice.verse).trim();
        const key = text.substring(0, 30);
        if (!seen.has(key)) {
          seen.add(key);
          catalog[bookId].push({ chapter: scene.ch, ref, text, key });
        }
      });
    }
  }
  return catalog;
}

function renderStationPath(currentCh) {
  let html = '<div class="station-path">';
  STATIONS.forEach((st) => {
    let cls = 'st-future';
    if (st.ch < currentCh) cls = 'st-visited';
    if (st.ch === currentCh) cls = 'st-current';
    html += '<div class="st-dot ' + cls + '">';
    html += '<span class="st-num">' + (st.num !== '—' ? '站' + st.num : st.num) + '</span>';
    html += '<span class="st-name">' + st.name + '</span>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function render(sceneId, animate=true) {
  const scene = currentBook.scenes[sceneId];
  if (!scene) { renderTitle(true); return; }

  // Connection screens
  if (scene.isConnection) {
    renderConnection(scene);
    return;
  }

  gameState.currentScene = sceneId;
  gameState.choiceMade = false;
  gameState.selectedChoice = null;

  // Ambient effects
  setEffect(scene.effect || null);

  // Chapter index
  if (scene.ch) {
    const prevCh = gameState.chapterIndex + 1;
    gameState.chapterIndex = scene.ch - 1;
    if (scene.ch !== prevCh) switchBGM(getBGMForChapter(scene.ch));
  }

  let clabel = scene.ch ? '第' + numCN(scene.ch) + '章' : '';

  html += '</div>';
  html += '</div>';

  if (currentBook.id === 'wilderness') {
    html += renderStationPath(scene.ch || 1);
  }

  // Scene
  html += '<div class="scene-area" id="sceneArea">';
  // Chapter illustration
  if (scene.ch && currentBook.imgMap[scene.ch]) {
    html += '<img class="chapter-illustration" src="' + currentBook.imgMap[scene.ch] + '" alt="第' + numCN(scene.ch) + '章插图" loading="lazy">';

  if (scene.img) {
    html += '<img class="scene-illus" src="' + scene.img + '" alt="场景插图" loading="lazy">';

/* ═══ Progress ═══ */
function calcProgress(scene) {
  if (scene.prog !== undefined) {
    const ch = currentBook.chapters[gameState.chapterIndex] || currentBook.chapters[0];
    const chCount = currentBook.chapters.length;
    const chStart = gameState.chapterIndex / chCount;
    const chWidth = 1 / chCount;
    return (chStart + scene.prog * chWidth) * 100;
  }
  if (scene.isConnection) {
    return ((scene.fromCh) / currentBook.chapters.length) * 100;
  }
  return 0;
}

/* ═══ Events ═══ */
function bindEvents() {
  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      if (gameState.choiceMade) return;
      makeChoice(parseInt(this.dataset.choice));
    });
  });
  const continueBtn = document.getElementById('continueBtn');
  if (continueBtn) continueBtn.addEventListener('click', advanceScene);

  const bgmBtn = document.getElementById('bgmToggle');
  if (bgmBtn) bgmBtn.addEventListener('click', toggleBGM);

  const menuBtn = document.getElementById('menuBtn');
  const menuDropdown = document.getElementById('menuDropdown');
  if (menuBtn && menuDropdown) {
    menuBtn.addEventListener('click', e => {
      e.stopPropagation();
      gameState.menuOpen = !gameState.menuOpen;
      menuDropdown.classList.toggle('open', gameState.menuOpen);
    });
    document.addEventListener('click', () => {
      if (gameState.menuOpen) { gameState.menuOpen = false; menuDropdown.classList.remove('open'); }
    });
    menuDropdown.querySelectorAll('.menu-item').forEach(item => {
      item.addEventListener('click', e => {
        e.stopPropagation();
        const action = item.dataset.action;
        if (action === 'save') { saveGame(); flashSaveIndicator(); }
        else if (action === 'reset') {
          if (confirm('确定要重新开始吗？当前进度将丢失。')) {
            localStorage.removeItem('covenant_home_v2');
            gameState = { bookId:currentBook.id, currentScene:null, chapterIndex:0, sceneHistory:[], choiceMade:false, selectedChoice:null, menuOpen:false, loadedFromSave:false, startedAt:null, totalChoicesMade:0, choicesExplored:0, collectedVerses:[] };
            render(currentBook.chapters[0].start);
          }
        } else if (action === 'title') {
          renderTitle(hasSaveData());
        }
        gameState.menuOpen = false;
        menuDropdown.classList.remove('open');
      });
    });
  }
}

/* ═══ Game Logic ═══ */
function makeChoice(idx) {
  playClick();
  const scene = currentBook.scenes[gameState.currentScene];
  if (!scene || gameState.choiceMade) return;

  gameState.choiceMade = true;
  unlockAchievement('first_choice');
  gameState.selectedChoice = idx;
  const choice = scene.choices[idx];
  gameState.sceneHistory.push({
    scene: gameState.currentScene,
    chapter: scene.ch,
    choice: idx,
    verse: choice.verse || '',
    chosenText: choice.text,
    chosenCons: choice.cons || '',
    altText: scene.choices[1-idx] ? scene.choices[1-idx].text : '',
    altCons: scene.choices[1-idx] ? scene.choices[1-idx].cons || '' : '',
    altVerse: scene.choices[1-idx] ? scene.choices[1-idx].verse || '' : ''
  });
  gameState.totalChoicesMade = (gameState.totalChoicesMade || 0) + 1;
  if (!gameState.choicesExplored) gameState.choicesExplored = 0;
  gameState.choicesExplored = new Set(gameState.sceneHistory.map(h => h.scene)).size;
  if (choice.verse) {
    if (!gameState.collectedVerses) gameState.collectedVerses = [];
    const vRef = choice.verse.split(' — ')[0] || choice.verse;
    if (!gameState.collectedVerses.find(v => v.ref === vRef)) {
      gameState.collectedVerses.push({ chapter: scene.ch, text: choice.verse, ref: vRef });
    }
    // Global verse collection across all playthroughs
    const globalVerses = JSON.parse(localStorage.getItem('covenant_collected_verses') || '[]');
    const verseRef = (choice.verse.split(' — ')[0] || '').trim();
    const verseText = (choice.verse.split(' — ')[1] || choice.verse).trim();
    const verseKey = verseText.substring(0, 30);
    if (!globalVerses.find(v => v.key === verseKey)) {
      globalVerses.push({ book: currentBook.id, chapter: scene.ch, key: verseKey, text: verseText, ref: verseRef });
      localStorage.setItem('covenant_collected_verses', JSON.stringify(globalVerses));
    }
  }

  const choicesArea = document.getElementById('choicesArea');
  if (choicesArea) choicesArea.classList.add('dismissed');
  document.querySelectorAll('.choice-btn').forEach(b => b.classList.add('disabled'));

  const ca = document.getElementById('consequenceArea');
  const ct = document.getElementById('consequenceText');
  const sr = document.getElementById('scriptureRef');
  if (ca && ct && sr) {
    ct.textContent = choice.cons || '';
    sr.textContent = choice.verse || '';
    ca.classList.add('revealed');
    setTimeout(() => {
      const cb = document.getElementById('continueBtn');
      if (cb) cb.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 400);
  }
}

function advanceScene() {
  playClick();
  const scene = currentBook.scenes[gameState.currentScene];
  if (!scene || gameState.selectedChoice === null) return;
  const nextId = scene.choices[gameState.selectedChoice].next;
  if (!nextId) return;

  // Track wilderness chapter coverage
  if (currentBook.id === 'wilderness' && scene.ch) {
    if (!gameState.wildChapters) gameState.wildChapters = [];
    if (!gameState.wildChapters.includes(scene.ch)) {
      gameState.wildChapters.push(scene.ch);
      if (gameState.wildChapters.length >= currentBook.chapters.length) {
        unlockAchievement('wilderness_stations');
      }
    }
  }

  if (nextId === 'ending') { renderEnding(); return; }
  render(nextId);
}

/* ═══ Save/Load ═══ */
function saveGame() {
  if (!gameState.currentScene) return;
  try {
    localStorage.setItem('covenant_home_v2', JSON.stringify({
      bookId: gameState.bookId,
      currentScene: gameState.currentScene,
      chapterIndex: gameState.chapterIndex,
      sceneHistory: gameState.sceneHistory,
      wildChapters: gameState.wildChapters,
      startedAt: gameState.startedAt,
      loadedFromSave: gameState.loadedFromSave,
      totalChoicesMade: gameState.totalChoicesMade,
      choicesExplored: gameState.choicesExplored,
      collectedVerses: gameState.collectedVerses
    }));
  } catch(e) {}
}
function loadGameData() {
  try { const r = localStorage.getItem('covenant_home_v2'); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function hasSaveData() { return !!loadGameData(); }
function flashSaveIndicator() {
  const el = document.getElementById('saveInd');
  if (!el) return;
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 2000);
}

/* ═══ BGM ═══ */
let bgmOn = false;
let currentBGM = '';
function getBGMForChapter(ch) {
  for (const [key, chapters] of Object.entries(currentBook.bgmMap)) {
    if (chapters.includes(ch)) return 'media/bgm_' + key + '.mp3';
  }
  return 'media/bgm_violin.mp3'; // default
}

function switchBGM(src) {
  if (src === currentBGM) return;
  const a = document.getElementById('bgmAudio');
  if (!a) return;
  currentBGM = src;
  const wasPlaying = bgmOn && !a.paused;
  a.src = src;
  a.load();
  if (wasPlaying) a.play().catch(() => {});
}

function stopBGM() {
  const a = document.getElementById('bgmAudio');
  if (a) { a.pause(); a.currentTime = 0; }
  bgmOn = false;
}
function initBGM() {
  const a = document.getElementById('bgmAudio');
  if (!a) return;
  a.volume = 0.25;
  const src = getBGMForChapter(1);
  a.src = src;
  currentBGM = src;
  a.play().then(() => { bgmOn = true; updateBGMBtn(); }).catch(() => {});
}
function toggleBGM() {
  const a = document.getElementById('bgmAudio');
  if (!a) return;
  if (bgmOn) { a.pause(); bgmOn = false; }
  else { a.muted = false; a.play().then(() => { bgmOn = true; updateBGMBtn(); }).catch(() => {}); }
  updateBGMBtn();
}
function updateBGMBtn() {
  const b = document.getElementById('bgmToggle');
  if (!b) return;
  b.classList.toggle('on', bgmOn);
  b.innerHTML = bgmOn ? '<span class="bgm-icon">🔊</span>BGM' : '<span class="bgm-icon">🔇</span>BGM';
}

      html += '<div class="bi-alt">';
      html += '<div class="bi-label">另一条路</div>';
      html += '<div class="bi-text">' + h.altText + '</div>';
      if (h.altCons) html += '<div class="bi-cons">' + h.altCons.substring(0, 80) + (h.altCons.length > 80 ? '…' : '') + '</div>';
      html += '</div>';
      html += '</div>';
    }
    html += '</div></div>';
  }

  // Achievements
  const allAch = getAllAchievements();
  html += '<div class="achievements">';
  html += '<div class="deco-line"></div>';
  html += '<h3>成就</h3>';
  html += '<div class="ach-grid">';
  for (const [id, ach] of Object.entries(ACHIEVEMENTS)) {
    const unlocked = !!allAch[id];
    html += '<div class="ach-badge' + (unlocked ? ' unlocked' : '') + '">';
    html += '<div class="ach-icon">' + ach.icon + '</div>';
    html += '<div class="ach-name">' + ach.name + '</div>';
    html += '<div class="ach-desc">' + ach.desc + '</div>';
    html += '</div>';
  }
  html += '</div></div>';

  container.innerHTML = html;

  // Chapter card click handlers
  document.querySelectorAll('.ch-card:not(.locked)').forEach(card => {
    card.addEventListener('click', () => {
      const ch = parseInt(card.dataset.ch);
      if (ch >= 1 && ch <= currentBook.chapters.length) {
        render(currentBook.chapters[ch-1].start);
      }
    });
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    localStorage.removeItem('covenant_home_v2');
    gameState = { bookId:currentBook.id, currentScene:null, chapterIndex:0, sceneHistory:[], choiceMade:false, selectedChoice:null, menuOpen:false, loadedFromSave:false, startedAt:null, totalChoicesMade:0, choicesExplored:0, collectedVerses:[] };
    render(currentBook.chapters[0].start);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ═══ Verse Gallery — Full collection view ═══ */
function renderVerseGallery(filterBook) {
  stopBGM();
  const catalog = buildVerseCatalog();
  const collected = JSON.parse(localStorage.getItem('covenant_collected_verses') || '[]');
  const collectedKeys = new Set(collected.map(v => v.key));

  let bookTab = filterBook || 'all';

  function verseCardsForBook(bid) {
    if (!catalog[bid]) return [];
    return catalog[bid].map(v => ({
      ...v,
      collected: collectedKeys.has(v.key),
      book: bid
    }));
  }

  let allCards = [];
  if (bookTab === 'all') {
    for (const bid of ['genesis','exodus','wilderness']) {
      allCards = allCards.concat(verseCardsForBook(bid));
    }
  } else {
    allCards = verseCardsForBook(bookTab);
  }

  const total = allCards.length;
  const collectedCount = allCards.filter(c => c.collected).length;

  const bookLabels = {
    genesis: '创世奇旅',
    exodus: '出埃及奇旅',
    wilderness: '旷野奇旅'
  };

  let html = '';
  html += '<div class="verse-gallery">';
  html += '<button class="back-btn" onclick="renderBookSelect()">← 返回扉页</button>';
  html += '<h2>📜 经文宝库</h2>';

  // Tabs
  html += '<div class="gallery-tabs">';
  const tabs = [{id:'all',label:'全部'}];
  for (const bid of ['genesis','exodus','wilderness']) {
    tabs.push({id:bid,label:bookLabels[bid]});
  }
  for (const t of tabs) {
    html += '<button class="gallery-tab' + (bookTab === t.id ? ' active' : '') + '" data-book="' + t.id + '">' + t.label + '</button>';
  }
  html += '</div>';

  // Progress
  html += '<div class="gallery-progress">已收集 ' + collectedCount + '/' + total + ' 段经文</div>';

  // Card grid
  html += '<div class="verse-card-grid">';
  for (const v of allCards) {
    const cls = v.collected ? 'collected' : 'locked';
    html += '<div class="verse-card ' + cls + '">';
    html += '<div class="vc-chapter">第' + numCN(v.chapter || 0) + '章</div>';
    html += '<div class="vc-ref">' + (v.ref || '') + '</div>';
    const excerpt = v.text.length > 60 ? v.text.substring(0, 60) + '…' : v.text;
    html += '<div class="vc-text">"' + excerpt + '"</div>';
    html += '<div class="vc-glow"></div>';
    html += '</div>';
  }
  html += '</div>';
  html += '</div>';

  const container = document.getElementById('gameContainer');
  container.innerHTML = html;

  // Tab click handlers
  container.querySelectorAll('.gallery-tab').forEach(tab => {
    tab.addEventListener('click', function() {
      renderVerseGallery(this.dataset.book);
    });
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ═══ Achievement Gallery — Full collection view ═══ */
function renderAchievementGallery() {
  stopBGM();
  const allAch = getAllAchievements();
  const ids = Object.keys(ACHIEVEMENTS).filter(id => id !== 'all_achievements');
  const total = ids.length;
  const unlockedCount = ids.filter(id => !!allAch[id]).length;

  // Also check all_achievements
  if (ids.every(id => allAch[id])) unlockAchievement('all_achievements');
  const allAchData = getAllAchievements();

  let html = '';
  html += '<div class="achievement-gallery">';
  html += '<button class="back-btn" onclick="renderBookSelect()">← 返回扉页</button>';
  html += '<h2>🏆 成就</h2>';
  html += '<div class="gallery-progress">已达成 ' + unlockedCount + '/' + total + ' 项成就</div>';
  html += '<div class="ach-card-grid">';
  for (const [id, ach] of Object.entries(ACHIEVEMENTS)) {
    if (id === 'all_achievements') continue;
    const unlocked = !!allAchData[id];
    html += '<div class="ach-card' + (unlocked ? ' unlocked' : ' locked') + '">';
    html += '<div class="ac-icon">' + ach.icon + '</div>';
    html += '<div class="ac-name">' + ach.name + '</div>';
    html += '<div class="ac-desc">' + ach.desc + '</div>';
    if (unlocked && allAchData[id]) {
      const d = new Date(allAchData[id]);
      html += '<div class="ac-time">' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  html += '</div>';

  const container = document.getElementById('gameContainer');
  container.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ═══ Utils ═══ */
function numCN(n) {
  return '一二三四五六七八九十'[n-1] || n;
}

/* ═══ Init ═══ */
function init() {
  const saved = loadGameData();
  if (saved && saved.currentScene) {
    gameState = { ...gameState, ...saved, loadedFromSave:true };
    if (saved.bookId && BOOKS[saved.bookId]) currentBook = BOOKS[saved.bookId];
    if (currentBook.scenes[saved.currentScene]) {
      render(saved.currentScene, false);
      return;
    }
  }
  renderTitle(hasSaveData());
}
document.addEventListener('DOMContentLoaded', init);

/* Keyboard */
document.addEventListener('keydown', e => {
  if ((e.key === 'ArrowRight' || e.key === 'Enter') && gameState.choiceMade) advanceScene();
  if (e.key >= '1' && e.key <= '9' && !gameState.choiceMade) {
    const idx = parseInt(e.key) - 1;
    const scene = currentBook.scenes[gameState.currentScene];
    if (scene && scene.choices && idx < scene.choices.length) makeChoice(idx);
  }
});

</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('media/sw.js').catch(() => {});
}
</script>
