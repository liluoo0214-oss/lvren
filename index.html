<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旅人 · 圣经宏大叙事文字冒险</title>
<link rel="manifest" href="media/manifest.json">
<meta name="theme-color" content="#1a1205">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="创世奇旅">
<link rel="apple-touch-icon" href="media/icon-192.webp">
<style>
/* ══════════════════════════════════════
   创世奇旅 — 圣经宏大叙事文字冒险
   出埃及记文字冒险 · 暗黑中世纪像素RPG美学
   ══════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep: #1a1008;
  --bg-surface: #2a1a0a;
  --bg-parchment: #23160a;
  --text-primary: #e8d5b7;
  --text-secondary: #b8a080;
  --gold: #c9a84c;
  --gold-bright: #e0c060;
  --gold-dim: #8a7040;
  --scripture: #9e8a6a;
  --border-subtle: rgba(201,168,76,0.2);
  --border-active: rgba(201,168,76,0.5);
  --border: rgba(201,168,76,0.25);
  --btn-bg: rgba(139,90,43,0.15);
  --btn-hover: rgba(139,90,43,0.28);
  --btn-active: rgba(139,90,43,0.4);
  --font-cjk: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-display: 'Cinzel',"Palatino","Georgia","Songti SC","SimSun",serif;
  --font-title: 'MedievalSharp',cursive;
  --font-body: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}

html, body {
  width: 100%; min-height: 100vh; min-height: 100dvh;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 16px; line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ═══ Background Layers — Candlelit Parchment ═══ */
.bg-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
.bg-grad {
  background:
    radial-gradient(ellipse 120% 50% at 50% 20%, rgba(80,50,20,0.4) 0%, transparent 60%),
    radial-gradient(ellipse 80% 35% at 50% 90%, rgba(30,15,5,0.5) 0%, transparent 55%),
    radial-gradient(ellipse 60% 30% at 50% 50%, rgba(120,70,20,0.08) 0%, transparent 70%),
    linear-gradient(180deg, rgba(26,16,8,0) 0%, rgba(26,16,8,0.95) 100%);
  animation: candleFlicker 8s ease-in-out infinite;
}

/* ═══ Candle Flicker Animation ═══ */
@keyframes candleFlicker {
  0%, 100% { opacity: 0.88; }
  12% { opacity: 0.94; }
  25% { opacity: 0.83; }
  37% { opacity: 0.91; }
  50% { opacity: 0.85; }
  63% { opacity: 0.92; }
  75% { opacity: 0.8; }
  88% { opacity: 0.9; }
}

/* ═══ Starfield — Hidden (replaced by ember particles) ═══ */
.starfield { display: none; }

/* ═══ Fire Embers — Ambient Floating Particles ═══ */
.embers {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  opacity: 0.15;
  transition: opacity 2s ease;
}
.embers.active { opacity: 0.45; }
.embers span {
  position: absolute; display: block; border-radius: 50%;
  background: radial-gradient(circle, rgba(230,140,30,0.75), rgba(180,80,20,0.15));
  box-shadow: 0 0 4px 1px rgba(200,120,30,0.25);
  width: var(--es, 3px); height: var(--es, 3px);
  animation: emberFloat var(--ed, 6s) var(--edelay, 0s) ease-out infinite;
}
@keyframes emberFloat {
  0% { opacity: 0.7; transform: translateY(0) translateX(0) scale(0.8); }
  15% { opacity: 0.9; transform: translateY(-25px) translateX(calc(var(--ex, 15px) * 0.3)) scale(1.1); }
  40% { opacity: 0.5; transform: translateY(-70px) translateX(calc(var(--ex, 15px) * 0.6)) scale(0.9); }
  70% { opacity: 0.2; transform: translateY(-120px) translateX(calc(var(--ex, 15px) * 0.85)) scale(0.5); }
  100% { opacity: 0; transform: translateY(-180px) translateX(var(--ex, 15px)) scale(0.15); }
}

/* ═══ Water Ripple — Darker, Subtle ═══ */
.ripple-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0;
  transition: opacity 2s ease;
}
.ripple-overlay.active { opacity: 0.1; }
.ripple-overlay::before, .ripple-overlay::after {
  content: ''; position: absolute;
  top: 50%; left: 50%; width: 60vmin; height: 60vmin;
  border-radius: 43% 47% 45% 46%;
  border: 1px solid rgba(201,168,76,0.25);
  animation: ripple 8s linear infinite;
  transform: translate(-50%, -50%);
}
.ripple-overlay::after {
  width: 80vmin; height: 80vmin;
  animation-duration: 12s; animation-direction: reverse;
  border-color: rgba(180,140,60,0.15);
}
@keyframes ripple {
  0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.8); opacity: 0.5; }
  50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.3); opacity: 0.15; }
  100% { transform: translate(-50%, -50%) rotate(360deg) scale(0.8); opacity: 0.5; }
}

/* ═══ Game Container — Parchment Scroll ═══ */
.game-container {
  position: relative; z-index: 1;
  max-width: 640px; margin: 0 auto;
  padding: 24px 22px 60px;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  /* Parchment texture via subtle gradient noise */
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(139,90,43,0.02) 2px,
      rgba(139,90,43,0.02) 4px
    ),
    linear-gradient(180deg, rgba(42,26,10,0.3) 0%, rgba(35,22,10,0.5) 50%, rgba(42,26,10,0.3) 100%);
  border-left: 1px solid var(--border-subtle);
  border-right: 1px solid var(--border-subtle);
}

/* Ornate corner flourishes on game container */
.game-container::before,
.game-container::after {
  content: '❦';
  position: fixed;
  color: var(--gold-dim);
  opacity: 0.2;
  font-size: 18px;
  pointer-events: none;
  z-index: 2;
}
.game-container::before { top: 12px; left: calc(50% - 320px + 10px); }
.game-container::after { top: 12px; right: calc(50% - 320px + 10px); }

/* ═══ Top Bar ═══ */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 0 14px; gap: 10px; position: relative;
}
.progress-wrap {
  flex: 1; height: 2px;
  background: rgba(201,168,76,0.08);
  border-radius: 1px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 1px;
  background: linear-gradient(90deg, rgba(138,112,64,0.5), var(--gold), var(--gold-bright));
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 6px rgba(201,168,76,0.25);
}
.save-indicator {
  font-size: 11px; color: var(--scripture);
  opacity: 0; transition: opacity 0.4s; white-space: nowrap;
}
.save-indicator.visible { opacity: 1; }
.menu-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border-subtle); background: var(--btn-bg);
  color: var(--text-secondary); font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.25s; flex-shrink: 0;
}
.menu-btn:hover, .menu-btn:active { border-color: var(--border-active); color: var(--gold); }

/* Menu Dropdown */
.menu-dropdown {
  position: absolute; top: 44px; right: 0;
  background: var(--bg-surface); border: 1px solid var(--border-active);
  border-radius: 6px; padding: 4px 0; min-width: 150px;
  opacity: 0; transform: translateY(-8px); pointer-events: none;
  transition: all 0.25s; z-index: 10;
  box-shadow: 0 8px 30px rgba(0,0,0,0.6);
}
.menu-dropdown.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
.menu-item {
  display: block; width: 100%; padding: 10px 18px;
  background: none; border: none; color: var(--text-secondary);
  font-size: 13px; text-align: left; cursor: pointer;
  font-family: var(--font-body); transition: all 0.2s;
}
.menu-item:hover, .menu-item:active { background: var(--btn-bg); color: var(--text-primary); }
.menu-item.danger { color: #b85040; }

/* ═══ Scene Area — Parchment Unroll ═══ */
.scene-area {
  flex: 1; display: flex; flex-direction: column;
  animation: parchmentUnroll 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
  transform-origin: top center;
}
@keyframes parchmentUnroll {
  0% { opacity: 0; transform: scaleY(0.9) translateY(-8px); }
  60% { opacity: 0.7; }
  100% { opacity: 1; transform: scaleY(1) translateY(0); }
}
.scene-area.fade-out {
  animation: pageTurnExit 0.4s ease-in forwards;
}
@keyframes pageTurnExit {
  0% { opacity: 1; transform: perspective(600px) rotateY(0deg) scale(1); }
  100% { opacity: 0; transform: perspective(600px) rotateY(15deg) scale(0.9); }
}

.chapter-label {
  font-size: 11px; letter-spacing: 0.22em; color: var(--gold-dim);
  text-transform: uppercase; margin-bottom: 6px;
  font-family: var(--font-display);
}
.chapter-title {
  font-size: 20px; font-weight: 700; color: var(--gold);
  margin-bottom: 20px; line-height: 1.4;
  font-family: var(--font-display);
  text-shadow: 0 0 40px rgba(201,168,76,0.2);
  letter-spacing: 0.04em;
}

/* ═══ Narrative — Text Appear ═══ */
.narrative-block {
  margin-bottom: 28px; position: relative;
  animation: textAppear 0.8s ease forwards;
}
@keyframes textAppear {
  0% { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: translateY(0); }
}
.narrative-text {
  font-size: 17px; line-height: 2.05; color: var(--text-primary);
  white-space: pre-line; font-family: var(--font-body);
  letter-spacing: 0.015em;
}
.narrative-text em { font-style: italic; color: var(--text-secondary); }

/* ═══ Choices — Leather-bound Buttons ═══ */
.choices-area {
  display: flex; flex-direction: column; gap: 11px;
  transition: opacity 0.35s, transform 0.35s;
}
.choices-area.dismissed {
  opacity: 0; transform: translateY(-14px); pointer-events: none;
}
.choice-btn {
  display: block; width: 100%; min-height: 48px; padding: 13px 17px;
  font-size: 16px; font-family: var(--font-body);
  color: var(--text-primary); text-align: left;
  background:
    linear-gradient(180deg, rgba(139,90,43,0.2) 0%, rgba(100,60,30,0.12) 100%);
  border: 1px solid var(--border-subtle);
  border-radius: 6px; cursor: pointer; transition: all 0.3s;
  line-height: 1.5; position: relative; overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(201,168,76,0.05);
}
.choice-btn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 0%, rgba(201,168,76,0.06) 100%);
  opacity: 0; transition: opacity 0.3s;
}
.choice-btn:hover::after, .choice-btn:active::after { opacity: 1; }
.choice-btn:hover, .choice-btn:active {
  border-color: var(--border-active);
  background: linear-gradient(180deg, rgba(139,90,43,0.35) 0%, rgba(100,60,30,0.2) 100%);
  box-shadow: 0 0 24px rgba(201,168,76,0.12), inset 0 1px 0 rgba(201,168,76,0.1);
  transform: translateX(3px);
}
.choice-btn:active { background: var(--btn-active); }
.choice-btn.disabled { pointer-events: none; opacity: 0.3; }

/* ═══ Chapter Illustration — Ornate Sepia Frame ═══ */
.chapter-illustration {
  width: 100%; border-radius: 4px;
  margin-bottom: 22px;
  border: 2px solid var(--gold-dim);
  filter: sepia(0.35) brightness(0.85) contrast(1.1);
  opacity: 0.9; transition: all 0.5s ease;
  display: block;
  box-shadow:
    0 0 20px rgba(201,168,76,0.08),
    inset 0 0 30px rgba(0,0,0,0.25);
  animation: borderGlow 4s ease-in-out infinite;
}
@keyframes borderGlow {
  0%, 100% { box-shadow: 0 0 12px rgba(201,168,76,0.06), inset 0 0 30px rgba(0,0,0,0.25); }
  50% { box-shadow: 0 0 24px rgba(201,168,76,0.18), inset 0 0 30px rgba(0,0,0,0.25); }
}
.chapter-illustration:hover { opacity: 1; filter: sepia(0.2) brightness(0.9) contrast(1.1); }

/* ═══ Scene Illustration ═══ */
.scene-illus {
  width: 100%; max-width: 85%; margin: 0 auto 22px;
  border-radius: 4px;
  border: 2px solid var(--gold-dim);
  filter: sepia(0.35) brightness(0.85) contrast(1.1);
  opacity: 0.9; transition: all 0.5s ease;
  display: block;
  box-shadow:
    0 0 20px rgba(201,168,76,0.08),
    inset 0 0 30px rgba(0,0,0,0.25);
  animation: borderGlow 4s ease-in-out infinite;
}
.scene-illus:hover { opacity: 1; filter: sepia(0.2) brightness(0.9) contrast(1.1); }

/* ═══ BGM Control ═══ */
.bgm-btn {
  display: flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--scripture);
  cursor: pointer; background: none; border: none;
  font-family: var(--font-body);
  transition: color 0.25s; padding: 2px 6px;
  border-radius: 10px; flex-shrink: 0;
}
.bgm-btn:hover { color: var(--gold); }
.bgm-btn.on { color: var(--gold); }
.bgm-btn .bgm-icon { font-size: 13px; }

/* ═══ Consequence ═══ */
.consequence-area {
  margin-top: 6px; padding: 16px 0 0;
  border-top: 1px solid var(--border-subtle);
  opacity: 0; max-height: 0; overflow: hidden;
  transition: all 0.5s ease;
}
.consequence-area.revealed { opacity: 1; max-height: 600px; }
.consequence-text {
  font-size: 15px; line-height: 1.95; color: var(--text-primary);
  white-space: pre-line; margin-bottom: 8px;
}
.scripture-box {
  display: block; margin: 12px 0 18px; padding: 12px 16px;
  border-left: 3px solid var(--gold-dim);
  background: rgba(201,168,76,0.05);
  border-radius: 0 4px 4px 0;
}
.scripture-ref {
  font-size: 13px; color: var(--scripture); font-style: italic;
  font-family: var(--font-display);
  animation: verseReveal 1.2s ease forwards;
}
@keyframes verseReveal {
  0% { opacity: 0; transform: translateX(-10px); }
  100% { opacity: 1; transform: translateX(0); }
}

.continue-btn {
  display: inline-block; padding: 10px 28px;
  font-size: 14px; font-family: var(--font-body);
  color: var(--gold); background: var(--btn-bg);
  border: 1px solid var(--border-active); border-radius: 4px;
  cursor: pointer; transition: all 0.3s;
}
.continue-btn:hover, .continue-btn:active {
  background: var(--btn-hover);
  box-shadow: 0 0 20px rgba(201,168,76,0.2);
}

/* ═══ Connection Screen — Spotlight Effect ═══ */
.connection-screen {
  text-align: center; padding: 36px 0;
  animation: parchmentUnroll 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
  position: relative;
}
/* Spotlight glow behind the quote */
.connection-screen::before {
  content: '';
  position: absolute;
  top: 18%; left: 50%; transform: translate(-50%, -50%);
  width: 200px; height: 200px;
  background: radial-gradient(ellipse, rgba(201,168,76,0.12) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
  animation: spotlightPulse 3s ease-in-out infinite;
}
@keyframes spotlightPulse {
  0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
}
.connection-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; position: relative; z-index: 1; }
.connection-label {
  font-size: 12px; color: var(--gold-dim); letter-spacing: 0.22em;
  margin-bottom: 12px; font-family: var(--font-display);
  position: relative; z-index: 1;
}
.connection-quote {
  font-size: 18px; color: var(--gold); line-height: 2;
  margin-bottom: 20px; font-style: italic; font-family: var(--font-display);
  position: relative; z-index: 1;
  text-shadow: 0 0 30px rgba(201,168,76,0.25);
}
.connection-narrator {
  font-size: 15px; color: var(--text-secondary); line-height: 2;
  margin-bottom: 30px; text-align: left; padding: 0 8px;
  position: relative; z-index: 1;
}
.connection-thread {
  display: inline-block; font-size: 12px; color: var(--scripture);
  padding: 6px 16px; border: 1px solid var(--border-active);
  border-radius: 4px; margin-bottom: 28px;
  font-family: var(--font-display);
  position: relative; z-index: 1;
}
.connection-btn {
  padding: 14px 36px; font-size: 16px; font-family: var(--font-display);
  color: var(--bg-deep); background: var(--gold);
  border: none; border-radius: 4px; cursor: pointer;
  transition: all 0.3s; font-weight: 700;
  letter-spacing: 0.05em;
  position: relative; z-index: 1;
}
.connection-btn:hover {
  background: var(--gold-bright);
  box-shadow: 0 0 40px rgba(201,168,76,0.4);
  transform: scale(1.03);
}

/* ═══ Chapter End ═══ */
.chapter-end {
  text-align: center; padding: 40px 0;
  animation: parchmentUnroll 0.7s ease;
}
.chapter-end .ch-num {
  font-size: 13px; color: var(--gold-dim);
  letter-spacing: 0.22em; margin-bottom: 8px;
  font-family: var(--font-display);
}
.chapter-end .ch-name {
  font-size: 26px; color: var(--gold); margin-bottom: 20px;
  font-family: var(--font-display); font-weight: 700;
  letter-spacing: 0.04em;
}
.chapter-end .ch-verse {
  font-size: 14px; color: var(--scripture); font-style: italic;
  margin-bottom: 28px; line-height: 1.9;
  font-family: var(--font-display);
}
.chapter-end .ch-btn {
  padding: 13px 34px; font-size: 15px; font-family: var(--font-body);
  color: var(--gold); background: var(--btn-bg);
  border: 1px solid var(--border-active); border-radius: 4px;
  cursor: pointer; transition: all 0.3s;
}
.chapter-end .ch-btn:hover {
  background: var(--btn-hover);
  box-shadow: 0 0 30px rgba(201,168,76,0.25);
}

/* ═══ Ending Screen ═══ */
.ending-screen {
  text-align: center; padding: 56px 0;
  animation: parchmentUnroll 0.9s ease;
  position: relative;
}
.ending-screen::before {
  content: '';
  position: absolute;
  top: 30%; left: 50%; transform: translate(-50%, -50%);
  width: 240px; height: 240px;
  background: radial-gradient(ellipse, rgba(201,168,76,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.ending-screen .end-icon { font-size: 40px; margin-bottom: 14px; opacity: 0.6; }
.ending-screen h2 {
  font-size: 26px; color: var(--gold); margin-bottom: 18px;
  font-family: var(--font-display); font-weight: 700;
  letter-spacing: 0.04em;
}
.ending-screen .end-text {
  font-size: 15px; color: var(--text-secondary);
  line-height: 2.1; margin-bottom: 24px;
}
.ending-screen .end-verse {
  font-size: 13px; color: var(--scripture); font-style: italic;
  margin-bottom: 30px; font-family: var(--font-display);
}

/* ═══ Title Screen — Ornate Medieval ═══ */
.title-screen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 48px 20px;
  animation: titleEnter 1.4s cubic-bezier(0.22, 0.61, 0.36, 1);
  position: relative;
}

/* Ornate border decorations */
.title-screen::before,
.title-screen::after {
  content: '';
  position: absolute;
  width: 60px; height: 60px;
  border-color: var(--gold-dim);
  border-style: solid;
  opacity: 0.3;
  pointer-events: none;
}
.title-screen::before {
  top: 20px; left: 20px;
  border-width: 2px 0 0 2px;
}
.title-screen::after {
  bottom: 20px; right: 20px;
  border-width: 0 2px 2px 0;
}

/* Corner diamond ornaments */
.title-screen .title-icon {
  font-size: 48px; margin-bottom: 18px; opacity: 0.7;
  text-shadow: 0 0 30px rgba(201,168,76,0.3);
}

@keyframes titleEnter {
  0% { opacity: 0; transform: scale(0.92) translateY(20px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.title-screen h1 {
  font-size: 38px; color: var(--gold); margin-bottom: 6px;
  font-family: var(--font-display); font-weight: 700;
  letter-spacing: 0.08em;
  text-shadow: 0 0 60px rgba(201,168,76,0.3), 0 2px 4px rgba(0,0,0,0.5);
}
.title-screen .subtitle {
  font-size: 13px; color: var(--scripture);
  margin-bottom: 12px; letter-spacing: 0.15em;
  font-family: var(--font-display);
}
.title-screen .byline {
  font-size: 12px; color: var(--gold-dim);
  margin-bottom: 30px; letter-spacing: 0.1em;
  font-family: var(--font-display);
}
.title-screen .desc {
  font-size: 13px; color: var(--text-secondary);
  line-height: 1.9; max-width: 300px; margin-bottom: 28px;
}
.title-screen .start-btn {
  padding: 16px 52px; font-size: 18px; font-family: var(--font-display);
  color: var(--bg-deep); background: var(--gold);
  border: none; border-radius: 4px; cursor: pointer;
  transition: all 0.3s; font-weight: 700;
  letter-spacing: 0.06em;
}

<audio id="bgmAudio" loop muted preload="auto"></audio>

<!-- Background elements -->
<div class="bg-grad bg-layer"></div>
<div class="starfield" id="starfield"></div>
<div class="embers" id="embers"></div>
<div class="ripple-overlay" id="ripple"></div>

<div class="game-container" id="gameContainer"></div>

<script>

/* ═══════════════════════════════════════════════════════
   出埃及奇旅 · 圣经宏大叙事 · 出埃及记
   9 Chapters · 51 Scenes · 8 Connection Scenes
   ═══════════════════════════════════════════════════════ */

/* ═══ Generate Stars ═══ */
(function(){
  const sf = document.getElementById('starfield');
  const N = 55;
  let frag = '';
  for (let i = 0; i < N; i++) {
    const cls = i % 7 === 0 ? ' shimmer' : '';
    const top = Math.random() * 100;
    const left = Math.random() * 100;
    const s = Math.random() < 0.25 ? '2px' : (Math.random() < 0.5 ? '2.5px' : '1.5px');
    const d = 3 + Math.random() * 6;
    const delay = Math.random() * 5;
    frag += '<i class="'+cls+'" style="top:'+top+'%;left:'+left+'%;--s:'+s+';--d:'+d+'s;--delay:'+delay+'s"></i>';
  }
  sf.innerHTML = frag;

  // Embers
  const em = document.getElementById('embers');
  let eFrag = '';
  for (let i = 0; i < 30; i++) {
    const l = 5 + Math.random() * 90;
    const t = 60 + Math.random() * 40;
    const es = Math.random() < 0.4 ? '2px' : '3px';
    const ed = 4 + Math.random() * 6;
    const edelay = Math.random() * 8;
    const ex = -30 + Math.random() * 60;
    eFrag += '<span style="left:'+l+'%;top:'+t+'%;--es:'+es+';--ed:'+ed+'s;--edelay:'+edelay+'s;--ex:'+ex+'px"></span>';
  }
  em.innerHTML = eFrag;

s3_1: {
  ch:3, chName:'第三章 · 方舟', prog:0.18, effect:'ripple',
  narrative: '许多世代过去了。\n\n耶和华见人在地上罪恶很大，终日所思想的尽都是恶。耶和华就后悔造人在地上，心中忧伤。\n\n"我要将所造的人……都从地上除灭。"\n\n但在那个败坏的时代，有一个人在耶和华眼前蒙恩。他的名字叫挪亚。挪亚是个义人，在当时的世代是个完全人。挪亚与神同行。\n\n神对挪亚说："凡有血气的人，他的尽头已经来到我面前……你要用歌斐木造一只方舟。看哪，我要使洪水泛滥在地上。"\n\n从来没有下过雨。从来没有见过海。神要你在山上造一艘船。',
  choices: [
    { text: '跪下说："主啊，仆人听从。"开始砍伐歌斐木。', cons: '你没有拖延。虽然从未见过雨，虽然无法想象洪水——但发出命令的那一位，是创造天地的神。信心的行动，往往从"不理解"开始。挪亚的信心，在尚未见过的事上显明了。', verse: '希伯来书 11:7 — 挪亚因着信，既蒙神指示他未见的事，动了敬畏的心，预备了一只方舟。', next: 's3_2' },
    { text: '"主啊……连雨都没有，我如何向人解释？"', cons: '你的疑问是诚实的。但神没有给你向人解释的任务。他只给了你一个命令：造方舟。有时，神要的不是我们去说服别人，而是我们自己先顺服。', verse: '创世记 6:22 — 挪亚就这样行。凡神所吩咐的，他都照样行了。', next: 's3_2' }
  ]
},

s3_2: {
  ch:3, chName:'第三章 · 方舟', prog:0.25, effect:'ripple',
  narrative: '方舟一天一天成形。\n\n歌斐木的香气混合着汗水和松脂，从清晨到日落，锤声在空旷的旱地上回响。\n\n不是一百二十天。是一百二十年。\n\n人们经过的时候会停下脚步。先是好奇，然后是嘲笑。"山上造船？挪亚疯了！""连雨都没见过，造什么方舟？""老糊涂了。"\n\n你的儿子们沉默地看着你。妻子在门口忧虑地张望。一百二十年。除了敲打声，就只有嘲笑声。',
  choices: [
    { text: '不管人们说什么，继续钉下每一颗钉子。', cons: '你选择闭口不言，继续建造。信心的行动本身就是最响亮的见证——不需要辩护，不需要争辩。方舟一天一天变得高大，嘲笑声也一天一天变得刺耳。但你心里有平安，因为你知道是谁让你开始的。', verse: '彼得后书 2:5 — 神也没有宽容上古的世代，曾叫洪水临到那不敬虔的世代，却保护了传义道的挪亚一家八口。', next: 's3_3' },
    { text: '停下手中的活，试图说服人们悔改。', cons: '你花了太多时间试图说服不会相信的人。你的心是为了他们好——神看见了。但圣灵才能开启人心。你的职责是顺服，不是做圣灵的工作。回到锤子和木头旁，继续建造。', verse: '创世记 6:22 — 挪亚就这样行。凡神所吩咐的，他都照样行了。', next: 's3_3' },
    { text: '看着空荡荡的天，心里开始动摇……', cons: '怀疑是真实的。一百二十年实在太长了。但你回想——那一日神对你说话的时候，他的声音何等清晰。记忆是信心的锚。你深吸一口气，重新拿起锤子。信心不是你从来不怀疑，而是你怀疑之后仍然选择顺服。', verse: '雅各书 1:6 — 只要凭着信心求，一点不疑惑。因为那疑惑的人，就像海中的波浪。', next: 's3_3' }
  ]
},

s3_3: {
  ch:3, chName:'第三章 · 方舟', prog:0.34, effect:'ripple',
  narrative: '方舟完工了。\n\n那一天，各样走兽、飞鸟、昆虫，一对一对地来到方舟前——不是你去捕捉的，是它们自己来的。狮子与绵羊并肩走进舱门，没有咆哮，没有流血。造物主仍然在指挥他的受造物。\n\n耶和华对挪亚说："你和你的全家都要进入方舟……因为再过七天，我要降雨在地上四十昼夜。"\n\n方舟的门敞开。天空仍然晴朗。人们在远处过着日常的生活——吃喝、嫁娶、买卖。但神说——"进去。"',
  choices: [
    { text: '带领全家，毫不犹豫地走进方舟。', cons: '你进去了。在你身后，门缓缓关上——但不是你关的。"耶和华就把他关在里头。"从此，里面的人出不去，外面的人进不来。这是审判，也是保护。那扇门，是神亲自关上的。', verse: '创世记 7:16 — 凡有血肉进入方舟的……耶和华就把他关在里头。', next: 's3_4' },
    { text: '站在门口，最后看一眼外面的世界。', cons: '你回望了一眼。那些熟悉的面孔——一起长大的邻居，集市上常见的小贩——他们不会进来了。你的心沉重。恩典的大门不会永远敞开。但神关上的门，没有人能开。你踏入了方舟。', verse: '创世记 7:1 — 耶和华对挪亚说：你和你的全家都要进入方舟。', next: 's3_4' }
  ]
},

s3_4: {
  ch:3, chName:'第三章 · 方舟', prog:0.45, effect:'ripple',
  narrative: '大渊的泉源都裂开了，天上的窗户也敞开了。\n\n四十昼夜。降水在地上。\n\n方舟在巨浪中起伏，像一片核桃壳漂浮在无边的深渊上。外面——一切有气息的都死了。里面——八个人和满舱的动物，在黑暗和摇晃中抓住神的应许。\n\n日子一天一天过去。水势浩大，在地上共一百五十天。\n\n方舟里气味越来越重，动物焦躁不安，妻子在角落低声祷告。摇晃。黑暗。等待。',
  choices: [
    { text: '在黑暗中唱诗赞美神。', cons: '你在摇晃的船舱里开口歌唱。记不记得词不重要，唱得好不好听也不重要。赞美是你对环境的宣告——这位神不会淹死他自己的应许。方舟不是你的保险箱——它是神的约柜。', verse: '诗篇 46:1-3 — 神是我们的避难所，是我们的力量……所以地虽改变，山虽摇动到海心，我们也不害怕。', next: 's3_5' },
    { text: '恐惧抓住了你，缩在角落发抖。', cons: '恐惧是真实的。但方舟不是靠你的信心漂浮的——是神的手托住了它。你害怕，但方舟没有沉。你的感觉不能改变神的信实。在这个封闭的木箱里，安全感不是来自风和浪的止息，而是来自那一位关上门的主。', verse: '以赛亚书 41:10 — 你不要害怕，因为我与你同在；不要惊惶，因为我是你的神。', next: 's3_5' }
  ]
},

s3_5: {
  ch:3, chName:'第三章 · 方舟', prog:0.58, effect:'ripple',
  narrative: '神记念挪亚。\n\n水渐渐消退。方舟停在亚拉腊山上。\n\n你放出一只乌鸦，飞来飞去没有回来。又放出一只鸽子——它找不到落脚的地方，飞回了方舟。你伸手把它接回来。袖口湿了一片。\n\n又等了七天。再放鸽子。\n\n黄昏时分，它回来了。嘴里衔着一片新拧下来的橄榄叶子。\n\n你看着那片绿叶在昏暗中微微颤动——整个世界都不一样的绿色。小小的叶子，却是巨大的应许：外面还有一个活着的世界。',
  choices: [
    { text: '跪在方舟甲板上，捧着橄榄叶流泪祷告。', cons: '一片叶子，胜过千言万语。神没有忘记你。在方舟里的一百五十天，他看见你。他不打盹，也不睡觉。那片橄榄叶，就是最好的回答。', verse: '创世记 8:1 — 神记念挪亚和挪亚方舟里的一切走兽牲畜。', next: 's3_6' }
  ]
},

s3_6: {
  ch:3, chName:'第三章 · 方舟', prog:0.68, effect:null,
  narrative: '你出了方舟。\n\n第一件事——不是搭帐篷，不是找食物。\n\n你筑了一座坛，拿各类洁净的牲畜、飞鸟献在坛上为燔祭。耶和华闻那馨香之气，就心里说："我不再因人的缘故咒诅地……地还存留的时候，稼穑、寒暑、冬夏、昼夜，就永不停息了。"\n\n然后——\n\n天空中出现了一道光。不是太阳，不是闪电。光被拆成了七种颜色，从天的这边弯曲到天的那边。\n\n神说："我把虹放在云彩中。这就可作我与地立约的记号了。"你抬头仰望。那是一张弓——但不是指向你的。是一张挂在墙上的弓。战争结束了。',
  choices: [
    { text: '俯伏敬拜，领受彩虹之约。', cons: '你领受了这约。不是因为挪亚配得——他后来也会醉酒赤身。但神的约不是建立在人的完美上，而是建立在他自己的信实上。虹还在天上，直到今日。每当你抬头看见，就记得：他说过，不再用洪水毁灭一切有血气的了。', verse: '创世记 9:13 — 我把虹放在云彩中。这就可作我与地立约的记号了。', next: 'conn_4' }
  ]
},

conn_4: {
  ch:0, chName:'', prog:0, effect:null,
  narrative:'', choices:[{ text:'',cons:'',verse:'',next:'s4_1' }], isConnection:true,
  fromCh:3, toCh:4,
  quote: '我把虹放在云彩中，这就可作我与地立约的记号了。',
  quoteRef: '创世记 9:13',
  narrator: '彩虹是记号——不是遮盖人心的记号。洪水洗去了地上的罪恶，却没有洗去人心里的弯曲。挪亚的后裔逐渐增多，但他们心里的倾向，与洪水之前并无两样。\n\n很快，在示拿地的一片平原上，人类将再次集结。这一次，他们不是用刀剑反叛神——而是用砖头和野心。"来吧，我们要建造一座城和一座塔，塔顶通天，为要传扬我们的名。"\n\n神的回应是什么？不是洪水，而是语言。\n\n那块应许的拼图——女人的后裔——还没有拼上。在分散的列国中，神会把目光聚焦在一个人的身上。',
  thread: '挪亚之约 · 人心仍是弯曲 · 巴别的分散',
  btnText: '进入第四章 · 通天塔'
},

s4_1: {
  ch:4, chName:'第四章 · 通天塔', prog:0.04, effect:'embers',
  narrative: '洪水之后，挪亚的三个儿子——闪、含、雅弗——生养众多，各随他们的宗族、方言，分开居住。\n\n天下人的口音、言语都是一样。\n\n他们在东边迁移的时候，在示拿地遇见一片平原，就住在那里。\n\n他们彼此商量说："来吧！我们要作砖，把砖烧透了。"他们就拿砖当石头，又拿石漆当灰泥。\n\n"来吧！我们要建造一座城和一座塔，塔顶通天——为要传扬我们的名，免得我们分散在全地上。"',
  choices: [
    { text: '看着他们烧砖建塔：这是人类第二次集体反叛。', cons: '伊甸园里，人想吃果子"如神能知道善恶"。巴别塔下，人想通天"为要传扬我们的名"。同一颗心，同一种罪——不要神，要自己。砖头代替石头，石漆代替灰泥。人造的材料，人造的塔，人造的荣耀。', verse: '创世记 11:4 — 来吧！我们要建造一座城和一座塔，塔顶通天，为要传扬我们的名。', next: 's4_2' },
    { text: '试图劝他们："神不是叫我们分散全地吗？"', cons: '你提出了质疑。但集体行动的快感压倒了个人的疑虑。人们正在享受"一同做大事"的兴奋。"传扬我们的名"——这句话听起来何其正当，何其励志。但它本质上是"不要神的名"。', verse: '创世记 9:1 — 神赐福给挪亚和他的儿子，对他们说：你们要生养众多，遍满了地。', next: 's4_2' }
  ]
},

s4_2: {
  ch:4, chName:'第四章 · 通天塔', prog:0.10, effect:'embers',
  narrative: '耶和华降临，要看看世人所建造的城和塔。\n\n这句话里藏着一个惊人的讽刺。人想要"塔顶通天"，但神需要"下来"才能看见——那座塔在神的眼里，渺小得像孩童的积木。\n\n耶和华说："看哪，他们成为一样的人民，都是一样的言语。如今既做起这事来——以后他们所要做的事，就没有不成就的了。"\n\n人类的合一，用在悖逆的方向上，是可怕的。但神没有用洪水——他用了一个更温柔、也更锋利的手段。',
  choices: [
    { text: '谦卑地站在神的角度看这座塔。', cons: '你从神的视角看见了人的可笑与可悲。人用尽心力建造的"丰碑"，在神面前不过是一堆砖。真正高大的不是塔，是人心里那想要取代神的骄傲。而骄傲，永远是跌倒的前奏。', verse: '创世记 11:5 — 耶和华降临，要看看世人所建造的城和塔。', next: 's4_3' },
    { text: '"主啊，为什么不直接摧毁这座塔？"', cons: '你问了一个真实的问题。神的回答不是摧毁，而是分散。他不屑于推倒砖头——砖头不是问题，人心才是。分散，是为了避免更大的集体悖逆。审判中仍有恩典：分开了才能再聚集。', verse: '箴言 16:18 — 骄傲在败坏以先；狂心在跌倒之前。', next: 's4_3' }
  ]
},

s4_3: {
  ch:4, chName:'第四章 · 通天塔', prog:0.16, effect:'embers',
  narrative: '"我们下去，在那里变乱他们的口音，使他们的言语彼此不通。"\n\n于是，耶和华使他们从那里分散在全地上。他们就停工不造那城了。\n\n这就是巴别——"变乱"的意思。\n\n一瞬间，工头的喊叫变成了无法理解的声音。邻座递来的砖被茫然地接过去。妻子听不懂丈夫的话，同伴变成了异乡人。人类引以为傲的统一语言，碎成了一地。\n\n他们不得不停止建造。他们不得不分散。不是因为天灾——而是因为彼此再也听不懂对方了。',
  choices: [
    { text: '看着人群四散：这是审判，也是怜悯。', cons: '分散是审判——神打碎了人的骄傲。分散也是怜悯——如果人类在悖逆中完全合一，后果将不可想象。神在审判中仍然保护了人类。从此，国族诞生了。语言丰富了。不同的文化如百花齐放。神的创造多样性，在分散中重新显现。', verse: '创世记 11:8-9 — 于是耶和华使他们从那里分散在全地上；他们就停工不造那城了。', next: 's4_4' }
  ]
},

s4_4: {
  ch:4, chName:'第四章 · 通天塔', prog:0.22, effect:null,
  narrative: '闪的后代记在下面。\n\n洪水以后二年，闪一百岁生了亚法撒……亚法撒生沙拉……沙拉生希伯……希伯生法勒……\n\n一串名字。一代接一代。十个世代从闪到他拉。\n\n他拉活到七十岁，生了亚伯兰、拿鹤、哈兰。\n\n他拉带着他儿子亚伯兰出了迦勒底的吾珥，要往迦南地去。他们走到哈兰，就住在那里。\n\n他拉死在哈兰。\n\n但神的目光，已经落在他那个名叫亚伯兰的儿子身上。',
  choices: [
    { text: '默想这个家谱：一串名字，神的信实。', cons: '从闪到亚伯兰——十个世代。每个人的名字背后，都是一段完整的人生。他们中间大多数人不为后世所记念。但他们生儿育女、活着、死去——而神的应许，在他们不知不觉中，继续往前奔跑。这是恩典在普通生活中的运作：平淡，却绝不中断。', verse: '创世记 11:27 — 他拉的后代记在下面。他拉生亚伯兰、拿鹤、哈兰；哈兰生罗得。', next: 'conn_5' }
  ]
},

conn_5: {
  ch:0, chName:'', prog:0, effect:null,
  narrative:'', choices:[{ text:'',cons:'',verse:'',next:'s5_1' }], isConnection:true,
  fromCh:4, toCh:5,
  quote: '你要离开本地、本族、父家，往我所要指示你的地去。',
  quoteRef: '创世记 12:1',
  narrator: '巴别之后，人类四分五裂。列国立起，语言分隔，各人各随己意而行。神的宏大叙事似乎让人喘不过气——从伊甸园到洪水，从洪水到巴别，每一次都是人的失败和神的审判。\n\n但在吾珥——一个异教之城的深处——神已经看中了一个人。不是因为他有多好，而是因为神自己拣选了他。\n\n从这一章开始，创世记的镜头从全人类猛然聚焦到一个家庭。亚伯拉罕之约，将成为整个救赎历史的基石。\n\n你还记得伊甸园里那句"女人的后裔要伤蛇的头"吗？现在，神要告诉世界：那个后裔，将通过这个人的血脉来到世上。',
  thread: '从全人类到一个人 · 亚伯拉罕之约开启 · 七个"我必"',
  btnText: '进入第五章 · 星空的应许'
},

s5_1: {
  ch:5, chName:'第五章 · 星空的应许', prog:0.28, effect:null,
  narrative: '耶和华对亚伯兰说——\n\n"你要离开本地、本族、父家，往我所要指示你的地去。"\n\n然后，七个"我必"像七颗星一样排开——\n\n我必叫你成为大国。\n我必赐福给你。\n叫你的名为大。\n你也要叫别人得福。\n为你祝福的，我必赐福与他。\n那咒诅你的，我必咒诅他。\n地上的万族，都要因你得福。\n\n没有地图。没有方向。没有详细计划。只有一句话——和一个应许。\n\n亚伯兰七十五岁。身后是全部的生活。前方是未知。',
  choices: [
    { text: '收拾帐篷和牲畜，天一亮就启程。', cons: '你没有问"往哪里去"。不是因为鲁莽——是因为说话的是一位你开始认识的神。信心的起头往往很简单：听见了，就去了。亚伯兰照着耶和华的吩咐去了。', verse: '创世记 12:4 — 亚伯兰就照着耶和华的吩咐去了。罗得也和他同去。亚伯兰出哈兰的时候年七十五岁。', next: 's5_2' },
    { text: '"主啊，往哪里去？请再多指引一些。"', cons: '你渴望更多细节。神知道你的性情——他没有发怒。但有时，神要的是一步一步的跟随，而不是一张全套地图。信心，就是不知道明天，却跟着知道明天的神往前走。你最终带上了行囊。', verse: '希伯来书 11:8 — 亚伯拉罕因着信，蒙召的时候就遵命出去，往将来要得为业的地方去。', next: 's5_2' }
  ]
},

s5_2: {
  ch:5, chName:'第五章 · 星空的应许', prog:0.36, effect:null,
  narrative: '你们穿过旷野，进入迦南地。示剑地方，摩利橡树那里——耶和华向亚伯兰显现，说："我要把这地赐给你的后裔。"亚伯兰就在那里为向他显现的耶和华筑了一座坛。\n\n但饥荒来了。那地遭遇饥荒，甚大。亚伯兰带着全家下埃及去。\n\n在埃及，他因惧怕，让妻子撒莱说自己是他的妹子。法老将撒莱带入宫中。若不是耶和华降大灾与法老和他的全家，后果不堪设想……\n\n你带着羞耻和满圈的牛羊离开埃及，重新回到伯特利——当初筑坛的地方。',
  choices: [
    { text: '回到伯特利的祭坛，重新筑坛求告耶和华的名。', cons: '失败之后回到原点——这需要谦卑。你没沉溺在羞耻中，而是回到曾经遇见神的地方。神没有提起埃及的事。他迎接了你。一个跌倒后重新归向神的人，比一个从未跌倒却骄傲自义的人更靠近神的心。', verse: '创世记 13:3-4 — 他…到了伯特利…就是从前支搭帐棚的地方，也是他起先筑坛的地方。他又在那里求告耶和华的名。', next: 's5_3' }
  ]
},

s5_3: {
  ch:5, chName:'第五章 · 星空的应许', prog:0.44, effect:null,
  narrative: '又有撒冷王麦基洗德带着饼和酒出来迎接——他是至高神的祭司。\n\n他为亚伯兰祝福说："愿天地的主、至高的神，赐福与亚伯兰。至高的神把敌人交在你手里，是应当称颂的。"\n\n亚伯兰就把所得的拿出十分之一来，给麦基洗德。\n\n这位神秘的祭司王——无父无母，无族谱，无生之始，无命之终——乃是神儿子的预表。他带着饼和酒来，像极了多年后另一个晚上的那一桌宴席。',
  choices: [
    { text: '接受麦基洗德的祝福，献上十分之一。', cons: '你领受了这位至高神祭司的祝福。饼和酒——那是君王宴席的记号。多年之后，另一位祭司，照着麦基洗德的等次，将用饼和酒设立新的约。此时你还不明白，但你低下了头。', verse: '希伯来书 7:1-3 — 这麦基洗德…他无父，无母，无族谱，无生之始，无命之终，乃是与神的儿子相似。', next: 's5_4' }
  ]
},

s5_4: {
  ch:5, chName:'第五章 · 星空的应许', prog:0.50, effect:null,
  narrative: '这事以后，耶和华在异象中有话对亚伯兰说——\n\n"亚伯兰，你不要惧怕！我是你的盾牌，必大大地赏赐你。"\n\n亚伯兰说："主耶和华啊，我既无子，你还赐我什么呢？……你没有给我儿子，那生在我家中的人就是我的后嗣。"\n\n耶和华领他到外边——\n\n"你向天观看，数算众星。能数得过来吗？"又对他说："你的后裔将要如此。"\n\n你抬起头。迦南的夜空没有城市的灯光。星星密密麻麻，像谁把一把钻石撒在了黑丝绒上。银河横亘天际。你老了。撒莱的生育已经断绝。\n\n但神指着这满天繁星说："将要如此。"',
  choices: [
    { text: '低下头说："我信。"', cons: '"亚伯兰信耶和华，耶和华就以此为他的义。"这是整本圣经中最惊人的一句话。不是完美的信心——之后他还会跌倒、还会怀疑。但在这一刻，他信了。而神就算他为义。不是因为行为，不是因为功劳，单单因为信心。这就是恩典之约的核心。', verse: '创世记 15:6 — 亚伯兰信耶和华，耶和华就以此为他的义。', next: 's5_5' }
  ]
},

s5_5: {
  ch:5, chName:'第五章 · 星空的应许', prog:0.58, effect:null,
  narrative: '耶和华又对他说——\n\n"我是耶和华，曾领你出了迦勒底的吾珥，为要将这地赐你为业。"\n\n亚伯兰说："主耶和华啊，我怎能知道必得这地为业呢？"\n\n神没有责备他。神说："你为我取一只三年的母牛，一只三年的母山羊，一只三年的公绵羊，一只斑鸠，一只雏鸽。"\n\n亚伯兰就把这些都劈开，分成两半，一半对着一半地摆列。日落的时候，有冒烟的炉和烧着的火把，从那些肉块中经过。\n\n神独自走过劈开的动物。他指着自己起誓——如果他不守约，愿他像这些动物一样被劈开。这是古代近东最严肃的立约仪式。但只有火把走过去——亚伯兰睡着了。是神单方面承担了圣约中所有的咒诅。',
  choices: [
    { text: '观看冒烟的炉和火把经过肉块：这是恩典之约的印记。', cons: '你亲眼目睹了神立约的方式。不是双方的合约——是神的单方面承诺。他不欠任何人，但他选择用自己来担保。多年之后，另一个人也将独自承担咒诅——在十字架上。而那一位，就是亚伯拉罕的后裔。', verse: '创世记 15:17-18 — 日落天黑，不料有冒烟的炉并烧着的火把从那些肉块中经过。当那日，耶和华与亚伯兰立约。', next: 's5_6' }
  ]
},

s5_6: {
  ch:5, chName:'第五章 · 星空的应许', prog:0.66, effect:null,
  narrative: '十年过去了。应许的儿子仍然没有来。\n\n撒莱对亚伯兰说："耶和华使我不能生育。求你和我的使女夏甲同房，或者我可以因她得孩子。"亚伯兰听从了撒莱的话。\n\n夏甲怀孕了。但矛盾也随之而来——夏甲小看她的主母，撒莱苦待夏甲，夏甲逃到旷野。\n\n以实玛利出生了。亚伯兰八十六岁。\n\n"帮神一把"的试探——用人的方法成就神的应许。但人的方案永远不会是神的计划。以实玛利被爱，被记念，也蒙了神的赐福——但他不是应许之子。',
  choices: [
    { text: '看见以实玛利出生，心中五味杂陈。', cons: '这个孩子是被爱着的。神在旷野找到了夏甲，给了她应许。以实玛利也将成为大国。但他不是应许之约的继承人。人的冲动和担忧，常常让我们做了神没有吩咐的事。而后果是真实的——这个家庭从此分裂。', verse: '创世记 16:11-12 — 耶和华的使者又对她说：你如今怀孕要生一个儿子，可以给他起名叫以实玛利……他为人必像野驴。', next: 's5_7' }
  ]
},

s5_7: {
  ch:5, chName:'第五章 · 星空的应许', prog:0.74, effect:null,
  narrative: '十三年又过去了。亚伯兰九十九岁。\n\n耶和华再次向他显现——\n\n"我是全能的神。你当在我面前作完全人。我就与你立约，使你的后裔极其繁多……从此以后，你的名不再叫亚伯兰，要叫亚伯拉罕，因为我已立你作多国的父。"\n\n撒莱也不再叫撒莱，要叫撒拉。\n\n"我必赐福给她，也要使你从她得一个儿子。我要赐福给她——她也要作多国之母，必有百姓的君王从她而出。"\n\n亚伯拉罕俯伏在地——笑了。心里说："一百岁的人还能得孩子吗？撒拉已经九十岁了，还能生养吗？"\n\n但他也说了："但愿以实玛利活在你面前。"',
  choices: [
    { text: '接受新名字和割礼之约。', cons: '亚伯兰（尊贵的父）变成了亚伯拉罕（多国的父）——在一个孩子都还没有的时候。名字是一个宣告：在神的口中，尚未发生的事已经成就了。"你要给他起名叫以撒"——以撒，就是"他笑了"的意思。', verse: '创世记 17:5 — 从此以后，你的名不再叫亚伯兰，要叫亚伯拉罕，因为我已立你作多国的父。', next: 's5_8' }
  ]
},

s5_8: {
  ch:5, chName:'第五章 · 星空的应许', prog:0.86, effect:'embers',
  narrative: '以撒出生了。应许之子终于来了。\n\n孩子渐渐长大。那一天，神试验亚伯拉罕。\n\n"你带着你的儿子，就是你独生的儿子，你所爱的以撒，往摩利亚地去，在我所要指示你的山上，把他献为燔祭。"\n\n没有解释。没有商量。\n\n亚伯拉罕清早起来，备上驴，带着两个仆人和他儿子以撒，也劈好了燔祭的柴，起身往神所指示的地方去了。\n\n走了三天。每一夜，亚伯拉罕都看着篝火旁的以撒。\n\n第三天。以撒背着柴，亚伯拉罕手里拿着火和刀。\n\n以撒说："父亲哪……请看，火与柴都有了，但燔祭的羊羔在哪里呢？"\n\n亚伯拉罕说："我儿，神必自己预备作燔祭的羊羔。"',
  choices: [
    { text: '沉默地观看：这是信心的顶点。', cons: '亚伯拉罕举起了刀。他的手没有颤抖——不是因为不痛，而是因为他相信："神还能叫人从死里复活。"就在那一刹那——"亚伯拉罕！亚伯拉罕！你不可在这童子身上下手！"他举目观看——不料，有一只公羊，两角扣在稠密的小树中。\n\n"耶和华以勒"——在耶和华的山上，必有预备。\n\n天父没有让他献出独生子。但天父自己——将献出他的独生子。', verse: '创世记 22:13-14 — 亚伯拉罕举目观看，不料，有一只公羊……亚伯拉罕给那地方起名叫耶和华以勒。', next: 'conn_6' }
  ]
},

conn_6: {

  thread: '耶和华以勒 · 应许传与以撒 · 后裔之线继续',

},

s6_1: {
  ch:6, chName:'第六章 · 应许之子', prog:0.10, effect:null,
  narrative: '亚伯拉罕年纪老迈。他叫来管理他全业最老的仆人——\n\n"请你把手放在我大腿底下。我要叫你指着耶和华天地的主起誓——不要为我儿子娶这迦南地中的女子为妻。你要往我本地本族去，为我的儿子以撒娶一个妻子。"\n\n仆人取了十匹骆驼，带着聘礼，往美索不达米亚去。到了拿鹤的城，天色将晚。他特意让骆驼跪在城外的水井旁。那里，众女子正出来打水。\n\n他祷告——不寻常的祷告——\n\n"耶和华我主人亚伯拉罕的神啊——我向哪一个女子说「请你拿下水瓶来给我水喝」，她若说「请喝，我也给你的骆驼喝」——愿那女子就作你所预定给你仆人以撒的妻。"',
  choices: [
    { text: '观察仆人的祷告：具体、大胆、信靠。', cons: '这个老仆人没有求一个"大概的"印证。他求了一个非常具体、极其耗费体力的印证——给十匹骆驼喝水。利百加真的来了。她真的说了那句话。她真的给所有骆驼打了水。祷告的每一个细节都应验了。神引导的道路，往往比我们想象的更加具体。', verse: '创世记 24:14 — 愿那女子就作你所预定给你仆人以撒的妻。这样，我便知道你施恩给我主人了。', next: 's6_2' }
  ]
},

s6_2: {
  ch:6, chName:'第六章 · 应许之子', prog:0.18, effect:null,
  narrative: '利百加跑回家，把一切告诉家人。哥哥拉班看见金环和金镯，眼睛亮了。\n\n仆人被迎进家门。他讲述了亚伯拉罕的神如何一路引导他来。"耶和华大大地赐福给我主人，使他昌大——又赐他一个儿子以撒。"\n\n第二天早晨，仆人说："请打发我回我主人那里去吧。"\n\n拉班和母亲说："让女子同我们再住几天——至少十天。"\n\n仆人说："耶和华既赐给我通达的道路，你们不要耽误我。"\n\n他们叫了利百加来，问她——\n\n"你和这人同去吗？"\n\n利百加说："我去。"',
  choices: [
    { text: '惊叹：一句"我去"，改变了历史。', cons: '"我去"——两个字。利百加没有见过以撒，没有去过迦南，不知道等待她的是什么。但她听见了神的引导，就回答了"我去"。信心有时就是两个字。这两个字，把她带入了应许之约的故事线。', verse: '创世记 24:58 — 就叫了利百加来问她说："你和这人同去吗？"利百加说："我去。"', next: 's6_3' }
  ]
},

s6_3: {
  ch:6, chName:'第六章 · 应许之子', prog:0.26, effect:null,
  narrative: '以撒娶了利百加，爱她。以撒自从他母亲不在了，这才得了安慰。\n\n但以撒四十岁结婚，利百加不生育。以撒为她祈求耶和华——耶和华应允他的祈求，利百加就怀了孕。\n\n孩子们在她腹中彼此相争。她去求问耶和华。耶和华说——\n\n"两国在你腹内，两族要从你身上出来。这族必强于那族，将来大的要服事小的。"\n\n以撒的一生，没有亚伯拉罕那样的戏剧性。他在非利士地挖井——一口，被抢走；再挖一口，又被抢走。他没有争，继续挖。直到挖到利河伯："耶和华现在给我们宽阔之地。"\n\n安静，但在应许中站稳。',
  choices: [
    { text: '观察以撒的平凡：安静的人同样被神使用。', cons: '以撒是创世记中篇幅最短的族长。他不是战士，不是冒险家。他挖井，牧羊，爱妻子，为不生育的妻子祷告。但应许通过他传递给了雅各和以扫。安静并非无用。平凡并非无意义。神的应许在洪水般的戏剧和涓涓细流中同样流淌。', verse: '创世记 26:22 — 他就给那井起名叫利河伯。他说："耶和华现在给我们宽阔之地，我们必在这地昌盛。"', next: 'conn_7' }
  ]
},

  ch:0, chName:'', prog:0, effect:null,
  narrative:'', choices:[{ text:'',cons:'',verse:'',next:'s7_1' }], isConnection:true,

  narrator: '以撒是安静的一代——但安静不等于没有风暴。他的两个儿子，在母腹中就开始了争斗。以扫善于打猎，常在田野；雅各为人安静，常住在帐棚里。\n\n这两个人将演绎创世记中最令人心碎也最充满恩典的故事。一个用一碗红豆汤出卖长子名分；一个用诡计骗取祝福。欺骗的父亲，偏心的母亲，争夺的儿子——这个家庭有圣经中所有家庭问题的模板。\n\n但神拣选了雅各——不是因为雅各好，而是因为神的恩典。而这个诡诈者，将一步一步被神塑造成以色列。\n\n你还记得亚伯拉罕之约吗？现在，这约传给雅各了。',
  thread: '以撒 → 雅各 · 神的拣选 · 诡诈者被塑造',
  btnText: '进入第七章 · 与神摔跤的人'
},

s7_1: {
  ch:7, chName:'第七章 · 与神摔跤的人', prog:0.12, effect:null,
  narrative: '以撒年老，眼睛昏花。他叫以扫去打猎，做美味给他吃——好在未死之先给他祝福。\n\n利百加听见了。她叫来雅各："我儿，你要听我的话——去羊群里拿两只肥山羊羔来，我便照你父亲所爱的做成美味。你拿到父亲那里给他吃，使他在未死之先给你祝福。"\n\n雅各说："以扫浑身是有毛的，我身上是光滑的。倘若父亲摸着我，必以我为欺哄人的。我就招咒诅，不得祝福。"\n\n利百加说："我儿，你招的咒诅归到我身上。"\n\n雅各去了。山羊皮裹在手上和颈上。他端着美味走进父亲的帐篷。\n\n"我儿，你是谁？"',
  choices: [
    { text: '"……我是以扫。"——雅各说了那个谎。', cons: '一个谎言需要另一个谎言来遮盖。雅各说了谎，得了祝福。但祝福从来不能靠谎言夺取——神给亚伯拉罕的应许，不需要人的诡诈来成全。雅各赢了祝福，却失去了家庭——他将逃亡异乡二十年。', verse: '创世记 27:19 — 雅各对他父亲说："我是你的长子以扫。"', next: 's7_2' },
    { text: '在帐棚外沉默地观看这场骗局。', cons: '你看着这个家庭里的欺骗层层叠加：以撒偏袒以扫，利百加偏袒雅各，雅各欺骗父亲，以扫怨恨弟弟。罪的模式从伊甸园到如今从未改变——它首先破坏的，总是人与人之间最亲密的关系。', verse: '创世记 27:41 — 以扫因他父亲给雅各祝的福，就怨恨雅各。', next: 's7_2' }
  ]
},

s7_2: {
  ch:7, chName:'第七章 · 与神摔跤的人', prog:0.24, effect:null,
  narrative: '雅各逃亡。\n\n他独自走在旷野，以石为枕，在伯特利躺下睡了。\n\n梦见一个梯子立在地上，梯子的头顶着天——有神的使者在梯子上，上去下来。耶和华站在梯子以上，说——\n\n"我是耶和华你祖亚伯拉罕的神，也是以撒的神。我要将你现在所躺卧之地赐给你和你的后裔……地上万族必因你和你的后裔得福。我也与你同在。你无论往哪里去，我必保佑你，领你归回这地——总不离弃你，直到我成全了向你所应许的。"\n\n雅各醒了——\n\n"耶和华真在这里，我竟不知道。"',
  choices: [
    { text: '与雅各一同惊叹："耶和华真在这里——我竟不知道。"', cons: '这个逃亡者、说谎者、欺骗父亲的人——躺在石头上，竟然看见了天开了。恩典从来不是给配得的人的。雅各还什么都不是，神就向他重申了亚伯拉罕之约。天梯——连接天与地——那是多年之后基督所说的："你们将要看见天开了，神的使者上去下来在人子身上。"', verse: '创世记 28:16 — 雅各睡醒了，说："耶和华真在这里，我竟不知道。"\n约翰福音 1:51 — 你们将要看见天开了，神的使者上去下来在人子身上。', next: 's7_3' }
  ]
},

s7_3: {
  ch:7, chName:'第七章 · 与神摔跤的人', prog:0.36, effect:null,
  narrative: '雅各到了拉班家。看见拉结——一见倾心。\n\n"我愿为你小女儿拉结服事你七年。"\n\n七年。圣经说"他因为深爱拉结，就看这七年如同几天。"\n\n但新婚之夜——帐幕里被送进来的不是拉结，是利亚。\n\n雅各被骗了。当年用山羊皮欺骗父亲的人，被岳父用面纱欺骗。\n\n"你向我做的是什么事呢？我服事你，不是为拉结吗？你为什么欺哄我呢？"\n\n拉班说："大女儿还没有给人，先把小女儿给人——我们这地方没有这规矩。"\n\n雅各又服事了七年。二十年。在巴旦亚兰的二十年，雅各得了四个妻子、十一个儿子。但每一日都是劳苦——白日受尽干热，黑夜受尽寒霜。',
  choices: [
    { text: '看见雅各被欺骗：神在管教他所爱的人。', cons: '雅各欺骗父亲，现在被岳父欺骗。不是神在报复——是神在使用生活的难处塑造他的品格。诡诈者必须学会：信任不是算计出来的。这二十年的劳苦，将被神用来预备他——因为不久之后，他要面对一个更大的摔跤。', verse: '创世记 29:25 — 到了早晨，雅各一看是利亚，就对拉班说："你向我做的是什么事呢？"', next: 's7_4' }
  ]
},

s7_4: {
  ch:7, chName:'第七章 · 与神摔跤的人', prog:0.50, effect:'embers',
  narrative: '二十年了。雅各带着妻子、儿女、羊群、牛群，离开了拉班。他要回迦南——回到应许之地。\n\n但前面等着的是以扫——那个被他欺骗、誓言要杀他的哥哥。带着四百人正迎着他来。\n\n雅各在雅博渡口。他把所有的人都送过了河。只剩下他一个人。\n\n黑暗的夜里——\n\n有一个人来和他摔跤，直到黎明。\n\n摔跤。不是言语的辩论，是身体的角力。尘土、汗水、喘息——一整夜。那人见自己胜不过他，就将他的大腿窝摸了一把。雅各的大腿窝正在摔跤的时候就扭了。\n\n那人说："天黎明了，容我去吧。"\n\n雅各说——\n\n"你不给我祝福，我就不容你去。"',
  choices: [
    { text: '在黑暗中观看这场神圣的摔跤。', cons: '雅各一生都在抓——抓哥哥的脚跟，抓长子的名分，抓父亲的祝福，抓拉结的爱。现在，他抓的是神——"你不给我祝福，我就不容你去。"他不再是那个算计的骗徒。他是一个瘸腿的祈求者——抓住应许不放。\n\n那人说："你的名不要再叫雅各，要叫以色列——因为你与神与人较力，都得了胜。"\n\n雅各便给那地方起名叫毗努伊勒——意思说："我面对面见了神，我的性命仍得保全。"', verse: '创世记 32:28 — 那人说："你的名不要再叫雅各，要叫以色列；因为你与神与人较力，都得了胜。"', next: 's7_5' }
  ]
},

s7_5: {
  ch:7, chName:'第七章 · 与神摔跤的人', prog:0.64, effect:null,
  narrative: '日头刚出来的时候，雅各经过毗努伊勒——他的大腿就瘸了。\n\n雅各举目观看，见以扫来了，后头跟着四百人。\n\n他就一连七次俯伏在地，才就近他哥哥。\n\n以扫跑来迎接他——将他抱住。又搂着他的颈项，与他亲嘴。两个人就哭了。\n\n没有刀剑。没有复仇。兄弟和解。\n\n雅各说："我见了你的面，如同见了神的面，并且你容纳了我。"\n\n他刚刚在毗努伊勒见了神的面——现在，神的面容竟然在他哥哥的脸上找到了。恩典不是只在天梯上——恩典也在兄弟和解的眼泪里。',

  ]
},

s8_1: {
  ch:8, chName:'第八章 · 坑与宝座', prog:0.08, effect:null,
  narrative: '雅各（以色列）住在迦南地。约瑟十七岁——是他父亲年老时生的，也是他最爱之妻拉结所生的。雅各给他做了一件彩衣。\n\n约瑟的哥哥们看见父亲爱约瑟过于爱他们，就恨约瑟。\n\n约瑟做了两个梦。\n\n"我们在田里捆禾稼——我的捆起来站着，你们的捆来围着我的捆下拜。"\n\n"太阳、月亮与十一个星向我下拜。"\n\n哥哥们都嫉妒他——连父亲也责备他："你做的这是什么梦！难道我和你母亲、你弟兄果然要来俯伏在地，向你下拜吗？"\n\n一日，哥哥们去示剑放羊。雅各打发约瑟去看他们平安不平安。约瑟去了。\n\n哥哥们远远看见他——\n\n"你看，那做梦的来了。"',
  choices: [
    { text: '看着约瑟穿着彩衣走来——他还不知道等待他的是什么。', cons: '约瑟不完美。他或许不该把梦讲出来。他的天真惹动了哥哥们的嫉恨。但神使用不完美的器皿，成就他完美的计划。那件彩衣——父亲的偏爱——将成为他苦难的起点。但也是神暗中引导的开始。', verse: '创世记 37:19 — 彼此说："你看，那做梦的来了。"', next: 's8_2' }
  ]
},

s8_2: {
  ch:8, chName:'第八章 · 坑与宝座', prog:0.18, effect:null,
  narrative: '"来吧！我们将他杀了，丢在一个坑里。就说有恶兽把他吃了——我们且看他的梦将来怎么样。"\n\n流便听见了，要救他脱离他们的手，说："我们不可害他的性命。不可流他的血——可以把他丢在这野地的坑里。"\n\n他们剥了约瑟的彩衣。把他丢在坑里——那坑是空的，里头没有水。\n\n他们坐下吃饭。\n\n就在不远处，他们的弟弟在枯井里，不知道是死是活。他们吃饭。\n\n有一伙米甸的以实玛利人从基列来。犹大说："我们杀我们的兄弟，藏了他的血有什么益处呢？不如将他卖给以实玛利人。"\n\n弟兄们听从了他。\n\n约瑟被从坑里拉上来。二十舍客勒银子。这就是一个弟弟的价钱。',
  choices: [
    { text: '在坑边沉默地看着：二十舍客勒。', cons: '二十舍客勒银子——一个奴隶的价钱。约瑟被自己亲兄弟用这个价钱卖了。彩衣被撕碎、浸了羊血、送到父亲面前。雅各撕裂衣服——"我必悲哀着下阴间到我儿子那里。"\n\n但约瑟在坑里抬头望天时——他看不见。看不见很多年后这所有的碎片将被拼成一幅画。而那幅画的名字，叫"神的意思原是好的"。', verse: '创世记 37:28 — 就把约瑟从坑里拉上来，讲定二十舍客勒银子，把约瑟卖给以实玛利人。', next: 's8_3' }
  ]
},

s8_3: {
  ch:8, chName:'第八章 · 坑与宝座', prog:0.30, effect:null,
  narrative: '约瑟被带到埃及，卖给了法老的内臣——护卫长波提乏。\n\n耶和华与约瑟同在，他就百事顺利。他主人见耶和华与他同在，就派他管理家务，把一切所有的都交在他手里。\n\n但波提乏的妻子日日以目送情给约瑟，说："你与我同寝吧。"\n\n约瑟不从——\n\n"我怎能作这大恶——得罪神呢？"\n\n有一天，约瑟进屋里去办事，家中没有一个人在那屋里。妇人拉住他的衣裳——\n\n"你与我同寝吧。"\n\n约瑟把衣裳丢在妇人手里，跑到外边去了。',
  choices: [
    { text: '为约瑟的逃跑喝彩——但也心疼他为此付出的代价。', cons: '约瑟逃跑了。不是因为他没有欲望——而是因为他更怕得罪神。这句话——"我怎能作这大恶，得罪神呢？"——是他所有选择背后的锚。\n\n但妇人的谎言把他送进了监牢。清白的人进了监狱。但"耶和华与约瑟同在"——这句话不会因为他进了监牢就改变。神在坑里，神在波提乏家，神也在监牢里。', verse: '创世记 39:9 — 在这家里没有比我大的……我怎能作这大恶，得罪神呢？', next: 's8_4' }
  ]
},

s8_4: {
  ch:8, chName:'第八章 · 坑与宝座', prog:0.44, effect:null,
  narrative: '约瑟在监牢里。\n\n但耶和华与约瑟同在，向他施恩——使他在司狱的眼前蒙恩。司狱把监里所有的囚犯都交在约瑟手下。\n\n同被囚的有法老的酒政和膳长。二人同夜各做一梦。\n\n早晨，约瑟看见他们愁闷的样子——\n\n"解梦不是出于神吗？请你们将梦告诉我。"\n\n他为酒政解了梦，三天之内官复原职。也为膳长解了梦，三天之内被挂起来。\n\n"但你得好处的时候，求你记念我。"\n\n酒政出狱了。官复原职了。\n\n他忘了约瑟。\n\n整整两年。',
  choices: [
    { text: '与约瑟一起等待——两年，无人记念。', cons: '两年的沉默。两年在铁窗后面，日复一日看着同样的墙壁。约瑟解梦时说"解梦不是出于神吗"——他信神，但神似乎沉默。\n\n但沉默不是缺席。神在等候时机。因为法老就要做梦了——那是全埃及没有人能解的梦。而那个梦，将是约瑟从囚衣到细麻衣的转折点。', verse: '创世记 40:23 — 酒政却不记念约瑟，竟忘了他。', next: 's8_5' }
  ]
},

s8_5: {
  ch:8, chName:'第八章 · 坑与宝座', prog:0.58, effect:null,
  narrative: '过了两年。法老做梦——\n\n七只肥母牛从河里上来，七只瘦母牛把它们吞了。七枝饱满的穗子，被七枝枯槁的穗子吞了。\n\n全埃及的术士和博士，无一人能解。\n\n酒政突然想起来了。\n\n"我今日想起我的罪来。"\n\n约瑟被提出监牢。剃头，刮脸，换衣裳，进到法老面前。\n\n法老说："我听说你听了梦就能解。"\n\n约瑟说——\n\n"这不在乎我。神必将平安的话回答法老。"',

  narrative: '约瑟为法老解梦——七个丰年，随后七个荒年。"所以法老当拣选一个有聪明有智慧的人，派他治理埃及地……聚敛七个丰年一切的粮食。"\n\n法老对臣仆说："像这样的人，有神的灵在他里头，我们岂能找得着呢？"\n\n法老就摘下手上打印的戒指，戴在约瑟手上。给他穿上细麻衣，把金链戴在他颈项上。\n\n"在埃及全地，若没有你的命令，不许人擅自办事。"\n\n法老赐名——撒发那忒巴内亚。又将安城的祭司波提非拉的女儿亚西纳给他为妻。\n\n从囚衣——到细麻衣。从坑——到宝座。\n\n三十年。',

  ]

s8_7: {
  ch:8, chName:'第八章 · 坑与宝座', prog:0.86, effect:null,
  narrative: '饥荒遍布天下。雅各打发十个儿子去埃及籴粮。\n\n约瑟的哥哥们来了——脸伏于地，向他下拜。\n\n他认得他们。他们不认得他。\n\n那个梦——禾捆下拜的梦——应验了。但约瑟没有立刻相认。他试验他们，要看他们的心是否已经改变。\n\n第二次来的时候，犹大站出来了——为了便雅悯，他愿意代替为奴。\n\n约瑟再也忍不住了。\n\n"我是约瑟！我的父亲还在吗？"\n\n弟兄们惊惶，不能回答。\n\n"请你们近前来……我是你们的兄弟约瑟，就是你们所卖到埃及的。"\n\n"现在，不要因为把我卖到这里自忧自恨——这是神差我在你们以先来——为要保全生命。"',
  choices: [
    { text: '流泪看着这一幕：约瑟哭了。弟兄们也哭了。', cons: '"神差我在你们以先来"——这句话翻转了一切。不是哥哥们卖了他，是神差了他。不是灾难，是预备。不是终结，是起头。从人的角度看，是一连串的不公；从神的角度看，是一连串的护理。约瑟看见了——这就是他能够饶恕的原因。', verse: '创世记 45:5 — 现在，不要因为把我卖到这里自忧自恨。这是神差我在你们以先来，为要保全生命。', next: 's8_8' }
  ]
},

s8_8: {
  ch:8, chName:'第八章 · 坑与宝座', prog:0.92, effect:null,
  narrative: '约瑟与弟兄们相认之后，法老听见这事就说——\n\n"你们要赶紧上你们父亲那里去。将你们的父亲和你们的眷属都搬到我这里来——我要把埃及地的美物赐给你们。"\n\n于是约瑟照着法老的命令给他们车辆和路上用的粮食。又给他们各人一套衣服——唯独给便雅悯三百银子、五套衣服。\n\n他们也赶着车辆和约瑟送的粮食、牲畜，回迦南地去。\n\n到了迦南地，他们告诉雅各——\n\n"约瑟还在！并且作埃及全地的宰相。"\n\n雅各心里冰凉，因为不信他们。但他们将约瑟对他们说的一切话都告诉了他。雅各看见约瑟打发来接他的车辆——\n\n"罢了！罢了！我的儿子约瑟还在。趁我未死以先，我要去见他一面。"',
  choices: [
    { text: '看着雅各——心从冰凉到火热："罢了！罢了！"', cons: '雅各已经哀哭了多年。现在，一个不可能的喜讯——死人复活一般的消息——临到了他。从冰凉到火热，从不信到"罢了罢了"。以色列全家都将在埃及得保全。应许从个人扩展到了七十人的家族。神的计划，比任何人想象的都要大。', verse: '创世记 45:27-28 — 他们便将约瑟对他们说的一切话都告诉了他。他父亲雅各又看见约瑟打发来接他的车辆，心就苏醒了。', next: 'conn_9' }
  ]
},

conn_9: {

s9_1: {
  ch:9, chName:'第九章 · 末了的话', prog:0.08, effect:null,
  narrative: '以色列带着一切所有的，起身来到别是巴，就献祭给他父亲以撒的神。\n\n夜间，神在异象中对以色列说——\n\n"雅各！雅各！"\n\n他说："我在这里。"\n\n神说："我是神，就是你父亲的神。你下埃及去不要害怕——因为我必使你在那里成为大族。我要和你同下埃及去，也必定带你上来。约瑟必给你送终。"\n\n雅各带着全家——共六十六人，加上约瑟和他两个儿子，共七十人——下埃及去了。\n\n从亚伯拉罕一人到七十人。应许正在扩展。',
  choices: [
    { text: '听见神对雅各说"我必使你在那里成为大族"——默想这个应许。', cons: '七十年后，这七十人将成为数百万。神在埃及的黑暗中预备了一个民族。正如种子在土里腐烂才能生长，以色列也必须在埃及的熔炉中被锻造。应许的实现方式，往往是我们想不到的。但那位说"我必"的神，从不失信。', verse: '创世记 46:3-4 — 神说："我是神，就是你父亲的神。你下埃及去不要害怕，因为我必使你在那里成为大族。"', next: 's9_2' }
  ]
},

s9_2: {
  ch:9, chName:'第九章 · 末了的话', prog:0.20, effect:null,
  narrative: '约瑟领父亲雅各进到法老面前。雅各就给法老祝福。\n\n法老问雅各说："你平生的年日是多少呢？"\n\n雅各对法老说——\n\n"我寄居在世的年日是一百三十岁。我平生的年日又少又苦，不及我列祖在世寄居的年日。"\n\n又少又苦。\n\n这是他对自己一生的总结。逃亡、欺骗、劳苦、失去约瑟、饥荒——又少又苦。\n\n但他仍然站在法老面前——祝福法老。一位寄居的牧羊人，祝福全地最强大的君王。应许中的那句话——"地上的万族都要因你得福"——正在应验。',
  choices: [
    { text: '品味雅各这句话："又少又苦。"但也看见他仍然祝福。', cons: '"又少又苦"是真实的感受。但"就给法老祝福"也是真实的信心。雅各学会了——不是从幸福中学的，是从苦难中学的。一个被神摔跤过的人，瘸着腿，却能祝福君王。这就是以色列——与神与人较力都得了胜。', verse: '创世记 47:9 — 雅各对法老说："我寄居在世的年日是一百三十岁。我平生的年日又少又苦。"', next: 's9_3' }
  ]
},

s9_3: {
  ch:9, chName:'第九章 · 末了的话', prog:0.32, effect:null,
  narrative: '约瑟得知父亲病了，就带着两个儿子——玛拿西和以法莲——同去。\n\n以色列勉强在床上坐起来。\n\n"我未到埃及见你之先，你在埃及地所生的以法莲和玛拿西，这两个儿子是我的。正如流便和西缅是我的一样。"\n\n约瑟把两个儿子领到父亲面前——玛拿西对着以色列的右手，以法莲对着左手。\n\n但以色列伸出右手来，按在次子以法莲的头上——又剪搭过左手来，按在长子玛拿西的头上。\n\n约瑟说："我父，不是这样。这本是长子，求你把右手按在他的头上。"\n\n以色列不从。"我知道，我儿，我知道。他也必成为一族，也必昌大——只是他的兄弟将来比他还大。"',
  choices: [
    { text: '观看这奇妙的一幕：神的拣选再一次颠覆了人的秩序。', cons: '以撒不是长子——以实玛利是。雅各不是长子——以扫是。现在以法莲不是长子——玛拿西是。但神的祝福落在"次子"身上。这不是偶然——这是模式。神的拣选不按人的规则。恩典从来不是人配得的，否则就不是恩典了。', verse: '创世记 48:19 — 他父亲不从，说："我知道，我儿，我知道。他也必成为一族，也必昌大。只是他的兄弟将来比他还大。"', next: 's9_4' }
  ]
},

s9_4: {
  ch:9, chName:'第九章 · 末了的话', prog:0.48, effect:null,
  narrative: '雅各叫了他的儿子们来——\n\n"你们都来聚集，我好把你们日后必遇的事告诉你们。"\n\n十二个儿子，十二个祝福。十二支派的故事从这一刻开始。\n\n但祝福的焦点，停在了犹大身上——\n\n"犹大啊，你弟兄们必赞美你。你手必掐住仇敌的颈项。你父亲的儿子们必向你下拜。\n\n犹大是个小狮子。我儿啊，你抓了食便上去。你屈下身去，卧如公狮，蹲如母狮——谁敢惹你？\n\n圭必不离犹大，杖必不离他两脚之间——直等细罗来到，万民都必归顺。"',
  choices: [
    { text: '全神贯注地听这段祝福：这是创世记中最高的预言。', cons: '"直等细罗来到"——细罗，就是"赐平安者"，就是弥赛亚。从创世记3:15——"女人的后裔要伤蛇的头"——到创世记49:10——"直等细罗来到"——这条金色的线终于被命名为王。犹大的狮子。万民的细罗。大卫的子孙。耶稣基督。\n\n创世记用了四十九章，把聚光灯打在了犹大的后裔身上。接下来的整本旧约，都在等候"细罗来到"。', verse: '创世记 49:10 — 圭必不离犹大，杖必不离他两脚之间，直等细罗来到，万民都必归顺。', next: 's9_5' }
  ]
},

s9_5: {
  ch:9, chName:'第九章 · 末了的话', prog:0.68, effect:null,
  narrative: '雅各嘱咐众子已毕——就把脚收在床上，气绝而死，归他列祖那里去了。\n\n约瑟伏在他父亲的面上哀哭，与他亲嘴。\n\n埃及人为雅各哀哭了七十天。约瑟带着极多的随从、车辆和马兵，将雅各归葬在迦南地麦比拉洞里——那是亚伯拉罕和撒拉、以撒和利百加安葬之地。\n\n回到埃及后——\n\n约瑟的哥哥们害怕了。"或者约瑟怀恨我们，照着我们从前待他一切的恶足足地报复我们。"\n\n他们打发人去见约瑟说："你父亲未死以先吩咐说——你们要对约瑟这样说：从前你哥哥们恶待你，求你饶恕他们的过犯和罪恶。"\n\n约瑟哭了。\n\n他们又来俯伏在他面前。',
  choices: [

  ]

s9_6: {
  ch:9, chName:'第九章 · 末了的话', prog:0.88, effect:null,
  narrative: '约瑟和他父亲的眷属都住在埃及。约瑟活了一百一十岁。\n\n约瑟对他弟兄们说——\n\n"我要死了。但神必定看顾你们——领你们从这地上去，到他起誓所应许给亚伯拉罕、以撒、雅各之地。"\n\n约瑟叫以色列的子孙起誓说——\n\n"神必定看顾你们。你们要把我的骸骨从这里搬上去。"\n\n约瑟死了，正一百一十岁。人用香料将他薰了，把他收殓在棺材里——停在埃及。\n\n创世记在这里结束。\n\n不是结束在应许之地的美酒欢歌——而是结束在埃及的一具棺木里。',

  narrative: '约瑟和他那一代人都死了。\n\n"以色列"在希伯来文的意思是"神的君王"——但此刻，他的子孙在泥砖坑里弯着腰，脊背上的鞭痕叠着鞭痕。\n\n以色列人在埃及生养众多，极其强盛，遍满了那地。他们比埃及人还多、还强盛——这是个荒唐的反讽：被奴役的人比奴隶主还要兴旺。\n\n有一位新王起来治理埃及。他不认识约瑟。注意：对世人贡献再大、服事再多，死后往往也不被记念。\n\n"看哪，这以色列民比我们还多、还强盛。"法老眯起眼。"来吧，我们要用巧计待他们。"\n\n于是埃及人派督工辖制以色列人，用苦工压榨他们。为法老建造两座积货城——比东和兰塞。1883年，考古学家在东方要塞的碑铭上读到了比东的名字。那些泥砖——下层满是好草，中层只剩梗株，上层完全没有草。出埃及记的每一个字都是真的。\n\n但越是苦待他们，他们越发蔓延。埃及人因以色列人愁烦。\n\n在重压下成长——法老不明白这个奥秘。',

  narrative: '法老的命令越来越残酷。\n\n他对希伯来的收生婆施弗拉和普阿说："你们为希伯来妇人收生的时候，若是男孩，就把他杀了；若是女孩，留她存活。"\n\n这是釜底抽薪——杀掉一切男婴，从根源上消灭这个民族。\n\n但收生婆敬畏神。\n\n她们没有照法老的命令做。\n\n法老召她们来质问。你藏在泥砖窑的阴影里，听到了她们的对话。',
  choices: [
    { text: '竖起耳朵，听收生婆如何回答。', cons: '"希伯来妇人与埃及妇人不同。她们健壮，收生婆还没有到，她们就已经生产了。"\n\n你听到收生婆平静的回答。她们在说谎——但你心中涌起一股热流。她们敬畏神，胜过敬畏法老。施弗拉——"美丽、光明"；普阿——"光辉、耀眼"。圣经刻意记下这两个普通女人的名字，却刻意不提那个最有权力法老的名字。敬畏神的小人物在神眼中是有名字的。神厚待收生婆——叫她们成立家室。她们冒死存留的男婴中，有一个将要终结这个法老的王朝。注意：凡心里惧怕神的，都不会因惧怕人而陷入网罗。', verse: '出埃及记 1:17 — 但是收生婆敬畏神，不照埃及王的吩咐行，竟存留男孩的性命。', next: 's1_3' },
    { text: '法老为什么不干脆杀了这两个不顺从的女人？', cons: '你盯着法老的脸色——他居然放过了施弗拉和普阿。这个杀死无数婴孩的命令，因为没有"执行者"，落空了。\n\n法老是当时世界上最有权势的人——但他需要两个希伯来接生婆替他执行命令。没有她们的配合，整个屠杀计划就是一句话。神用一个法老自己无法弥补的漏洞，化解了灭族的危机。\n\n你以为反抗邪恶需要千军万马——有时候只需要两个敬畏神的女人，在关键时刻说一句智慧的谎话。不是"大人物"才能被神使用。施弗拉和普阿——圣经记下了名字。法老呢？名字至今有争议。这就是神国度的法则：谁敬畏神，谁就留在神的册上。' , next: 's1_3'}
  ]
},

s1_3: {
  ch:1, chName:'第一章 · 埃及为奴', prog:0.10, effect:'ripple',
  narrative: '法老下了一道终极命令——\n\n"以色列人所生的男孩，你们都要丢在尼罗河里。"\n\n尼罗河——埃及人拜它为神。他们把婴孩当作献给河神和鳄鱼神的"上好祭物"。他们欢欢喜喜地把以色列男孩丢进河里。同一片水，是埃及的生命之源，也是希伯来母亲的眼泪之海。\n\n尼罗河畔，你看见一位利未族的妇人，抱着一个男婴。她的丈夫站在一旁，面色凝重。这孩子生得俊美异常。她已经藏了他三个月，再也藏不住了。\n\n她走向尼罗河。\n\n但没有把孩子丢进去——她取了一个蒲草箱，抹上石漆和石油，将孩子放在里头，把箱子搁在河边的芦荻中。\n\n"蒲草箱"——希伯来文是tevah。你知道这个词上一次出现在圣经里是什么地方吗？挪亚方舟。同一个词。这个小方舟里躺着的，不是一个要被淹死的婴儿——是神在水上的拯救。\n\n孩子的姐姐远远站着，要知道他究竟怎么样。\n\n尼罗河的水流轻轻推动蒲草箱。远处，法老的宫殿在阳光下闪闪发光。',
  choices: [
    { text: '远远观望着那小小的蒲草箱。', cons: '水面泛起微光。你不知道那里面躺着的，是一个将要撕裂整个埃及权力的孩子。此刻他只是一个在蒲草箱里哭泣的婴儿。但神的安排远超人的计算——法老的女儿来河边洗澡，看见了箱子。打开后，孩子哭了。从未有过婴孩的哭声来得如此及时，如此动听。这哭声打动了公主的恻隐之心。"这是希伯来人的一个孩子。"她收养了他，给他起名叫摩西——"因我把他从水里拉出来。"法老女儿的父亲是阿赫摩斯一世，名字的意思是"月神之子"。法老自视为神之子——但真正被神使用的，是一个从水里被拉出来的希伯来婴儿。\n\n"摩西"在埃及语里是"儿子"。一个被法老追杀的民族，"儿子"却坐在法老的王宫里长大——就在下令杀婴的那位法老女儿的膝上。这是只有神才能写出来的剧本。', verse: '出埃及记 2:3 — 后来不能再藏，就取了一个蒲草箱，抹上石漆和石油，将孩子放在里头，把箱子搁在河边的芦荻中。', next: 'conn_1_2' },
    { text: '跑到河边——看看那个箱子怎么样了。', cons: '你穿过芦荻跑过去。不能太近——但你想看清楚那个小小的蒲草箱。\n\ntevah——这个希伯来词，整本圣经只出现在两个地方：挪亚方舟，和这个蒲草箱子。挪亚的方舟在洪水上漂流，救了一家八口。这个蒲草箱子在尼罗河上漂流，救了一个将要拯救全民族的婴儿。\n\n你停下脚步——法老的女儿已经发现了箱子。她打开，婴孩哭了。这哭声在历史中回响——后来摩西在诗篇九十篇写道："我们一生的年日是七十岁……其中所矜夸的不过是劳苦愁烦。"这个在法老宫中长大的孩子，最终写出比埃及金字塔更永恒的诗篇。但这个时刻，他只是一个小小的——从水里被拉出来的。' , next: 'conn_1_2'}
  ]
},

  quote: '摩西学了埃及人一切的学问，说话行事都有才能。', quoteRef:'使徒行传 7:22',

s2_1: {
  ch:2, chName:'第二章 · 摩西蒙召', prog:0.12, effect:null,
  narrative: '摩西长大了。\n\n他出去看自己的弟兄，见他们担着重担，又见一个埃及人打他的希伯来弟兄。\n\n他左右观看，见没有人，就把那埃及人打死，藏在沙土里。\n\n第二天他出去，见两个希伯来人争斗，就对那欺负人的说："你为什么打你同族的人？"\n\n那人反问道："谁立你作我们的首领和审判官？难道你要杀我，像杀那埃及人一样吗？"\n\n摩西恐惧战兢——这事被人知道了。他的同胞拒绝了他。\n\n法老听见这事，就想杀摩西。\n\n摩西逃走了。逃离了他长大的王宫，逃离了那两座他自己亲手督建的积货城。逃到了米甸的旷野。\n\n摩西的人生分为三个四十年。第一个四十年："我能"——埃及王子，学了埃及一切学问，说话行事都有才能。第二个四十年："我不能"——米甸牧羊，默默无闻。第三个四十年："神能"。\n\n他正进入第二个四十年。',
  choices: [
    { text: '与他一同逃入旷野。', cons: '旷野的风干燥而锐利。摩西从一个埃及王子变成了一个流亡者。他坐在井旁，不知道前路是什么。注意：他前不久还在法老的宫中享福，现在却到了米甸的旷野。神由此试炼摩西的信心。他坐在井旁，身体疲倦，心中迷茫。西坡拉——米甸祭司的女儿——来打水，被别的牧羊人欺负。摩西起来帮助她，随后被叶忒罗收留，娶了西坡拉为妻。摩西在旷野牧羊四十年。四十年——他以为自己的一生就这样过去了。但神没有忘记他。神没有忘记他的百姓。埃及的生活经历预备他在以色列中作王，米甸的生活经历则预备他在何烈山与神相通。', verse: '出埃及记 2:15 — 法老听见这事，就想杀摩西，但摩西躲避法老，逃往米甸地居住。', next: 's2_2' },
    { text: '摩西凭自己的力气和知识去救——失败了。为什么？', cons: '你跟着摩西跑出埃及的边境，回头望了一眼。那座他住了四十年的王宫，现在只剩下远处的一个亮点。\n\n司提反在使徒行传里说：摩西"以为弟兄必明白神是借他的手搭救他们"。摩西学了埃及一切学问，说话行事都有才能，正值壮年——他觉得自己准备好了。但他救人的方式是他自己的方式：用拳头、用杀人。\n\n神说：不是现在。不是这样。四十年后——当他觉得自己最不行的时候（"我素日不是能言的人"），神说：是时候了。己力要衰微，神的大能才得彰显。摩西不去觉得自己能的时候，神不能用他——摩西觉得自己不能的时候，神才开始用他。这四十年不是浪费，是预备。' , next: 's2_2'}
  ]
},

s2_2: {
  ch:2, chName:'第二章 · 摩西蒙召', prog:0.16, effect:null,
  narrative: '四十年后。摩西八十岁了。\n\n他牧养岳父叶忒罗的羊群。一日，领羊群往旷野的背面去，到了神的山——何烈山。\n\n耶和华的使者从荆棘里的火焰中向他显现。\n\n荆棘被火烧着，却没有烧毁。平凡的荆棘——荆棘是被咒诅的植物，是创世记第三章的产物，预表我们微不足道而且被咒诅的本相。但火焰在荆棘中燃烧，荆棘却不被烧毁——这是神住在我们里面的奥秘。不是荆棘本身了不起，是火焰借荆棘作载体。神要使用人，却不需要耗用人的天然成分。他住在荆棘中，而不烧毁荆棘——这就是他的怜悯。\n\n摩西说："我要过去看这大异象，这荆棘为何没有烧毁？"\n\n耶和华见他过去要看，就从荆棘里呼叫说："摩西！摩西！"\n\n"我在这里。"\n\n第一句话——"不要近前来。当把你脚上的鞋脱下来，因为你所站之地是圣地。"\n\n注意：神呼召摩西说的第一句话不是使命，而是"认识神圣洁"。第一个功课不是"做什么"，而是"你是谁"和"我是谁"。鞋脱下来——奴仆赤足，承认在神面前的卑微。天天接触地的鞋不配来到属天的圣地。摩西蒙上脸，因为怕看神。',
  choices: [
    { text: '和摩西一同俯伏在地。', cons: '你跪在何烈山的尘土中。荆棘燃烧却不见消耗——这超越了自然律。火焰和荆棘同时存在——公义和怜悯同时存在，审判和恩典同时存在。神继续说："我的百姓在埃及所受的困苦，我实在看见了。他们因受督工的辖制所发的哀声，我也听见了。我原知道他们的痛苦。我下来是要救他们脱离埃及人的手，领他们到了那流奶与蜜之地……故此，我要打发你去见法老，使你可以将我的百姓以色列人从埃及领出来。"不是"你上去"，是"我下来"。救恩完全出于神。摩西浑身发抖。"我是什么人，竟能去见法老？"越能胜任的，往往越谦卑。开头谦卑，这是很好的兆头。', verse: '出埃及记 3:5 — 神说："不要近前来。当把你脚上的鞋脱下来，因为你所站之地是圣地。"', next: 's2_3' },
    { text: '这火焰——为什么荆棘没有被烧毁？', cons: '你盯着那丛燃烧的荆棘，不敢靠近，但目不转睛。\n\n荆棘——创世记第三章的产物，是被咒诅的植物。它代表人在罪中卑微、可咒的本相。火——是神自己。火在荆棘中燃烧，荆棘却不被烧毁。\n\n这不是物理现象，这是神学的定义：神愿意住在罪人里面，而不烧毁罪人。他使用人，却不消耗人。他不是用完了就丢——他是"住在"荆棘中。\n\n后来保罗会说："我们有这宝贝放在瓦器里，要显明这莫大的能力是出于神，不是出于我们。"你就是荆棘。他就是火。他点燃你——不是为了烧毁你，是为了借你发光。你跪在尘土中，第一次觉得"做荆棘"也不是那么糟。' , next: 's2_3'}
  ]
},

s2_3: {
  ch:2, chName:'第二章 · 摩西蒙召', prog:0.19, effect:null,
  narrative: '摩西说了五个"不"。\n\n"我是什么人？"\n\n"他们若问我你的名字叫什么，我该怎么回答？"\n\n"他们必不信我，也不听我的话。"\n\n"主啊，我素日不是能言的人——我本是拙口笨舌的。"\n\n"主啊，你愿意打发谁就打发谁去吧。"\n\n"拙口笨舌"——原文是"未受割礼的嘴唇"。一个极其形象的希伯来表达。不洁的嘴唇，不能传递神圣洁的话。\n\n神给了他答案——\n\n"我是自有永有的。"（I AM WHO I AM）\n\n这个名字——אֶהְיֶה אֲשֶׁר אֶהְיֶה——神自我存在，他的存在不倚赖任何其他存在。神永远存在，永不改变。昨日、今日乃至将来都永不改变。他现在的样子，将来也如此。\n\n一千五百年后，耶稣用七个"我是"回应了这个名字：我是生命的粮、世界的光、羊的门、好牧人、复活与生命、道路真理生命、真葡萄树。摩西在燃烧的荆棘前听到的名字，在加利利海边被应验了。\n\n神让摩西把手杖丢在地上——变成蛇（眼镜蛇Uraeus，法老冠冕上的守护神！）再拿起来——恢复手杖。这个神迹宣告：法老的神在耶和华的权柄之下。\n\n但摩西仍然说："不不，你打发别人去吧。"神的怒气向摩西发作——却仍与他讲理，直到摩西同意。"不是有你的哥哥利未人亚伦吗？我知道他是能言的……你要替他作神，他要替你作口。"',
  choices: [
    { text: '拿起那根杖，跟摩西一起回埃及。', cons: '摩西终于顺服了。他回到岳父家，告别了妻子和儿子，拿上那根后来将要分开红海的杖。在回埃及的路上，亚伦来迎接他，两人在神的山相遇。埃及——那个摩西逃离了四十年的地方。现在，他要以神使者的身份回去了。"我必与你同在。"软弱的也能成就大事，因为他们在主里刚强，所倚靠的是神的能力。对自己没有信心，对神有信心。神的同在叫不配的得着尊荣，叫软弱愚拙的变得大有智慧和能力。', verse: '出埃及记 3:14 — 神对摩西说："我是自有永有的。"又说："你要对以色列人这样说：那自有的打发我到你们这里来。"', next: 'conn_2_3' },
    { text: '"我是自有永有的"——这个名字到底是什么意思？', cons: '你默念着这个名字：אֶהְיֶה אֲשֶׁר אֶהְיֶה——I AM WHO I AM。\n\n不像埃及神祇各有管辖范围——哈比管尼罗河，拉管太阳。耶和华说：我是。不是"我存在"，是"我就是我"。他的存在不倚赖任何外在事物。他不需要人给他定义。\n\n你想起刚才杖变蛇的神迹——杖丢地上变成蛇（法老冠冕上的眼镜蛇Uraeus），抓起来恢复为杖。法老的神——那盘在他冠冕上的守护蛇——在耶和华的杖面前不过是爬虫。这不仅是呼召摩西，这是向整个埃及万神殿宣战。\n\n摩西拿着这根杖走回埃及。八十岁的老人，一根杖，一个名字——"I AM"。就这些。但神说：够了。' , next: 'conn_2_3'}
  ]
},

s3_1: {
  ch:3, chName:'第三章 · 十灾降临', prog:0.23, effect:'ripple',
  narrative: '"耶和华以色列的神这样说：容我的百姓去，在旷野向我守节。"\n\n法老坐在镶嵌着黄金和青金石的宝座上，嘴角微微上扬。\n\n"耶和华是谁？使我听他的话，容以色列人去呢？我不认识耶和华，也不容以色列人去！"\n\n注意：世上一切邪恶的根源就在于世人不认识神，蔑视神。凡骄傲之子都是悖逆之子。\n\n不仅如此——当天，法老吩咐督工加重以色列人的苦工。什么"事奉神"，分明就是懒惰！"你们不可再给他们草作砖，叫他们自己去捡草。但作砖的数目，一点不可减少。"\n\n百姓怨声载道。摩西俯伏在耶和华面前："主啊，你为什么苦待这百姓？为什么打发我去呢？"\n\n神的回答简短而有力——\n\n"现在你必看见我向法老所行的事。"\n\n在最糟糕的时候，神的帮助就到来了。世间的事就是这样——越坏，往往意味着越好。',
  choices: [
    { text: '静观这场属灵对决的序幕拉开。', cons: '你站在埃及的烈日下。面前的本质不是政治冲突——是主权之争。"以色列人要事奉谁：法老还是神？"这是整个出埃及记的核心问题。摩西举起杖——埃及的尼罗河是他们的生命之神哈比（Hapy）的居所。耶和华要将这"神"变成血。这是第一灾——直接打击埃及的生命线。这不是十场自然灾害，是神的十根手指，一根一根地剥开埃及每一层虚假的骄傲。', verse: '出埃及记 5:2 — 法老说："耶和华是谁，使我听他的话，容以色列人去呢？我不认识耶和华，也不容以色列人去。"', next: 's3_2' },
    { text: '法老加重了苦工——这不是摩西自找的吗？', cons: '你听到了营中的怨言。以色列的官长们挨了打，回来质问摩西："愿耶和华鉴察你们，施行判断——因为你们使我们在法老面前有了臭名。"\n\n摩西俯伏在耶和华面前："主啊，你为什么苦待这百姓？为什么打发我去呢？自从我去见法老，奉你的名说话，他就苦待这百姓——你一点也没有拯救他们。"\n\n这就是顺服神之后的"更糟"。摩西顺服了——结果事态恶化。百姓的苦工加重了。摩西在最深的困惑中说出了最诚实的祷告：责备神。神的回答没有解释为什么——他只说："现在你必看见我向法老所行的事。"\n\n你不总是能理解神的时间表。有时候顺服的下一步不是胜利，是更大的苦难。但这不是结局——是"现在你必看见"的前奏。' , next: 's3_2'}
  ]
},

s3_2: {
  ch:3, chName:'第三章 · 十灾降临', prog:0.28, effect:'embers',
  img: 'media/exodus_darkness.webp',
  narrative: '灾难并非一场接一场的"自然灾害"——这是一场属灵战争。耶和华正在逐一击打埃及的众神，向法老和全世界宣告：唯有他才是神。\n\n第一灾，水变血。摩西举起杖，击打尼罗河的水——整条河变成了血。埃及人站在岸边，看见他们的生命线变成了腥臭的红色。鱼翻着白肚浮上水面，空气里全是腐烂的恶臭。七天。尼罗河神哈比——埃及人拜了数千年的生命之神——在耶和华的杖下，死了。\n\n第二灾，青蛙。青蛙从尼罗河里涌上来——不是几只，是数以百万计。它们跳进法老的宫殿、跳上他的卧榻、爬进炉灶和抟面盆。埃及人每走一步都踩到青蛙。生育女神赫克特——那尊蛙头女神，埃及人认为她掌管生育——现在成了全地的恶心。\n\n第三灾，虱子。亚伦伸杖击打地上的尘土，埃及遍地的尘土都变成了虱子。行法术的也想照样行——却站立不住了。"这是神的手段！"他们对法老说。土地之神盖布，被自己领土上的爬虫埋葬。\n\n从第四灾起，神开始"分别"。蝇灾铺天盖地而来——但歌珊地，没有一只苍蝇。从此，"分别"成了出埃及记的核心主题：属神的人与属世界的，被一条看不见的线分开了。\n\n第五灾，牲畜瘟疫。埃及的牛群、马群、驴群、骆驼群、羊群——全部倒毙在田间。牛神阿匹斯、母牛神哈索尔——瘫在粪堆里。\n\n第六灾，疮灾。摩西向天扬起炉灰——全埃及的人和牲畜身上都起了泡疮。医治之神伊姆霍特普——他自己也需要医治。\n\n第七灾，冰雹与火搀杂。摩西向天伸杖——雷声炸响，冰雹夹着火从天上砸下来。田间所有的人畜、树木、菜蔬都被击打。天空之神努特——被贯穿。唯有歌珊地，安静如初。\n\n第八灾，蝗虫。摩西伸杖——东风把蝗虫刮来。遮天蔽日，地上都黑暗了。它们吃尽冰雹所剩的、田间所长的一切。丰收之神奥西里斯——被吃到颗粒无存。\n\n第九灾，黑暗。摩西向天伸杖——埃及遍地乌黑了三天。不是普通的黑夜——是"人可以摸得到的黑暗"。太阳神拉——埃及万神殿的至高神——熄灭了。全埃及人三天不能相见，不敢离开原位。唯独以色列人家中有亮光。\n\n法老的心，一次比一次刚硬。不是一开始就刚硬——法老先自己硬心七次，神才"任凭"他再硬心五次。这是神任凭人走向自己选择的结局。\n\n法老的让步一步步升级：①在埃及地献祭 ②不远去 ③只男丁去 ④留牲畜 ⑤全去但要祝福我。每一步都像魔鬼的伎俩——"可以，但是……"不完全的释放，从来不是真正的释放。',
  choices: [
    { text: '继续看下去——最后一灾要来了。', cons: '九灾过去了。埃及的经济崩溃了。宗教体系被打翻了。法老的尊严被剥得一丝不挂。但法老还是不肯放手。他知道——妥协就是承认耶和华是神。他不能。他是太阳神拉的儿子。他怎么能向一个奴隶民族的"神"低头？\n\n但最后一灾，将要击中埃及最核心的地方。不是尼罗河，不是太阳，不是牲畜——是埃及每一个家庭的长子。包括法老自己的王位继承人。那夜，死亡天使的翅膀将在埃及上空展开。但以色列人将有一个记号——不是他们的善行，不是他们的虔诚，不是他们的受苦——是一扇涂着血的木门。', verse: '出埃及记 7:5 — 我伸手攻击埃及，将以色列人从他们中间领出来的时候，埃及人就要知道我是耶和华。', next: 'conn_3_4' },
    { text: '法老的心究竟有多硬——我想知道。', cons: '你站在歌珊地的边境线上，望向埃及。九灾之后，满目疮痍。但法老的宫殿依然耸立——这个人的骄傲，连神的手指都还没敲碎。\n\n你想起一句话："耶和华使法老的心刚硬。"这不是神强迫法老悖逆——法老先自己硬了心七次，神才"任凭"他再硬心五次。神从来不会在不敬虔的人心里种下邪恶——法老心里本来就有邪恶，神所做的只是"任凭"。人选择拒绝光，最终就会失去看见光的能力。\n\n但你更在意的是另一个事实：十灾不只是打击法老——也是建立以色列的信心。每一灾都是一堂课："你们要知道我是耶和华你们的神。"从某种意义上说，神降灾不是为了埃及——是为了你。' , next: 'conn_3_4'}
  ]
},

s4_1: {
  ch:4, chName:'第四章 · 逾越之夜', prog:0.34, effect:'embers',
  img: 'media/exodus_passover.webp',
  narrative: '耶和华在埃及地对摩西和亚伦说："你们要以本月为正月，为一年之首。"\n\n一个新的纪元要开始了。不是埃及的太阳历（天狼星偕日升的七月），而是亚笔月——春分后第一个新月。出埃及是神百姓新的开始，日历从零重置。人只有与神恢复正常关系，生命的日子在神眼中才有永恒价值。\n\n"本月初十日，各人要按着父家取羊羔——一家一只。要无残疾、一岁的公羊羔。要留到本月十四日，在黄昏的时候，以色列全会众把羊羔宰了。"\n\n无残疾——对应基督无瑕疵、无玷污。一岁——正值盛年。留四天——检验。黄昏的时候——直译"两个黄昏之间"，基督于申初断气。\n\n"各家要取点血，涂在吃羊羔的房屋左右的门框上和门楣上。"\n\n那个下午，歌珊地的空气凝住了。你看见父亲们牵着羊羔回家——孩子们抱着羊的脖子。四天了，这羊和他们住在一起，吃在一起。现在，它要被宰杀。\n\n黄昏。刀落下。\n\n你把牛膝草蘸进盆里的血——还是温热的。打在门楣上。左门框。右门框。一下，两下，三下。血在木头上蔓延开来。\n\n那夜，全以色列人在紧闭的门后，吃烤羊羔的肉，连同无酵饼和苦菜。烤了吃——不可生吃，不可水煮。无酵饼——离罪的决绝。苦菜——罪的滋味，是苦的。腰间束带、脚上穿鞋、手中拿杖——赶紧地吃。这顿饭的姿势，是随时预备出发的姿势。\n\n而外面——全埃及，正陷入一种憋着呼吸的寂静。',
  choices: [
    { text: '把羔羊的血涂在门框上。', cons: '你把手浸入盆中的血——还是温热的。羔羊的身体躺在旁边，刚刚断气。你用牛膝草蘸了血，打在门楣和左右的门框上。一下。两下。三下。血在木头上蔓延开来。\n\n那一刻你忽然明白了——审判与否，全在于这只无残疾的羊羔。神说："我一见这血，就越过你们去。"神不看房屋大小，不看里面的人是谁，不看他们的虔诚程度——神只看门框上有没有血。\n\n信心好比那一把牛膝草——将神的应许归到我们身上。你的一切善行在这血面前都不值一提。但只要有血，你就安全了。\n\n门外，死亡天使正穿过埃及的街道。', verse: '出埃及记 12:7 — 各家要取点血，涂在吃羊羔的房屋左右的门框上和门楣上。', next: 's4_2' },
    { text: '坐在门内，听着门外——什么声音也没有。', cons: '你放下牛膝草，靠着门坐下。血已经干了，在木头上形成暗红色的痕迹。家里的人在吃羊羔的肉——烤肉的香气混着苦菜的气味。\n\n你竖起耳朵。门外——绝对的寂静。没有狗吠，没有风声，没有脚步声。整个埃及仿佛被按下了静音键。\n\n然后你听见了——从很远的地方，传来一个母亲撕心裂肺的哭嚎。然后又是一个。然后全埃及都在哀号。法老的宫中也在哀号。没有一家不死一个人的。但你的家——安静的。羊羔替你死了。死亡从你的门口越过去了。\n\n不是因为你是以色列人。不是因为你的道德比埃及人好。只是因为——门上有血。这就是福音。' , next: 's4_2'}
  ]
},

s4_2: {
  ch:4, chName:'第四章 · 逾越之夜', prog:0.38, effect:'ripple',
  narrative: '半夜。\n\n灭命的使者穿过埃及——不是一个人，是毁灭本身。凡门楣和门框上没有血的，家中的长子便被击杀。\n\n从坐宝座的法老，到推磨的婢女，到监牢里的囚犯——一切头生的，连牲畜头生的，尽都死了。\n\n然后——哀号。\n\n全埃及有大哀号。那个声音你无法描述——不是一个母亲的哭声，不是一个家庭的哭声，是整个国家在同一秒钟崩溃的哭声。法老的长子、宰相的长子、工匠的长子、奴隶的长子——全部在同一夜死去。\n\n法老夜间起来。他的继承人——下一任荷鲁斯在地上的化身——冰冷地躺在那里。他召了摩西、亚伦来，说——\n\n"起来！连你们带以色列人，从我民中出去，依你们所说的去事奉耶和华吧！也依你们所说的，连羊群牛群带着走吧！并要为我祝福。"\n\n"并要为我祝福"——太阳神之子求一个奴隶领袖的祝福。彻底的翻转。与神过不去，就是与自己过不去。\n\n埃及人催促百姓，打发他们快快出离那地，因为埃及人说："我们都要死了。"以色列人从兰塞起行，往疏割去。除了妇人孩子，步行的男人约有六十万——加上妇孺超过两百万。又有许多闲杂人，并有羊群牛群和他们一同上去。他们不是一群逃跑的奴隶，而是"耶和华的军队"——按支派井然有序地离开。不是仓皇出逃，是凯旋般的行军。\n\n以色列人住在埃及共有四百三十年。\n\n正满了四百三十年的那一天——耶和华的军队都从埃及地出来了。\n\n"这夜是耶和华的夜。"从此以后，每年这夜——他们要守逾越节，世世代代，作为永远的定例。',
  choices: [
    { text: '拿起没有发酵的面团，走向旷野。', cons: '你走出那扇涂了血的木门。天还没亮透——埃及还在哀号。但你手里捏着无酵的面团，来不及等它发起来了。自由来得太突然，以至于连等面发酵的时间都没有。\n\n"你们谁也不可出自己的房门，直到早晨。"在血的范围之内是安全的——踏出这个范围就没有保障。但现在，早晨到了。四百三十年了——从雅各带着七十人下埃及到今天，过去了一个帝国的时间。七十人变成了两百万。亚伯拉罕的应许——"你的后裔要如天上的星、海边的沙"——正在应验。神用大能的手，将他的百姓领出来了。', verse: '出埃及记 12:40-41 — 以色列人住在埃及共有四百三十年。正满了四百三十年的那一天，耶和华的军队都从埃及地出来了。', next: 'conn_4_5' },
    { text: '最后回望一眼——埃及在黑暗中哭。', cons: '你停下脚步，回头望了一眼。凌晨的微光中，埃及的轮廓在抽搐——那个曾经不可一世的帝国，今夜每家每户都在哀哭。\n\n你想起了十灾。不是神的脾气失控——是神用十根手指，一根一根地把法老攥紧的拳头掰开。法老说"我不认识耶和华"——现在他认识了。法老说"我不容以色列人去"——现在他恨不得求你们快走。\n\n但你知道最震撼的是什么：你们不是仓皇出逃的难民。出埃及记12:51说——"正满了四百三十年的那一天"。不是"大约"，不是"差不多"。神数算日子，精确到那一天。四百三十年——一天不多，一天不少。这是神的时刻表。然后你转身——前方是旷野，而云柱正在升起来。' , next: 'conn_4_5'}
  ]
},

s5_1: {
  ch:5, chName:'第五章 · 过红海', prog:0.47, effect:'ripple',
  img: 'media/exodus_redsea.webp',
  narrative: '天边扬起沙尘——不是风沙，是车轮。\n\n六百辆特选的战车，加上埃及所有的战车，每辆都有精锐战士。法老亲自领军——他后悔了。"我们容以色列人去，不再服事我们，这做的是什么事呢？"\n\n以色列人举目看见埃及人赶来——就甚惧怕，向耶和华哀求。两百万人的营地变成了一锅沸腾的恐惧。\n\n他们转向摩西——声音里满是怨毒："难道在埃及没有坟地，你把我们带来死在旷野吗？我们在埃及岂没有对你说过——不要搅扰我们，容我们服事埃及人吗？服事埃及人比死在旷野还好！"\n\n人就是这样——一遇难处就美化过去的奴役生活。只记得埃及的肉锅，不记得埃及的鞭子。\n\n摩西站在咆哮的人群面前，他的声音穿透了恐惧——\n\n"不要惧怕，只管站住！看耶和华今天向你们所要施行的救恩。你们今天所看见的埃及人，必永远不再看见了。"\n\n"耶和华必为你们争战；你们只管静默，不要作声。"\n\n前有红海，后有追兵。左右都是旷野。这是绝境——神特意把他们领到的绝境。因为只有在绝境中，人才能学会"站住"和"看"。不是看自己。不是看敌人。是看神。站住不是消极——是信心的最高姿势。',
  choices: [
    { text: '不要作声——看着神的救恩。', cons: '你闭上嘴。不再抱怨。不再哀求。只是站着。看着。摩西向海伸杖。\n\n大东风吹了一整夜。你听见风声呼呼地响——不是寻常的风。是创造天地的灵运行在水面上。海浪在黑暗中分开。你无法用言语解释这一刻——但你知道，正在发生的事超越了物理法则。创造宇宙的神正在为他的百姓开辟一条不可能的路。\n\n神说："你吩咐以色列人往前走。"往前——不是绕路，不是等待，是走进刚刚分开的海。信心的一步。人若走在尽本分的路上，即使前路看似不可能，也要往前走。往前——走进红海。', verse: '出埃及记 14:13-14 — 摩西对百姓说："不要惧怕，只管站住！看耶和华今天向你们所要施行的救恩……耶和华必为你们争战；你们只管静默，不要作声。"', next: 's5_2' },
    { text: '可是后面是战车，前面是大海——真要往前走？', cons: '你知道这个命令有多荒唐。后面是埃及的精锐骑兵——马蹄声都听得见了。前面是红海——一望无际的深水。左右是旷野——无路可逃。\n\n但摩西没有拔出刀。他没有组织防御阵型。他只是举起了一根杖——那根曾经变成蛇、曾经击打尼罗河水的杖。\n\n你忽然明白了：出埃及从头到尾不是靠人的策略。十灾不是摩西的计谋。过红海也不可能是。神特意让百姓走到绝境——就是为了让全地知道：得救完全出于耶和华。你现在唯一的"行动"，就是不行动。站住。看。然后往前走——在他开路之后。\n\n这比你想象的更难——什么都不做，比做什么都需要更大的信心。' , next: 's5_2'}
  ]
},

s5_2: {
  ch:5, chName:'第五章 · 过红海', prog:0.52, effect:'embers',
  narrative: '摩西向海伸杖。\n\n耶和华便用大东风，使海水一夜退去。水便分开——海就成了干地。\n\n你走在红海的海底。不是淤泥，不是湿地，是干地。两边的水墙耸立如透明的壁垒——右边是水，左边是水，头顶是夜空。透过水墙，你甚至能看到游鱼——创造主在历史的一刻为你展现的奇景。脚下每一粒沙子都是干的——仿佛这片海从来没有存在过。\n\n两百万人，按着支派，带着牛羊和行囊，从海底走过。没有人说话——只有脚步声。\n\n然后是埃及人。法老一切的马匹、车辆和马兵，都跟着下到海中。车轮碾压干地的声音在海底回荡——他们追来了。\n\n到了晨更的时候——那是黎明前最黑暗的一刻。耶和华从云火柱中向埃及的军兵观看。就一眼。埃及全军就乱了。车轮脱落，马匹惊狂，战车乒乒乓乓地撞在一起。埃及人终于看见了——不是看见了海水，是看见了与他们争战的是谁。\n\n"我们从以色列人面前逃跑吧！因耶和华为他们攻击我们了。"\n\n太晚了。凡干预神百姓的，最后都自取其祸。他们直到此刻才信——但信得太晚了。',
  choices: [
    { text: '回头看一眼——海水正在合拢。', cons: '摩西再次向海伸杖。天一亮，海水仍旧复原。\n\n你站在对岸——听见的不是水声，是彻底的吞没。车辆、马匹、战士、铠甲——法老的全军，连一个也没有剩下。红海恢复了平静。仿佛什么都没有发生过。\n\n只有海面上偶尔漂起的残片，提醒你刚才在这片水域之下，一个超级大国的精锐骑兵全军覆没。而你们——昨天还在泥砖坑里弯着腰的奴隶——站在对岸，自由了。\n\n以色列人看见耶和华向埃及人所行的大事，就敬畏耶和华，又信服他和他的仆人摩西。他们想起了自己在海边的抱怨——羞愧难当。', verse: '出埃及记 14:28 — 水就回流，淹没了车辆和马兵。那些跟着以色列人下海的法老的全军，连一个也没有剩下。', next: 's5_3' },
    { text: '不是回头看——是看前面。过了红海，然后呢？', cons: '你没有回头。你看着前方——巴力洗分的旷野在晨曦中展开。自由了。但自由之后呢？\n\n你忽然意识到一件事：红海不只是一次逃生。过红海是一次洗礼。从水中经过，旧的生命留在埃及那边——虽然"旧人"的追兵还会追上来，但你已经到了这边。保罗说，以色列人"都在云下、都从海中经过，都在云里海里受洗归了摩西"——过红海是新约洗礼的预表。与基督同死，与基督同活。\n\n但前面是旷野——不是迦南。得救是一刻的事，成圣是一生的路。你深吸一口气。旷野，我来了。' , next: 's5_3'}
  ]
},

s5_3: {
  ch:5, chName:'第五章 · 过红海', prog:0.56, effect:null,
  narrative: '米利暗——摩西的姐姐，那个曾在尼罗河畔远远看着蒲草箱的小女孩——如今已是年迈的女先知。\n\n她手里拿着鼓。众妇女跟着她出去，拿鼓跳舞。不是排练好的舞蹈，是从灵魂深处迸发出来的欢腾。\n\n她扬声歌唱——\n\n"你们要歌颂耶和华，因他大大战胜——将马和骑马的投在海中。"\n\n"耶和华是我的力量、我的诗歌，也成了我的拯救。这是我的神，我要赞美他；是我父亲的神，我要尊崇他。耶和华是战士——他的名是耶和华。"\n\n这是圣经中第一首记录的赞美诗。不是在教堂里写的，不是在平安稳妥时写的——是在红海彼岸的沙滩上，脚还踩着刚吞没了法老大军的水边湿沙。快快以颂赞回报神，免得时间抹去感恩的心。\n\n从这一刻起，一切都变了。你们不再是一群逃亡的奴隶——你们是耶和华的军队。',
  choices: [
    { text: '拿起鼓，和米利暗一同跳舞。', cons: '你在红海彼岸的沙滩上跳起舞来。脚下是干爽的沙地，身后是吞噬了法老全军的大海。四百三十年的奴役——结束了。不是靠起义，不是靠谈判，不是靠人的智慧或力量——是神亲自用十根手指，一根一根地掰开了法老握紧四百多年的拳头。米利暗的歌唱、众妇女的舞蹈——这是旧约第一首赞美诗。前面的路还很长——旷野在等着——但此刻，值得跳舞。', verse: '出埃及记 15:2 — 耶和华是我的力量，我的诗歌，也成了我的拯救。这是我的神，我要赞美他；是我父亲的神，我要尊崇他。', next: 'conn_5_6' },
    { text: '水边安静坐一会儿——不是所有人都能起舞。', cons: '你坐在红海边的沙滩上，没有加入舞蹈。脚边的水还在轻轻拍岸——就是这片水，几小时前还立起来作墙垣。\n\n你看着那些在跳舞的妇女们。她们有些人背上还有鞭痕——埃及督工留下的印记，还没消。但她们在跳舞。你忽然理解了——赞美不是忘记痛苦，而是看见救恩。\n\n摩西的歌里有一句话你反复品味："你凭慈爱领了你所赎的百姓；你凭能力引他们到了你的圣所。"过了红海不是结束——是开始。神不是把他们从埃及救出来丢在旷野就不管了。他要领他们到"圣所"。救恩的终点，是神的同在。你起身——拍掉身上的沙。该上路了。' , next: 'conn_5_6'}
  ]
},

conn_5_6: {
  isConnection:true, fromCh:5, toCh:6,
  quote: '我要从天上降粮食给你们。', quoteRef:'出埃及记 16:4',
  narrator:'自由了。现在呢？',
  thread: '红海的神迹过去了——但前面是书珥的旷野。数百万人行走在荒漠中。三天找不到水——找到的却是苦水。百姓开始发怨言。自由是甜蜜的，但旷野是艰难的。神带领他们先到玛拉（苦水），再到以琳（十二水泉七十棕树）。先苦后甜——这是神的试验模式。旷野的经历不是失败的记录，而是使人脱离神之外一切依靠的过程。',
  choices:[{next:'s6_1'}], btnText:'走入旷野 →'
},

s6_1: {
  ch:6, chName:'第六章 · 旷野试炼', prog:0.62, effect:null,
  img: 'media/exodus_manna.webp',
  narrative: '出埃及后第二个月十五日——百姓的粮食吃完了。\n\n两百万人站在荒漠里。粮袋空了。\n\n"巴不得我们早死在埃及地耶和华的手下！那时我们坐在肉锅旁边，吃得饱足——你们将我们领出来，到这旷野，是要叫这全会众都饿死啊！"\n\n肉锅——这是他们最深的记忆。埃及的肉锅。不是埃及的鞭子，不是埃及的苦工，不是埃及的杀婴令。是肉锅。人就是这样：在苦难中，记忆像筛子一样，只留下"美好的过去"，滤掉罪的代价。\n\n但耶和华不像法老——他不鞭打，他供应。\n\n"我要将粮食从天降给你们。百姓可以出去，每天收每天的分，我好试验他们遵不遵我的法度。"\n\n早晨——野地出现了一个小圆物，细小如白霜。铺满地面。\n\n"这是什么？"——吗哪，在希伯来文里就是"这是什么"。\n\n摩西说："这就是耶和华给你们吃的食物——从天上来的粮食。"\n\n滋味像掺了蜜的薄饼。颜色是白的，样子像芫荽子。每天早晨，按着各人的饭量收取。第六天收双份——第七天是安息日。多的不会剩，少的不会缺——属天的供应由神量给各人。',
  choices: [
    { text: '弯腰拾起地上的吗哪。', cons: '那些洁白的小圆片在晨光中微微发亮。你拿起一片放入口中——甜的。像蜂蜜掺在薄饼里。\n\n每天早晨你醒来，昨日留下的吗哪已经生虫变臭了。但新一天的吗哪总是准时出现——从不多余，从不迟到。有多收的，有少收的；及至用量器一量，多收的也没有余，少收的也没有缺。每个家庭刚好够——不是按人的贪心，是按神的量定。\n\n四十年，一直如此。在旷野你学会了一件事：不是依靠积蓄，而是每一天仰望供应。耶稣后来指着说："我是从天上降下来的生命粮。"吗哪是影子——基督才是真粮。', verse: '出埃及记 16:4 — 耶和华对摩西说："我要将粮食从天降给你们。百姓可以出去，每天收每天的分，我好试验他们遵不遵我的法度。"', next: 's6_2' },
    { text: '我很饿——但我更想知道神为什么要"试验"我们。', cons: '你俯身拾起吗哪，但脑子里反复回响着神的话："我好试验他们遵不遵我的法度。"\n\n试验。神让百姓经历饥饿——然后才降下粮食。不是惩罚，是显明。肚子空了，才知道依靠谁。每天只给一天的分——不是小气，是训练。主要我们天天来到他面前，每天取当天需用的。\n\n后来摩西在申命记里解释："他苦炼你、任你饥饿，将你和你列祖所不认识的吗哪赐给你吃——使你知道人活着不是单靠食物，乃是靠耶和华口里所出的一切话。" 旷野不是失算，是设计。人在饱足时最容易忘记神——旷野把"饱足"拿走了，让人只能依靠神。你咽下吗哪。甜的。但甜的不只是食物——是每一天被供应的确据。' , next: 's6_2'}
  ]
},

s6_2: {
  ch:6, chName:'第六章 · 旷野试炼', prog:0.66, effect:null,
  narrative: '利非订——没有水。一滴都没有。\n\n百姓的喉咙干得像砂纸。孩子们在哭。牲畜在倒毙。\n\n他们围住摩西，声音沙哑："给我们水喝吧！"\n\n摩西说："你们为什么与我争闹？为什么试探耶和华？"\n\n百姓渴得几乎失控——有人开始捡石头。摩西，那个领他们过红海的摩西，他们几乎要拿石头打死他。\n\n摩西呼求耶和华："我向这百姓怎样行呢？他们几乎要拿石头打死我。"\n\n耶和华对他说："你手里拿着你先前击打河水的杖。我必在何烈的磐石那里，站在你面前。你要击打磐石，从磐石里必有水流出来，使百姓可以喝。"\n\n摩西在以色列众长老眼前这样行了。他用那根审判之杖击打磐石。那根杖——曾经击打尼罗河，把水变成血，是审判之杖。现在，同样的杖击打磐石——审判落在了磐石上，水就流出来。水的代价，是磐石受击打。恩典流出来给了百姓——但磐石替他们承受了杖。',
  choices: [
    { text: '看着水从岩石中涌流出来。', cons: '杖击在磐石上——嘭。一道裂缝。然后——水。\n\n不是细流。是涌流。清澈的、冰凉的、充沛的水从磐石中喷涌而出——足够两百万人和所有牲畜喝。你俯身捧起水，入口的一刻你几乎哭出来。从不可能的地方，流出了生命的泉源。\n\n保罗后来写道——"那磐石就是基督。"被击打的磐石，为我们流出生命的水。因他受的刑罚，我们得平安；因他受的鞭伤，我们得医治。那根杖本应落在我们身上——却落在了磐石上。这就是整个出埃及记的核心：替代性救赎。', verse: '出埃及记 17:6 — 我必在何烈的磐石那里，站在你面前。你要击打磐石，从磐石里必有水流出来，使百姓可以喝。', next: 's6_3' },
    { text: '但这百姓——刚喝完水就会忘。我能不一样吗？', cons: '你喝完水，坐在磐石边。水还在流——冰凉的，充沛的。但你的心底有一丝不安。\n\n这群百姓刚刚看见磐石出水——可几周前他们还在红海边抱怨。过了红海，忘了。喝了磐石的水，也会忘的。\n\n你诚实地问自己：我和他们不一样吗？我在顺境时信誓旦旦说"耶和华是我的牧者"——在逆境时第一反应是"神你在哪里"。这就是"硬着颈项"——不是不信神的存在，是不信神的良善。旷野把人心里的不信显明出来——不是为了定罪，是为了医治。\n\n你起身。水流还在身后。下一次口渴的时候——你还记得这磐石吗？' , next: 's6_3'}
  ]
},

s6_3: {
  ch:6, chName:'第六章 · 旷野试炼', prog:0.69, effect:'embers',
  narrative: '亚玛力人来了。\n\n这是以色列人出埃及后的第一场战争。亚玛力——这个名字的意思是"捣乱的群众"、"所有的努力都是徒劳无益"。这正是"肉体"的最好说明。过了红海，喝了活水——亚玛力人（肉体）就来了。未得救者不认识肉体，认识肉体恰恰说明你正在长进中。\n\n摩西对约书亚说："你为我们选出人来，出去和亚玛力人争战。明天我手里要拿着神的杖，站在山顶上。"\n\n第二天——摩西、亚伦和户珥上了山顶。摩西何时举手，以色列人就得胜；何时垂手，亚玛力人就得胜。\n\n但摩西的手发沉。\n\n没人能独自赢得战争。山上的举手决定山下的胜负。摩西需要亚伦和户珥。约书亚需要摩西举手。神的儿女需要彼此。',
  choices: [
    { text: '扶住摩西的手——他快撑不住了。', cons: '你把手放在摩西的手肘下。他的手臂在颤抖，肌肉酸胀到几乎没有知觉。但你和亚伦——一左一右。手臂稳住了，直到日落。山顶的风吹过，山下刀剑声不绝。你不挥剑，但你的手一样重要。\n\n战争结束后，摩西筑了一座坛，起名叫"耶和华尼西"——耶和华是我的旌旗。山顶的代祷和山下的争战——缺一不可。神要得着"祭司的国度"，不是几位"超级肢体"。', verse: '出埃及记 17:12 — 但摩西的手发沉，他们就搬石头来，放在他以下，他就坐在上面。亚伦与户珥扶着他的手，一个在这边，一个在那边，他的手就稳住，直到日落。', next: 'conn_6_7' },
    { text: '约书亚在山下挥刀——我想知道山顶和山下哪一个更关键。', cons: '你没有马上去扶摩西的手——你站在山顶的边缘，看着山下。约书亚带着选出的战士，在尘土和鲜血中搏杀。\n\n然后你发现了这个令人震惊的规律：摩西的手举起，约书亚就推进。摩西的手下沉——不管约书亚多勇猛，亚玛力人就反扑。胜负不取决于山下的刀剑，而取决于山上的举手。\n\n属灵争战的胜负不在地上。保罗说"我们并不是与属血气的争战"——地上的问题是天上问题的投影。约书亚砍倒的是亚玛力人，摩西举起的是神的杖。没有山上的代求，山下所有的努力都是徒然。你跪下，扶住了摩西的手——这才是真正的战场。' , next: 'conn_6_7'}
  ]
},

s7_1: {
  ch:7, chName:'第七章 · 西奈之约', prog:0.72, effect:'embers',
  img: 'media/exodus_sinai.webp',
  narrative: '以色列人出埃及地以后，满了三个月的那一天——\n\n他们来到西奈的旷野，在山下安营。\n\n耶和华从山上呼唤摩西说："你要这样告诉雅各家，晓谕以色列人：我向埃及人所行的事，你们都看见了——且看见我如鹰将你们背在翅膀上，带来归我。"\n\n"如鹰背在翅膀上"——鹰带小鹰飞行，若有箭射来，先射透老鹰，才伤得着小鹰。不是强迫，是背负。不是奴役，是托住。在先前的三个月里——十灾、逾越节、过红海——神已经证明了他不是在奴役他们，而是在背负他们。\n\n"如今你们若实在听从我的话，遵守我的约，就要在万民中作属我的子民。你们要归我作祭司的国度，为圣洁的国民。"\n\n百姓同声回答："凡耶和华所说的，我们都要遵行。"\n\n到了第三天早晨——\n\n山上有雷轰、闪电和密云。角声拖得很长——越来越大，越来越响，穿透骨髓。营中的百姓尽都发颤。\n\n西奈全山冒烟——因为耶和华在火中降于山上。山的烟气上腾，如烧窑一般。遍山大大地震动。整个山都在抖。岩石在抖。百姓的腿在抖。\n\n这不是恐吓——这是让人认识三件事：神的圣洁不可轻慢；律法不是建议，是烈火；人不能直接就近神——需要一位中保。',
  choices: [
    { text: '站在山脚下，仰望那冒烟的山。', cons: '你从未见过这样的景象。山在燃烧却不被烧毁——正如当初那荆棘。遍山震动，仿佛创造主亲自踏足这地。雷声、闪电、角声混杂在一起，你分不清哪个是自然现象，哪个是神的声音。\n\n但这恐惧不同于埃及的恐惧——埃及的恐惧是压迫，这里的恐惧是敬畏。你不是怕被击杀——你是被圣洁的存在本身所覆盖。\n\n"神降临是要试验你们，叫你们时常敬畏他，不致犯罪。"敬畏那位说话的神——那位"如鹰将你们背在翅膀上，带来归我"的神。不是先给律法再拯救——先拯救（"将你从埃及领出来"），再给律法。律法不是得救的途径，而是蒙恩之人的生活规范。这个顺序，是一切的关键。', verse: '出埃及记 19:18 — 西奈全山冒烟，因为耶和华在火中降于山上。山的烟气上腾，如烧窑一般，遍山大大地震动。', next: 's7_2' },
    { text: '我想上到山顶去——但我知道我不能。', cons: '你站在山下，身体前倾——有一股冲动想走上去。但山脚下有界限，越界的必被治死。你只能站在这里。\n\n距离——这是西奈山最尖锐的信息。神降下来了，山都在燃烧。但你仍然不能上去。不是神不愿意亲近——是人不够圣洁来就近他。\n\n你需要一个中间人。摩西上去了。后来亚伦和他的儿子。再后来——大祭司一年一次带着血进入至圣所。每一次都有一个中间人。直到有一天，那位真正的"中间人"对门徒说："人看见了我，就是看见了父。"他就是那西奈山上的烈火——但他成了肉身，你可以走近他，不用被击杀。你站在山下，望着山顶上的火——等候那一天的到来。' , next: 's7_2'}
  ]
},

s7_2: {
  ch:7, chName:'第七章 · 西奈之约', prog:0.76, effect:null,
  narrative: '神从山上说话——\n\n十条诫命。十句话。\n\n"我是耶和华你的神，曾将你从埃及地为奴之家领出来。\n\n除了我以外，你不可有别的神。\n\n不可为自己雕刻偶像……\n\n不可妄称耶和华你神的名……\n\n当记念安息日，守为圣日……\n\n当孝敬父母……\n\n不可杀人。不可奸淫。不可偷盗。不可作假见证。不可贪恋。"\n\n开头就非同寻常——"我是耶和华你的神，曾将你从埃及地为奴之家领出来。"不是先说"你不可"，而是先说"我做了"。恩典在前，律法在后。他已经救了你——现在他要教你怎样活出自由的生命。\n\n两块石版。第一块关乎人与神——前四诫。第二块关乎人与人——后六诫。总纲是爱神和爱人——耶稣后来这样说。十诫不是束缚——是爱的框架。是十根栅栏，圈出一片安全的草地。',
  choices: [
    { text: '仔仔细细听每一条诫命。', cons: '你听到的不只是一份道德清单——你听到的是一份关系的定义。"我是耶和华你的神，曾将你从埃及地为奴之家领出来。"他不是不知名的神明——他是把你从埃及领出来的那一位。一切诫命都建立在这个身份之上。因为他爱你，他告诉你什么是对的。\n\n"除了我以外，你不可有别的神。"原文是"在我的面前"——在真神面前有别的神，本身就是敌对。最容易触犯这条的，就是把唯有神才当得的荣耀归给被造之物。骄傲把自己当成神，贪婪把钱财当成神，放纵把肚腹当成神。我们所敬所爱、所惧怕所服事、所喜悦所倚靠的——若超过了神，就是在拜别神。', verse: '出埃及记 20:2 — "我是耶和华你的神，曾将你从埃及地为奴之家领出来。"', next: 's7_3' },
    { text: '十条诫命——总纲是什么？', cons: '你试图把十句话串起来。第一块石版——前四条，关乎人与神。第二块石版——后六条，关乎人与人。但它们不是两本独立的法典。\n\n后来有人问耶稣："诫命中哪一条是第一要紧的？"他回答说："第一要紧的就是——你要尽心、尽性、尽意、尽力爱主你的神。其次也相仿——就是要爱人如己。再没有比这两条诫命更大的了。"\n\n十诫的总纲是爱。但不是泛泛的"爱"——是爱那位先把你从埃及领出来的神，然后因着爱他而爱他造的人。如果先爱人后爱神，爱会变成人本主义。如果只"爱神"却不爱人，就成了法利赛人。十诫不是十根捆绑人的锁链——是十根栅栏，圈出一片安全的草地。在其中，你可以自由地爱神、爱人。' , next: 's7_3'}
  ]
},

s7_3: {
  ch:7, chName:'第七章 · 西奈之约', prog:0.80, effect:null,
  narrative: '立约的仪式。\n\n清早起来，摩西在山下筑一座坛，按以色列十二支派立十二根柱子。\n\n又打发以色列人中的少年人去献燔祭，又向耶和华献牛为平安祭。\n\n摩西将血一半盛在盆中，一半洒在坛上。又将约书念给百姓听——\n\n他们说："耶和华所吩咐的，我们都必遵行。"\n\n摩西将血洒在百姓身上，说——\n\n"看哪，这是立约的血，是耶和华按这一切话与你们立约的凭据。"\n\n一半洒在坛上——代表神的一方。一半洒在百姓身上——代表人的一方。这血是立约的凭据。主耶稣后来说"这是我立约的血"（太26:28），就是指向这个仪式。\n\n随后，摩西、亚伦、拿答、亚比户，并以色列长老中的七十人，都上了山。\n\n他们看见以色列的神——他脚下仿佛有平铺的蓝宝石，如同天色明净。\n\n他们观看神。然后——又吃又喝。\n\n他们看见了神……然后继续吃饭？是的。这是旧约中最令人惊奇的画面之一：在立约之血的遮盖之下，罪人可以与神一同坐席——平安无事。',
  choices: [
    { text: '在这约的血之下，与神一同坐席。', cons: '你坐下来，手里拿着食物。这画面太奇妙了——你的手刚摸过洒在身上的血，你的眼睛刚望见西奈山燃烧的火焰，你的耳朵刚听过雷声和角声……但现在你坐在神的面前，又吃又喝。不是因为你不怕了——是因为有约的血遮盖了你。\n\n不是凭己力遵行神的话——是凭这血。人之所以能亲近神，不在于自己能做得多好，乃在于"立约的血"。后来耶稣在逾越节的晚餐上说："这是我立约的血，为多人流出来，使罪得赦。"那杯在十字架上倾倒的血，就是你今天坐在神面前吃喝的唯一理由。', verse: '出埃及记 24:8 — 摩西将血洒在百姓身上，说："看哪，这是立约的血，是耶和华按这一切话与你们立约的凭据。"', next: 'conn_7_8' },
    { text: '七十个长老都看见神了——他们看见了什么？', cons: '你退后一步，看着摩西、亚伦、拿答、亚比户和七十个长老上山。经文说——"他们看见以色列的神，他脚下仿佛有平铺的蓝宝石，如同天色明净。"\n\n他们看见了什么？是神的本体吗？不——约翰福音说"从来没有人看见神。"但他们看见了某种荣耀的彰显——蓝宝石的铺路，天色般明净。\n\n最震撼的是接下来这句话："他们观看神，又吃又喝。"看见了神的荣耀——然后继续吃喝。这不是不敬，这是平安。在立约之血的遮盖下，罪人可以和神一同坐席而不被击杀。这是团契——这是旧约中极少见的亲密画面。你在山下仰望，知道有一天——不是在山上遥望，而是"面对面"。' , next: 'conn_7_8'}
  ]
},

s8_1: {
  ch:8, chName:'第八章 · 金牛犊', prog:0.84, effect:'embers',
  img: 'media/exodus_goldencalf.webp',
  narrative: '百姓见摩西迟延不下山，就聚集到亚伦那里——\n\n"起来！为我们做神像，可以在我们前面引路。因为领我们出埃及地的那个摩西，我们不知道他遭了什么事。"\n\n"那个摩西"——多么刺耳。救主迟迟不归，人心就开始胡乱猜疑。"主耶稣上了荣耀的山，为我们的缘故来到神面前，并非肉眼可见。那恶仆心里说：我的主人必来得迟。"\n\n刚刚还在西奈山下起誓"凡耶和华所说的我们都必遵行"的百姓，现在要一个金牛犊。\n\n亚伦——摩西的哥哥——屈服了。\n\n"你们去摘下你们妻子、儿女耳上的金环，拿来给我。"\n\n百姓就都摘下耳上的金环。那些金子——是出埃及时埃及人塞给他们的——他们把它变成了一个偶像。\n\n亚伦铸了一只牛犊，说："以色列啊，这是领你出埃及地的神！"\n\n亚伦在牛犊面前筑坛，宣告说："明日要向耶和华守节。"\n\n把拜金牛犊当作敬拜耶和华——最可怕的偶像不是假神，而是用人的方式来"敬拜"真神。许多人自称信神，但敬拜的其实是心中的金牛犊——一个符合自己想象和需要的偶像。',
  choices: [
    { text: '你怎么能——他们刚刚才看见红海分开啊！', cons: '你的手在发抖。不是恐惧——是愤怒和心碎。红海的水珠还挂在记忆里，西奈山的火焰还映在瞳孔中，立约的血还干在衣襟上——他们就造了一个牛犊？何等快快的偏离。"等不多时，他们就忘了他的作为。"人若刚刚重申与神立约，刚刚领受他的特别怜悯，却又踏足罪恶——那是极大的冒犯。\n\n这就是人心最黑暗的真相：我们不是在信心中苦苦挣扎——我们是在信心中随时随地准备叛逃。亚伦见众人喜欢这牛犊，就更想讨好他们。神若置之不理，再好的人也不过如此——所以休要倚靠世人。自己以为站得稳的，须要谨慎，免得跌倒。', verse: '出埃及记 32:4 — 亚伦从他们手里接过来，铸了一只牛犊，用雕刻的器具做成。他们就说："以色列啊，这是领你出埃及地的神！"', next: 's8_2' },
    { text: '亚伦——摩西的哥哥、大祭司——怎么会是他带头？', cons: '你盯着亚伦。他是摩西的哥哥，是神指定的口，是将来大祭司。但他熔化了百姓的金耳环，铸了一只牛犊。\n\n他甚至还宣告："明日要向耶和华守节。"把拜金牛犊说成敬拜耶和华——这是最狡猾的偶像崇拜。不是公开离弃神，而是用人的方式重新定义"敬拜"。许多自称信神的人，敬拜的其实是心中那只金牛犊——一个符合自己想象的、看得见摸得着的、不要求圣洁的"神"。\n\n你心里一凉：如果亚伦都可以沦落到这地步——那我自己呢？"所以，自己以为站得稳的，须要谨慎，免得跌倒。"不是去定亚伦的罪——是在亚伦身上看到了自己的可能性。' , next: 's8_2'}
  ]
},

s8_2: {
  ch:8, chName:'第八章 · 金牛犊', prog:0.88, effect:'embers',
  img: 'media/exodus_moses_shine.webp',
  narrative: '耶和华吩咐摩西说："下去吧，因为你的百姓——就是你从埃及地领出来的——已经败坏了。他们快快偏离了我所吩咐的道，为自己铸了一只牛犊，向它下拜献祭。"\n\n耶和华又说："我看这百姓真是硬着颈项的百姓。你且由着我，我要向他们发烈怒，将他们灭绝，使你的后裔成为大国。"\n\n这一刻，摩西面临一个选择——接受神的提议，成为新亚伯拉罕？\n\n但他没有。他为百姓代求——\n\n"耶和华啊，你为什么向你的百姓发烈怒呢？这百姓是你用大力和大能的手从埃及地领出来的。为什么使埃及人议论说：\'他领他们出去，是要降祸与他们\'？求你转意，不发你的烈怒，后悔，不降祸与你的百姓。求你记念你的仆人亚伯拉罕、以撒、雅各——你曾指着自己起誓说：我必使你们的后裔像天上的星那样多……"\n\n摩西的代祷有三个根基：①神的拣选（"你的百姓"）；②神的圣名（不让埃及人议论）；③神的应许（记念亚伯拉罕、以撒、雅各）。不看人的光景——不管他们是否悔改，神开始的工作神必完成。\n\n于是耶和华后悔，不把所说的祸降与他的百姓。\n\n摩西转身下山——手里拿着两块法版。这版是两面写的，是神的工作，字是神写的。',
  choices: [
    { text: '跟随摩西下山——手里紧紧攥着法版。', cons: '摩西下山了。还没到营中，就听见了——不是战争的声音，是跳舞唱歌的声音。走近营地——看到了金牛犊。摩西的怒气一发——他把两块法版从手中扔下去，摔碎在山下。\n\n不是失控。这是一个先知用视觉化的方式告诉百姓：你们已经把约摔碎了。法版碎了——约就碎了。这是最震撼的视觉比喻。\n\n然后摩西毁坏了金牛犊——用火焚烧，磨得粉碎，撒在水面上，叫以色列人喝。黄金变苦水。偶像总是如此。\n\n"凡属耶和华的都要到我这里来！"利未人回应了这个呼召。\n\n但最震撼的还在后面。摩西回到耶和华面前，说了一句穿透所有世纪的话："倘或你肯赦免他们的罪……不然，求你从你所写的册上涂抹我的名。"摩西愿意为百姓舍命。这是旧约代祷的最高峰——预表基督"为我弟兄、我骨肉之亲，就是自己被咒诅，与基督分离，我也愿意"。摩西只是愿望——基督是事实。一千五百年后，另一个人真的从生命册上被涂抹了。不是犯罪被抹去——而是以无罪的代替有罪的。十字架上的呼喊"我的神，我的神，为什么离弃我"，就是他名被涂抹的那一刻。', verse: '出埃及记 32:32 — 摩西说："倘或你肯赦免他们的罪……不然，求你从你所写的册上涂抹我的名。"', next: 'conn_8_9' },
    { text: '等等——神真的"后悔"了吗？', cons: '你注意到经文里那个令人困惑的字："于是耶和华后悔，不把所说的祸降与他的百姓。"\n\n神会后悔？他不是全知、不变的吗？这里的"后悔"是拟人化的表达——不是神改变了他的本质，而是改变了对待人的方式。当摩西以神的圣名和应许为根据代求的时候，神从他的怜悯中发出了"另一种"作为——不是照着人的罪所当得的发怒，而是照着他的约施怜悯。\n\n更震撼的是摩西的代祷内容。他没有说"他们悔改了"——百姓根本没有悔改。他没有说"他们配得"——他们一点都不配。他的代祷依据完全在神那边：你的百姓、你的圣名、你的应许。不看人的光景。这就是真正的代祷——不基于人的回应，而基于神的信实。' , next: 'conn_8_9'}
  ]
},

conn_8_9: {

  quote: '又当为我造圣所，使我可以住在他们中间。', quoteRef:'出埃及记 25:8',
  narrator:'恩典恢复。新法版。新开始。',
  thread: '金牛犊的尘埃落定。摩西再次上山四十昼夜。神重新赐下法版——这次由摩西自己凿出石版（第一次是神造的）。人参与了外表的工作，但内容（刻字）仍由神自己来。然后，神给出了一个惊人的命令：建造会幕。"又当为我造圣所，使我可以住在他们中间。"不是在高高的天上，不是在西奈山顶——在他们中间。出埃及记的真正目的地——不是迦南，是神的同在。',

s9_1: {
  ch:9, chName:'第九章 · 会幕建成', prog:0.92, effect:null,
  narrative: '"你们中间要拿礼物献给耶和华。凡乐意献的，可以拿耶和华的礼物来——金、银、铜、蓝色、紫色、朱红色线、细麻、山羊毛……"\n\n全营的人都来了。\n\n凡心里受感和甘心乐意的都拿耶和华的礼物来——不是被强迫的，不是被威胁的。是乐意的。捐献要甘心情愿，不可勉强，因为捐得乐意的人是神所喜爱的。\n\n男人们带来了金银铜和木料。\n\n妇人们纺线——蓝色紫色朱红色线和细麻。\n\n凡有蓝色紫色朱红色线的、凡有皂荚木的、凡心中有智慧的——都来了。\n\n官长们带来了红玛瑙和别样的宝石。\n\n来献礼物的人太多了。以至于摩西不得不传令全营——"无论男女，不必再为圣所拿什么礼物来。"百姓被拦住了。\n\n这样才拦住他们不再拿礼物来。\n\n见过奉献太多被拦住的教会吗？四十天前，他们在金牛犊脚下奉献——甘心乐意。四十天后，他们为会幕奉献——甘心乐意。神的恩典能转动人的心——从法老的鞭子下，到甘心的奉献中。',
  choices: [
    { text: '你手里有什么？把它献上。', cons: '你把自己有的拿来——不多，也许只是一块铜、一束蓝色线。但你知道，会幕将要由这些点点滴滴构成。每一根线，每一块宝石，每一片木头。每个人的甘心乐意。法老用鞭子逼人建造积货城。神感动人心建造会幕。差别就在这里——一个是奴役，一个是敬拜。\n\n被神赦免和救赎之恩深深触动的人，奉献是拦不住的。每早晨还把甘心献的礼物拿来——奉献不是一次性的。摩西在会幕造好后没有立刻立起帐幕，而是先祝福，然后等候。过去他不等候、采纳了叶忒罗的建议赶着解决问题——现在他学会了：神已经吩咐的，忠心去做；神还没有吩咐的，耐心等候。', verse: '出埃及记 35:21 — 凡心里受感和甘心乐意的都拿耶和华的礼物来，用以做会幕和其中一切的使用，又用以做圣衣。', next: 's9_2' },
    { text: '我好奇——为什么他们从金牛犊到会幕，变化这么大？', cons: '你站在队列中等着献上自己那一份，脑子里在想这个转变。四十天前——这些人把自己的金耳环丢进火里，铸了一只牛犊。现在——这些人把金银铜、宝石、蓝色紫色朱红色线都拿来了。同一批人。\n\n差别在哪里？金牛犊之后，摩西上山重新领受了法版。神宣告了自己的名："耶和华，耶和华，是有怜悯有恩典的神，不轻易发怒，并有丰盛的慈爱和诚实。"神先赦免了他们——然后他们才甘心奉献。不是奉献换赦免，是赦免生出甘心。\n\n你把手里的铜放下。"捐得乐意的人，是神所喜爱的"——不是捐多少，是"乐意"。金牛犊时他们也"乐意"——但那是乐意为自己的私欲。现在这乐意不同——是被恩典浸泡过的乐意。' , next: 's9_2'}
  ]
},

s9_2: {
  ch:9, chName:'第九章 · 会幕建成', prog:0.96, effect:null,
  narrative: '比撒列——犹大支派中户珥的孙子、乌利的儿子——神用灵充满了他，使他有智慧、聪明、知识，能做各样的工。\n\n亚何利亚伯和他一同做工。\n\n会幕一点一点立起来了。\n\n至圣所——四围用幔子隔开，唯有大祭司一年一次带着血才能进入。里面有约柜，里面放着法版——神与百姓立约的凭据。约柜上是施恩座——原文有"怜悯蔽罪座"之意，与罗马书3:25的"挽回祭"是同一个字。法版见证人的罪——但施恩座上的血遮盖了罪。赎罪日，大祭司将血弹在施恩座上——神在血所遮盖的地方与人相会。至圣所与外界完全隔离，唯有借着血、藉着祭司才能进到神面前。\n\n圣所——金灯台用精金锤成，七盏灯照亮圣所（出25:31-40有详细的尺寸和样式）。光从不熄灭——预表基督是世界的光，跟从他的就不在黑暗里走（约8:12）。陈设饼的桌子上摆着十二个饼——代表以色列十二支派常陈设在耶和华面前。不是"满足人的需要"，是人常活在神面前——预表基督是生命的粮，从天上降下来赐生命给世界的。金香坛——香的火只能从铜祭坛取来，凡火不可献上。早晨黄昏都要烧香——代求是持续的，而香坛上的火，来源于祭坛上的血。\n\n外院——铜祭坛。人到神面前的第一步，就是献祭。坛是铜的——审判落在祭物上。四角——祭物的血抹在角上，表明赎罪的能力。洗濯盆用会幕门前伺候妇人的镜子做成（出38:8）。事奉的人进会幕或就近坛前，必须在此洗手洗脚——免得死亡。事奉神的人必须先洁净自己。\n\n建造过程中，圣灵刻意七次重复"照耶和华所吩咐摩西的"。完全的顺服——不多不少，不增不减。',
  choices: [
    { text: '屏住呼吸——会幕要完工了。', cons: '出埃及记的最后十二章——整整十二章——全是在描述会幕的建造。圣经用两章记载创造的事，却用十一章记会幕的事。为什么？因为这对神来说极其重要。神不只是要把以色列人从埃及领出来——他要把埃及从以色列人里面领出来。他要在他们中间设立他的居所。\n\n"又当为我造圣所，使我可以住在他们中间。"这是整本圣经的主题：神渴望与人同住。从伊甸园到会幕、到圣殿、到道成肉身（约1:14"住在我们中间"原文是"支搭帐幕"）、到教会、到新天新地——神的帐幕在人间。\n\n会幕的路径指向一个方向——至圣所。从铜祭坛开始：献祭、流血——没有替代就没有进路。经过洗濯盆：洁净——没有人能以不洁就近圣洁的神。进入圣所：光、粮、香——活在神面前的三个标记。而这一切的终点，是幔子后面的施恩座——在那里，神在血上与人相会。每一步，都指向基督——他是祭物、他是洁净的源头、他是光、他是生命的粮、他是长远活着替我们祈求的大祭司——借着他，我们得以坦然进入至圣所。', verse: '出埃及记 31:3 — 我也以我的灵充满了他，使他有智慧，有聪明，有知识，能做各样的工。', next: 's9_3' },
    { text: '站在会幕院外——进不去的至圣所。', cons: '你站在会幕院外，看着那层层的幔子和隔断。至圣所——只有大祭司一年一次可以进去，带着血。你永远不能。\n\n但你知道这不会永远是最后答案。后来马太记载——耶稣断气的那一刻，"殿里的幔子从上到下裂为两半。"不是从下到上——那是人能做的。是从上到下——是神做的。那裂开的幔子就是他的身体（来10:20）。\n\n出埃及记的会幕有幔子——你只能远远站着。各各他的帐幕，幔子裂开了——你可以坦然进入至圣所。同一只手，曾经在伊甸园东边"安设基路伯和四面转动发火焰的剑"——把守生命树的道路。现在，在十字架上——那只手亲自撕开了幔子。路，打开了。你深吸一口气。总有一天——不在旷野，在圣城。' , next: 's9_3'}
  ]
},

s9_3: {
  ch:9, chName:'第九章 · 会幕建成', prog:0.98, effect:'embers',
  img: 'media/exodus_tabernacle_glory.webp',
  narrative: '正月初一日——出埃及后整整一年。\n\n会幕立起来了。\n\n正月初一——圣经中第一个正月初一是洪水水干、审判结束（创8:13）。第二个正月初一是逾越节、得救（出12:2）。现在是第三个正月初一——立会幕，事奉。每一个正月初一都是新起头。从出埃及到立会幕，整整一年——出埃及是新的开始，立会幕是又一个新开始。\n\n摩西照耶和华所吩咐的，把法版放在约柜里，把施恩座放在柜上。把陈设饼摆列在耶和华面前。在耶和华面前点灯。把金香坛安在法柜前。把燔祭坛安在会幕门前。把洗濯盆安在会幕和坛的中间，盆中盛水。\n\n支搭会幕的过程中，七次重复——"是照耶和华所吩咐他的。"\n\n一切完工了。\n\n百姓站在那里，静默无声。\n\n然后——\n\n云彩遮盖会幕。\n\n耶和华的荣光充满了帐幕。\n\n摩西不能进会幕——因为云彩停在其上，耶和华的荣光充满了帐幕。',
  choices: [
    { text: '跪下。神的荣耀在这里。', cons: '你跪下来。不是因为害怕——这不再像西奈山那样令人发抖。这荣光是家的感觉。温暖、明亮的云彩停在会幕上面——不是高高在上，是降下来，是"住在他们中间"。\n\n出埃及记从"丢在河里"的死亡开场——以耶和华荣光充满帐幕的荣耀收尾。从死亡到救赎、到立约、到同在——这是整卷书的弧线，也是每一个信徒的蒙恩轨迹。出埃及记结束在这里——不是以"从此百姓听话"，而是以"神与人同住"。整卷书的最后几个字：耶和华的荣光充满了帐幕。\n\n而从这一刻起，以色列人的行动完全由云彩决定：云彩收上去就起程，云彩停住就安营。"既不落在神的后面，也不抢在神的前面。"——这是旷野旅程的总原则。', verse: '出埃及记 40:34 — 当时，云彩遮盖会幕，耶和华的荣光就充满了帐幕。', next: 'conn_9_end' },
    { text: '摩西都不能进会幕——神的荣耀太重了。', cons: '你注意到一个细节：摩西不能进会幕，因为耶和华的荣光充满了帐幕。\n\n摩西——那个在山上与神面对面交谈四十天的人，那个看见神背影的人——现在连会幕的门都进不去。不是神拒绝了他——是神的荣耀太厚重了，人承受不住。\n\n但这不是旧约的终点。约翰福音1:14说："道成了肉身，住在我们中间——充充满满地有恩典有真理。""住在我们中间"原文是"支搭帐幕在我们中间"。在出埃及记，神的荣耀在帐幕里——摩西不能进去。在福音书，神的荣耀在耶稣里——小孩子可以爬到他膝上。\n\n出埃及记的会幕，最后不是被废弃——是被成全。这一位比摩西更大，这一位走进的不是人手所造的帐幕，而是天堂的本体。他进去后——幔子裂开了。你站起来，知道有一天——你不只是跪在会幕外的沙地上。' , next: 'conn_9_end'}
  ]
},
